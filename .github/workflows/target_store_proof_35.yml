
name: Pokestock Script 35 Target Proof - Ubuntu 24.04 Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokestock-target-proof-35
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Initialize diagnostics
        id: initialize
        shell: bash
        run: |
          mkdir -p data target35_screenshots
          printf '{"result":"NOT_PROVEN","reason":"Test not completed","observations":[],"products":[]}\n' > data/target_store_probe_35.json
          : > data/target35_install.log
          : > data/target35_browser.log

      - name: Set up Python 3.12
        id: python
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright and Chromium on Ubuntu 24.04
        id: browser
        if: always() && steps.initialize.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cat /etc/os-release | tee -a data/target35_install.log
          python3 -m pip install 'playwright==1.56.0' 2>&1 | tee -a data/target35_install.log
          python3 -m playwright install --with-deps chromium 2>&1 | tee -a data/target35_install.log
          python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); print("Chromium launched successfully"); b.close(); p.stop()' 2>&1 | tee -a data/target35_install.log

      - name: Validate existing Target scanner
        id: scanner
        if: always() && steps.initialize.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/target_store_probe_35.py
          python3 -m py_compile scripts/target_store_probe_35.py

      - name: Test exact-store Target availability
        id: test
        if: always() && steps.browser.outcome == 'success' && steps.scanner.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/target_store_probe_35.py 2>&1 | tee data/target35_browser.log

      - name: Finalize diagnostics even on failure
        id: finalize
        if: always() && steps.initialize.outcome == 'success'
        shell: bash
        env:
          PYTHON_STAGE: ${{ steps.python.outcome }}
          BROWSER_STAGE: ${{ steps.browser.outcome }}
          SCANNER_STAGE: ${{ steps.scanner.outcome }}
          TEST_STAGE: ${{ steps.test.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('data/target_store_probe_35.json')

          try:
              report = json.loads(
                  path.read_text(encoding='utf-8')
              )
              if not isinstance(report, dict):
                  raise ValueError('Invalid report')
          except Exception as error:
              report = {
                  'result': 'NOT_PROVEN',
                  'reason': 'Invalid scanner report: '+str(error),
                  'products': [],
                  'observations': []
              }

          stages = {
              'python': os.getenv('PYTHON_STAGE', 'unknown'),
              'browser': os.getenv('BROWSER_STAGE', 'unknown'),
              'scanner': os.getenv('SCANNER_STAGE', 'unknown'),
              'test': os.getenv('TEST_STAGE', 'unknown')
          }

          report['workflow_stages'] = stages
          report['runner'] = 'ubuntu-24.04'
          report['diagnostic_saved_at'] = (
              datetime.now(timezone.utc).isoformat()
          )

          if stages['browser'] != 'success':
              report['result'] = 'NOT_PROVEN'
              report['reason'] = 'Browser installation or launch failed'
          elif stages['scanner'] != 'success':
              report['result'] = 'NOT_PROVEN'
              report['reason'] = 'Existing scanner missing or invalid'
          elif stages['test'] != 'success':
              report['result'] = 'NOT_PROVEN'
              report['reason'] = 'Target scanner crashed'

          for filename, key in [
              ('data/target35_install.log', 'install_log_tail'),
              ('data/target35_browser.log', 'scan_log_tail')
          ]:
              file = Path(filename)
              if file.exists():
                  report[key] = file.read_text(
                      encoding='utf-8',
                      errors='replace'
                  )[-4500:]

          path.write_text(
              json.dumps(report, indent=2) + '\n',
              encoding='utf-8'
          )

          print('RESULT:', report.get('result'))
          print('STAGES:', stages)
          print('REASON:', report.get('reason', 'None'))
          PY

      - name: Upload diagnostics and browser screenshots
        if: always() && steps.initialize.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: target35-debug-ubuntu24
          path: |
            data/target_store_probe_35.json
            data/target35_install.log
            data/target35_browser.log
            target35_screenshots/
          retention-days: 14
          if-no-files-found: warn

      - name: Commit diagnostic report
        id: publish
        if: always() && steps.finalize.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add data/target_store_probe_35.json

          if ! git diff --cached --quiet; then
            git commit -m 'Script 35 record Target store proof diagnostics'
          fi

          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo 'Diagnostic report published'
              exit 0
            fi

            sleep 5
          done

          exit 1

      - name: Final verdict
        if: always()
        shell: bash
        env:
          PUBLISH_STAGE: ${{ steps.publish.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          path = Path('data/target_store_probe_35.json')

          if not path.exists():
              raise SystemExit(
                  'Setup failed before diagnostics were created'
              )

          report = json.loads(
              path.read_text(encoding='utf-8')
          )

          print('STAGES:', report.get('workflow_stages', {}))
          print('REASON:', report.get('reason', 'None'))
          print(
              'OBSERVATIONS:',
              len(report.get('observations', []))
          )

          if os.getenv('PUBLISH_STAGE') != 'success':
              raise SystemExit(
                  'Could not publish report; inspect uploaded artifact'
              )

          if report.get('result') != 'PROVEN_STORE_PICKUP':
              raise SystemExit(
                  'Store pickup not proven; review diagnostic JSON'
              )

          if not report.get('observations'):
              raise SystemExit(
                  'Report indicates success without observations'
              )

          print(
              'PASS: Explicit store-specific pickup evidence recorded'
          )
          PY
