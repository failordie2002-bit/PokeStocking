name: Pokestock Script 35 Target In-Store Proof Test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokestock-target-proof-35
  cancel-in-progress: false

jobs:
  target-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Pokestock
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium

      - name: Install standalone Target proof scanner
        shell: bash
        run: |
          mkdir -p scripts data
          cat > scripts/target_store_probe_35.py <<'PY'
          #!/usr/bin/env python3
          """Target-specific UI evidence probe."""
          import asyncio
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from playwright.async_api import async_playwright

          OUT = Path('data')
          OUT.mkdir(exist_ok=True)

          SHOTS = Path('target_probe_35_screenshots')
          SHOTS.mkdir(exist_ok=True)

          STORE = {
              'name': 'Waynesboro',
              'store_id': '2294',
              'address': '811 Town Center Dr',
              'zip': '22980',
              'state': 'VA'
          }

          PRODUCTS = [
              (
                  '1013166578',
                  'Delta Reign Booster Bundle',
                  '2026-11-06'
              ),
              (
                  '1011407490',
                  '30th Celebration Booster Bundle',
                  '2026-10-02'
              ),
              (
                  '94884496',
                  'Phantasmal Flames Booster Bundle',
                  '2025-11-14'
              ),
              (
                  '95082118',
                  'Ascended Heroes Elite Trainer Box',
                  None
              )
          ]

          BLOCKED = re.compile(
              r'access denied|attention required|'
              r'verify you are human|captcha|'
              r'unusual traffic|request blocked|cloudflare',
              re.I
          )

          async def screenshot(page, tcin, step):
              try:
                  await page.screenshot(
                      path=str(
                          SHOTS / f'{tcin}_{step}.png'
                      ),
                      full_page=False,
                      timeout=8000
                  )
              except Exception:
                  pass

          async def content_around_store(page):
              """Require store identity and status in one UI node."""
              return await page.evaluate(
                  '''() => {
                    const rows = document.querySelectorAll(
                      'li,article,[role="option"],' +
                      '[role="radio"],[data-test*="store"],' +
                      '[data-testid*="store"]'
                    );
                    const matches = [];

                    for (const node of rows) {
                      const s = (node.innerText || '')
                        .replace(/\\s+/g, ' ')
                        .trim();

                      if (s.length > 650 || s.length < 15)
                        continue;

                      if (!/Waynesboro/i.test(s))
                        continue;

                      const store =
                        /811\\s+Town\\s+Center/i.test(s) ||
                        /\\b2294\\b/.test(s) ||
                        /\\b22980\\b/.test(s);

                      const stock = s.match(
                        /\\b(in stock|out of stock|limited stock|available for pickup|pickup available|unavailable for pickup|not available|sold out)\\b/i
                      );

                      if (store && stock) {
                        matches.push({
                          text: s,
                          stock_label: stock[0],
                          tag: node.tagName
                        });
                      }
                    }

                    return matches.slice(0, 5);
                  }'''
              )

          async def click_button(page, names):
              for name in names:
                  pattern = re.compile(name, re.I)

                  for role in ('button', 'link'):
                      locator = page.get_by_role(
                          role,
                          name=pattern
                      )

                      try:
                          if (
                              await locator.count() > 0
                              and await locator.first.is_visible()
                          ):
                              await locator.first.click(
                                  timeout=5000
                              )
                              await page.wait_for_timeout(1200)
                              return f'{role}:{name}'
                      except Exception:
                          pass

              return None

          async def interact(page):
              steps = []

              candidates = await content_around_store(page)

              if candidates:
                  return candidates, steps

              clicked = await click_button(
                  page,
                  [
                      'check other stores',
                      'edit store',
                      'change store',
                      'select store',
                      'find in store'
                  ]
              )

              if clicked:
                  steps.append(
                      'opened_store_picker=' + clicked
                  )
              else:
                  steps.append(
                      'store_picker_control_not_found'
                  )

              await page.wait_for_timeout(1000)

              candidates = await content_around_store(page)

              if candidates:
                  return candidates, steps

              inputs = page.locator(
                  'input[type="search"],'
                  'input[placeholder*="ZIP" i],'
                  'input[placeholder*="city" i],'
                  'input[placeholder*="store" i]'
              )

              for i in range(min(await inputs.count(), 6)):
                  el = inputs.nth(i)

                  try:
                      if (
                          await el.is_visible()
                          and await el.is_enabled()
                      ):
                          await el.fill(
                              '22980',
                              timeout=3500
                          )

                          steps.append(
                              'searched_zip_22980'
                          )

                          found = await click_button(
                              page,
                              [
                                  'find stores',
                                  'search stores',
                                  'search'
                              ]
                          )

                          if not found:
                              await el.press(
                                  'Enter',
                                  timeout=3500
                              )

                          await page.wait_for_timeout(2200)

                          candidates = (
                              await content_around_store(page)
                          )

                          if candidates:
                              return candidates, steps

                          break

                  except Exception as e:
                      steps.append(
                          'zip_search_error='
                          + type(e).__name__
                      )

              return [], steps

          def matching_network_stock(data, tcin):
              """Inspect explicit store-level fulfillment nodes."""

              def walk(node, depth=0):
                  if depth > 12:
                      return []

                  if isinstance(node, dict):
                      matches = []

                      for k, v in node.items():
                          if (
                              k == 'store_options'
                              and isinstance(v, list)
                          ):
                              matches.extend(
                                  x for x in v
                                  if isinstance(x, dict)
                              )

                          elif isinstance(v, (dict, list)):
                              matches.extend(
                                  walk(v, depth + 1)
                              )

                      return matches

                  if isinstance(node, list):
                      return [
                          y
                          for x in node[:50]
                          for y in walk(x, depth + 1)
                      ]

                  return []

              for opt in walk(data):
                  identifiers = [
                      opt.get(k)
                      for k in (
                          'location_id',
                          'store_id',
                          'locationId',
                          'storeId',
                          'id'
                      )
                  ]

                  for k in (
                      'store',
                      'location',
                      'store_details'
                  ):
                      child = opt.get(k)

                      if isinstance(child, dict):
                          identifiers += [
                              child.get(c)
                              for c in (
                                  'id',
                                  'store_id',
                                  'location_id',
                                  'storeId'
                              )
                          ]

                  if '2294' not in {
                      str(x)
                      for x in identifiers
                      if x is not None
                  }:
                      continue

                  pickup = (
                      opt.get('order_pickup')
                      or opt.get('pickup')
                      or {}
                  )

                  if not isinstance(pickup, dict):
                      continue

                  status = str(
                      pickup.get('availability_status')
                      or pickup.get('availability')
                      or ''
                  ).upper()

                  if status in {
                      'IN_STOCK',
                      'OUT_OF_STOCK',
                      'LIMITED_STOCK',
                      'NOT_AVAILABLE',
                      'NOT_SOLD_IN_STORE',
                      'UNAVAILABLE'
                  }:
                      return {
                          'text': (
                              f'Official fulfillment: '
                              f'store 2294; {tcin}; '
                              f'pickup {status}'
                          ),
                          'stock_label': status,
                          'tag': 'network_store_options',
                          'source': (
                              'browser_observed_fulfillment'
                          )
                      }

              return None

          async def probe(browser, tcin, name, release):
              page = await browser.new_page(
                  viewport={
                      'width': 1280,
                      'height': 900
                  },
                  locale='en-US',
                  timezone_id='America/New_York'
              )

              url = (
                  'https://www.target.com/p/-/A-'
                  + tcin
              )

              network = []
              pending = []

              async def inspect(response):
                  try:
                      if (
                          'redsky.target.com'
                          not in response.url
                      ):
                          return

                      if (
                          'tcin=' + tcin
                          not in response.url
                      ):
                          return

                      if 'fulfillment' not in response.url:
                          return

                      if response.status != 200:
                          return

                      data = await response.json()

                      ev = matching_network_stock(
                          data,
                          tcin
                      )

                      if ev:
                          network.append(ev)

                  except Exception:
                      pass

              page.on(
                  'response',
                  lambda response: pending.append(
                      asyncio.create_task(
                          inspect(response)
                      )
                  )
              )

              rec = {
                  'tcin': tcin,
                  'product': name,
                  'release_date': release,
                  'url': url,
                  'store': STORE,
                  'status': 'unknown',
                  'reason': 'not_tested',
                  'http_status': None,
                  'steps': [],
                  'store_evidence': None
              }

              try:
                  resp = await page.goto(
                      url,
                      wait_until='domcontentloaded',
                      timeout=45000
                  )

                  rec['http_status'] = (
                      resp.status if resp else None
                  )

                  await page.wait_for_timeout(4500)

                  await screenshot(
                      page,
                      tcin,
                      'initial'
                  )

                  text = (
                      await page.locator('body').inner_text(
                          timeout=8000
                      )
                  )[:2500]

                  title = await page.title()

                  if (
                      rec['http_status'] in (401, 403, 429)
                      or BLOCKED.search(title)
                      or BLOCKED.search(text[:500])
                  ):
                      rec.update(
                          status='blocked',
                          reason=(
                              'retailer_access_denied_or_challenge'
                          ),
                          title=title[:200]
                      )
                      return rec

                  combined = (
                      text + ' ' + title
                  ).lower()

                  if (
                      'pokemon' not in combined
                      and 'pokémon' not in combined
                  ):
                      rec.update(
                          reason='product_page_not_confirmed',
                          title=title[:200]
                      )
                      return rec

                  candidates, steps = await interact(page)

                  if pending:
                      await asyncio.gather(
                          *pending,
                          return_exceptions=True
                      )

                  if network:
                      candidates = network

                  rec['steps'] = steps

                  await screenshot(
                      page,
                      tcin,
                      'after_store_selection'
                  )

                  if candidates:
                      ev = candidates[0]

                      rec['status'] = (
                          'store_specific_observation'
                      )

                      rec['reason'] = (
                          'matched_store_identifier_and_'
                          'availability_status'
                      )

                      rec['store_evidence'] = ev

                      rec['observed_at'] = (
                          datetime.now(
                              timezone.utc
                          ).isoformat()
                      )

                  else:
                      rec['reason'] = (
                          'no_unambiguous_store_specific_'
                          'availability_visible'
                      )

              except Exception as e:
                  rec.update(
                      status='error',
                      reason=(
                          type(e).__name__
                          + ': '
                          + str(e)[:220]
                      )
                  )

                  await screenshot(
                      page,
                      tcin,
                      'error'
                  )

              finally:
                  await page.close()

              return rec

          async def main():
              results = []

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=['--no-sandbox']
                  )

                  for product in PRODUCTS:
                      r = await probe(
                          browser,
                          *product
                      )

                      results.append(r)

                      print(
                          r['tcin'],
                          r['status'],
                          r['reason'],
                          flush=True
                      )

                      if r['status'] == 'blocked':
                          break

                  await browser.close()

              report = {
                  'version': '35.0',
                  'checked_at': (
                      datetime.now(
                          timezone.utc
                      ).isoformat()
                  ),
                  'purpose': (
                      'Store-specific Target UI '
                      'feasibility test'
                  ),
                  'store': STORE,
                  'product_checks': results,
                  'store_specific_observations': [
                      r for r in results
                      if r['status']
                      == 'store_specific_observation'
                  ],
                  'result': (
                      'PROVEN'
                      if any(
                          r['status']
                          == 'store_specific_observation'
                          for r in results
                      )
                      else 'NOT_PROVEN'
                  ),
                  'limitations': [
                      'Generic product page stock is '
                      'not store-specific evidence.',
                      'Pickup does not guarantee '
                      'physical shelf inventory.',
                      'A browser block means Unknown, '
                      'not Out of Stock.',
                      'No anti-bot bypass is used.'
                  ]
              }

              (
                  OUT / 'target_store_probe_35.json'
              ).write_text(
                  json.dumps(
                      report,
                      indent=2
                  ) + '\n',
                  encoding='utf-8'
              )

              print(
                  json.dumps(
                      {
                          'result': report['result'],
                          'tested': len(results),
                          'observations': len(
                              report[
                                  'store_specific_observations'
                              ]
                          )
                      },
                      indent=2
                  )
              )

          if __name__ == '__main__':
              asyncio.run(main())
          PY
          python -m py_compile scripts/target_store_probe_35.py

      - name: Test store-specific availability
        run: python scripts/target_store_probe_35.py

      - name: Save evidence screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-waynesboro-proof-35
          path: |
            data/target_store_probe_35.json
            target_probe_35_screenshots/
          if-no-files-found: warn

      - name: Publish diagnostic results
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            scripts/target_store_probe_35.py \
            data/target_store_probe_35.json

          if git diff --cached --quiet; then
            echo 'Nothing new to publish'
          else
            git commit -m \
              'Script 35 Target inventory proof results'
          fi

          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo 'Report published'
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep 5
          done

      - name: Fail unless store evidence is proven
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          d = json.loads(
              Path(
                  'data/target_store_probe_35.json'
              ).read_text()
          )

          if d['result'] != 'PROVEN':
              raise SystemExit(
                  'NOT PROVEN: No exact-store '
                  'availability observation was obtained. '
                  'Inspect the published diagnostic report. '
                  'No stock claim has been made.'
              )

          for x in d['store_specific_observations']:
              assert x['store']['store_id'] == '2294'
              assert x['store_evidence']['stock_label']

          print(
              'PROVEN: Exact-store availability '
              'evidence was retrieved.'
          )
          PY
