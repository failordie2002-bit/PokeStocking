name: Pokestock Script 36 External Alert Bridge

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

concurrency:
  group: pokestock-monitor
  cancel-in-progress: false

jobs:
  alert-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parsing library
        run: python -m pip install 'requests==2.32.3' 'beautifulsoup4==4.12.3'

      - name: Install full alert collector and page integration
        shell: bash
        run: |
          mkdir -p data scripts assets
          cat > scripts/external_alert_bridge_36.py <<'PY'
          """Public alert-page bridge. Reports leads, NEVER confirms current stock."""
          import hashlib
          import json
          import re
          import sys
          import time
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from urllib.parse import urlparse, urljoin
          from urllib.robotparser import RobotFileParser
          from zoneinfo import ZoneInfo
          import requests
          from bs4 import BeautifulSoup

          DATA = Path('data')
          NOW = datetime.now(timezone.utc)
          UA = 'PokeStock/36 (collector site: github.com/failordie2002-bit/PokeStocking; public-page research)'
          S = requests.Session()
          S.headers.update({'User-Agent': UA, 'Accept': 'text/html,application/xhtml+xml'})
          EASTERN = ZoneInfo('America/New_York')
          SOURCES = [
              ('PokeRestock — all retailers','https://pokerestockapp.com/restocks/'),
              ('PokeRestock — Best Buy','https://pokerestockapp.com/restocks/best-buy/'),
          ]
          LIVE_LINKS = [
              {'name':'Live multi-retailer alerts', 'url':'https://live.pkmnalerts.com/',
               'note':'External live dashboard — check retailer details directly'},
              {'name':'Best Buy restock history', 'url':'https://pokerestockapp.com/restocks/best-buy/',
               'note':'Public historical alerts, delayed at least 30 minutes'},
              {'name':'Major-retailer alert feed', 'url':'https://pokerestockapp.com/restocks/',
               'note':'Public historical alerts, delayed at least 30 minutes'},
              {'name':'PikaNotify free alerts', 'url':'https://pikanotify.com/',
               'note':'Separate provider; Discord enrollment required for alerts'},
          ]
          DATE = re.compile(r'\b((?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{1,2},\s+20\d{2},\s+\d{1,2}:\d{2}\s*[AP]M\s*ET)\b',re.I)
          VIEW = re.compile(r'View at\s+(.+?)(?:\s*\(opens|\s*$)',re.I)
          ALLOWED = re.compile(r'booster|trainer box|\bETB\b|collection|tin\b|deck|trading card|\bTCG\b|\bpok[eé]mon\b|\bpokemon\b|\bpack\b',re.I)
          BAD = re.compile(r'graded|single card|\bPSA\s*\d|playmat|sleeves|binder|figurine|plush',re.I)

          def save(path,obj):
              target=DATA/path
              tmp=target.with_suffix('.tmp')
              tmp.write_text(json.dumps(obj,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
              tmp.replace(target)

          def clean(x):
              return ' '.join(str(x or '').split())

          def https(url):
              try:
                  u=urlparse(url)
                  return url if u.scheme=='https' and u.hostname else None
              except ValueError:
                  return None

          def is_allowed(url):
              """Honor robots.txt. Treat a blocked/unreadable robots file conservatively."""
              root=f'{urlparse(url).scheme}://{urlparse(url).netloc}'
              try:
                  r=S.get(root+'/robots.txt',timeout=(4,10))
                  if r.status_code in (404,410):
                      return True,'robots_not_present'
                  if r.status_code!=200:
                      return False,'robots_http_'+str(r.status_code)
                  rp=RobotFileParser()
                  rp.parse(r.text.splitlines())
                  return rp.can_fetch(UA,url),'robots_checked'
              except requests.RequestException as e:
                  return False,'robots_unavailable_'+type(e).__name__

          def parse_date(text):
              m=DATE.search(text)
              if not m: return None
              try:
                  value=re.sub(r'\s+',' ',m.group(1).strip())
                  dt=datetime.strptime(value,'%b %d, %Y, %I:%M %p ET')
                  return dt.replace(tzinfo=EASTERN).astimezone(timezone.utc)
              except ValueError:
                  return None

          def parse_items(html,source_url):
              """Only take dated alert rows with a specific retailer link."""
              soup=BeautifulSoup(html,'html.parser')
              rows=[]
              for li in soup.select('li'):
                  full=clean(li.get_text(' ',strip=True))
                  if len(full)>950 or not DATE.search(full):
                      continue
                  dt=parse_date(full)
                  if not dt or dt>NOW+timedelta(minutes=5) or dt<NOW-timedelta(days=90):
                      continue
                  link=None
                  for a in li.find_all('a',href=True):
                      if re.search(r'\bView at\b',clean(a.get_text(' ',strip=True)),re.I):
                          link=a
                          break
                  if link is None: continue
                  retailer_label=clean(link.get_text(' ',strip=True))
                  m=VIEW.search(retailer_label)
                  if not m: continue
                  retailer=clean(m.group(1))
                  href=https(urljoin(source_url,link.get('href','')))
                  if not href: continue
                  raw_date=DATE.search(full)
                  after=full[raw_date.end():]
                  idx=after.lower().find('view at ')
                  if idx==-1: continue
                  before=after[:idx]
                  name=clean(re.sub(r'\$\s*\d[\d,]*(?:\.\d{2})?\s*[·•]?',' ',before))
                  name=re.sub(r'^\s*[·•\-:]+|\s*[·•\-:]+$','',name).strip()
                  # Prefer a real product title in a heading if available.
                  title_node=li.find(['h3','h4'])
                  if title_node:
                      title=clean(title_node.get_text(' ',strip=True))
                      if 8<=len(title)<=230 and ALLOWED.search(title):name=title
                  if len(name)<10 or len(name)>250 or not ALLOWED.search(name) or BAD.search(name):
                      continue
                  price_match=re.search(r'\$\s*([\d,]+\.\d{2})',before)
                  item={'id':hashlib.sha256((retailer+'|'+name+'|'+dt.isoformat()).encode()).hexdigest()[:20],
                        'product_name':name,'retailer':retailer,
                        'reported_at':dt.isoformat(),'first_seen_at':NOW.isoformat(),
                        'price_reported':price_match.group(1).replace(',','') if price_match else None,
                        'retailer_url':href,'source_url':source_url,
                        'evidence_level':'external_delayed_alert',
                        'stock_verified_now':False,'physical_store_verified':False,
                        'availability':'Reported restock — not current stock'}
                  rows.append(item)
              return rows

          def main():
              previous=Path('data/external_alerts_36.json')
              old=[]
              if previous.exists():
                  try:
                      old=json.loads(previous.read_text(encoding='utf-8'))
                  except (ValueError,OSError):pass
              latest={r['id']:r for r in old if isinstance(r,dict) and r.get('id')}
              status=[]
              for name,url in SOURCES:
                  check={'name':name,'url':url,'status':'not_checked','rows':0}
                  status.append(check)
                  permitted,why=is_allowed(url)
                  if not permitted:
                      check['status']='skipped_'+why
                      continue
                  try:
                      r=S.get(url,timeout=(5,14),allow_redirects=True)
                      if r.status_code!=200:
                          check['status']='http_'+str(r.status_code);continue
                      if not r.url.startswith('https://pokerestockapp.com/restocks/'):
                          check['status']='redirected_unexpectedly';continue
                      if len(r.content)>4000000:
                          check['status']='page_too_large';continue
                      items=parse_items(r.text,url)
                      check['rows']=len(items)
                      check['status']='parsed' if items else 'no_dated_alert_rows_found'
                      for item in items:
                          if item['id'] in latest:
                              item['first_seen_at']=latest[item['id']].get('first_seen_at',item['first_seen_at'])
                          latest[item['id']]=item
                  except requests.RequestException as e:
                      check['status']='request_error_'+type(e).__name__
                  time.sleep(0.7)
              cutoff=NOW-timedelta(days=90)
              recent=[x for x in latest.values()
                      if isinstance(x,dict) and x.get('reported_at')
                      and datetime.fromisoformat(x['reported_at'])>=cutoff]
              recent.sort(key=lambda x:x['reported_at'],reverse=True)
              recent=recent[:350]
              save('external_alerts_36.json',recent)
              report={'version':'36.0','updated_at':NOW.isoformat(),
                      'sources':status,'saved_historical_alerts':len(recent),
                      'last_48h':sum(datetime.fromisoformat(x['reported_at'])>=NOW-timedelta(hours=48) for x in recent),
                      'last_48h_best_buy':sum(x['retailer'].lower()=='best buy' and datetime.fromisoformat(x['reported_at'])>=NOW-timedelta(hours=48) for x in recent),
                      'live_external_links':LIVE_LINKS,
                      'important':'External delayed restock reports. No alert proves current inventory or local shelf stock.'}
              save('external_alert_report_36.json',report)
              print(json.dumps(report,indent=2))
          if __name__=='__main__':main()
          PY

          cat > assets/external_alerts_36.js <<'JS'
          (()=>{
            'use strict';
            const online=document.getElementById('online');
            if(!online || document.getElementById('ps36'))return;
            const root=document.createElement('section');
            root.id='ps36';root.className='panel';
            root.style.cssText='margin:8px 0 22px;padding:16px;border-color:#5479aa';
            root.innerHTML=`<div class="section-label">External restock intelligence</div>
              <h2>Major Retailer Alert Radar</h2>
              <p class="muted">Direct live alert sources plus publicly reported restocks. These are <b>leads, NOT verified current stock</b>; source website history can be delayed 30+ minutes. Not store-level shelf inventory.</p>
              <div id="ps36links" class="controls"></div>
              <div class="controls"><input id="ps36search" aria-label="Search reported products" placeholder="Search Pokémon sets, retailer, products"><select id="ps36retailer"><option value="">All retailers</option></select><select id="ps36age"><option value="2">Last 48 hours</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="90">History: 90 days</option></select></div>
              <p id="ps36info" class="muted">Loading external alert sources…</p>
              <div id="ps36grid" class="grid"></div>`;
            online.insertBefore(root,online.firstChild);
            const $=id=>root.querySelector('#'+id);
            const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            const valid=u=>{try{let a=new URL(u);return a.protocol==='https:'?a.href:null;}catch{return null;}};
            let alerts=[];let report={};
            const fallbacks=[
              ['Live Pokémon alerts','https://live.pkmnalerts.com/'],
              ['Best Buy alert history','https://pokerestockapp.com/restocks/best-buy/'],
              ['All retailer history','https://pokerestockapp.com/restocks/'],
              ['Free Discord alerts','https://pikanotify.com/']
            ];
            async function get(p){try{let r=await fetch(p+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return await r.json();}catch(e){console.warn(p,e);return null;}}
            function render(){
              const q=$('ps36search').value.toLowerCase().trim();
              const retailer=$('ps36retailer').value;
              const days=Number($('ps36age').value);
              const limit=Date.now()-days*86400000;
              const rows=alerts.filter(x=>{
                const t=Date.parse(x.reported_at||'');
                return Number.isFinite(t)&&t>=limit&&t<=Date.now()+300000&&
                  (!q||[x.product_name,x.retailer].join(' ').toLowerCase().includes(q))&&
                  (!retailer||retailer===x.retailer)&&x.stock_verified_now===false;
              }).slice(0,100);
              const failed=(report.sources||[]).filter(x=>x.status!=='parsed').length;
              $('ps36info').textContent=rows.length+' matching historical reports (showing up to 100). '+
                'Last collected '+(report.updated_at?new Date(report.updated_at).toLocaleString():'unknown')+'. '+
                (failed?failed+' sources unavailable or empty. ':'')+'Open retailer to check current stock.';
              $('ps36grid').innerHTML=rows.map(x=>{
                const at=valid(x.retailer_url),source=valid(x.source_url);
                return `<article class="tile"><span class="pill unknown">Reported restock — not verified now</span>
                  <h3>${esc(x.product_name)}</h3><p>${esc(x.retailer)}</p><p class="muted">Reported: ${esc(new Date(x.reported_at).toLocaleString())}</p>
                  ${x.price_reported?`<p>Reported price: $${esc(x.price_reported)}</p>`:''}
                  ${at?`<a class="action" target="_blank" rel="noopener noreferrer" href="${esc(at)}">Check retailer</a>`:''}
                  ${source?`<a class="action" target="_blank" rel="noopener noreferrer" href="${esc(source)}">Original alert source</a>`:''}
                </article>`;
              }).join('')||'<div class="empty">No matching dated alerts. This does not mean retailers are sold out. Use the live source links above.</div>';
            }
            async function load(){
              const [a,r]=await Promise.all([get('data/external_alerts_36.json'),get('data/external_alert_report_36.json')]);
              alerts=Array.isArray(a)?a:[];report=r&&typeof r==='object'?r:{};
              const links=(report.live_external_links||[]).map(x=>[x.name,x.url]);
              $('ps36links').innerHTML=(links.length?links:fallbacks).map(x=>valid(x[1])?`<a class="action" target="_blank" rel="noopener noreferrer" href="${esc(x[1])}">${esc(x[0])}</a>`:'').join('');
              const sel=$('ps36retailer');
              for(const v of [...new Set(alerts.map(x=>x.retailer).filter(Boolean))].sort()){
                const o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o);
              }
              render();
            }
            ['ps36search','ps36retailer','ps36age'].forEach(id=>$(id).addEventListener('input',render));
            load();
          })();
          JS

      - name: Parse and publish allowed public alert pages
        run: python scripts/external_alert_bridge_36.py

      - name: Add alert radar to Pokestock Online Stock
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html')
          s=html.read_text(encoding='utf-8')
          tag='<script defer src="assets/external_alerts_36.js"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('Cannot install radar: no closing body tag')
              s=s.replace('</body>',tag+'\n</body>',1)
              html.write_text(s,encoding='utf-8')
          assert '<section id="online"' in s
          PY
          node --check assets/external_alerts_36.js
          python -m py_compile scripts/external_alert_bridge_36.py

      - name: Validate no invented inventory
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('data/external_alerts_36.json').read_text())
          r=json.loads(Path('data/external_alert_report_36.json').read_text())
          assert isinstance(a,list)
          assert isinstance(r['sources'],list)
          assert all(x['stock_verified_now'] is False and x['physical_store_verified'] is False for x in a)
          assert all(x['availability']=='Reported restock — not current stock' for x in a)
          print('Alert leads:',len(a),'last 48 hours:',r['last_48h'])
          PY

      - name: Publish findings and page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/external_alert_bridge_36.py assets/external_alerts_36.js data/external_alerts_36.json data/external_alert_report_36.json index.html
          if git diff --cached --quiet; then
            echo 'Nothing changed'
          else
            git commit -m 'Script 36 external major-retailer restock radar'
          fi
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
