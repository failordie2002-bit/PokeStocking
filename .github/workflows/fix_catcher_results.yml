
name: Fix Shipment Catcher Results

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair filters and location fallback
        shell: bash
        run: |
          cat > /tmp/repair.py <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          if 'id="catcherV2"' not in html:
              raise SystemExit("Shipment Catcher V2 missing")

          changes = []

          def replace_one(pattern, replacement, label):
              global html
              html, count = re.subn(
                  pattern, replacement, html,
                  count=1, flags=re.MULTILINE
              )
              if count != 1:
                  raise SystemExit(
                      "Could not update: " + label
                  )
              changes.append(label)

          if "General TCG watch — game unverified" not in html:
              replace_one(
                  r'if\s*\(\s*game\s*&&\s*'
                  r'r\.game\s*!==\s*game\s*\)'
                  r'\s*return false;',
                  '''if(game && r.game!==game &&
                     !(r.type==="watch" && !r.game))
                    return false;''',
                  "TCG game filter"
              )

          if "LOCAL_CITY_CENTERS" not in html:
              anchor = re.search(
                  r'async\s+function\s+geocode\s*\(\s*s\s*\)\s*\{',
                  html
              )
              if not anchor:
                  raise SystemExit("Geocode function missing")

              helper = '''
              const LOCAL_CITY_CENTERS = {
                "staunton|va":[38.1496,-79.0717],
                "waynesboro|va":[38.0685,-78.8895],
                "harrisonburg|va":[38.4496,-78.8689],
                "charlottesville|va":[38.0293,-78.4767],
                "fishersville|va":[38.0990,-78.9692],
                "verona|va":[38.2021,-79.0081],
                "lexington|va":[37.7840,-79.4428],
                "bridgewater|va":[38.3821,-78.9767],
                "elkton|va":[38.4079,-78.6236],
                "crozet|va":[38.0696,-78.7006]
              };

              function approximateCityPoint(s){
                return LOCAL_CITY_CENTERS[
                  norm(s.city)+"|"+norm(s.state)
                ] || null;
              }

              '''
              html = (
                  html[:anchor.start()] +
                  helper +
                  html[anchor.start():]
              )
              changes.append("Local city reference points")

          if "approximateCityPoint(candidate)" not in html:
              replace_one(
                  r'const\s+point\s*=\s*candidate\s*\?'
                  r'\s*resolved\.get\(\s*candidateKey'
                  r'\(\s*candidate\s*\)\s*\)\s*:\s*null\s*;',
                  '''const point=candidate
                    ?(resolved.get(candidateKey(candidate))
                      ||approximateCityPoint(candidate))
                    :approximateCityPoint(record);''',
                  "Location fallback"
              )

          if "approximate:!exact" not in html:
              replace_one(
                  r'const\s+miles\s*=\s*distance'
                  r'\(\s*origin\s*,\s*point\s*\)\s*;'
                  r'\s*if\s*\(\s*miles\s*<=\s*radius\s*\)'
                  r'\s*\{\s*results\.push'
                  r'\(\s*\{\s*record\s*,\s*miles\s*\}\s*\)'
                  r'\s*;\s*\}',
                  '''const exact=Boolean(
                    candidate &&
                    resolved.get(candidateKey(candidate))
                  );
                  const miles=distance(origin,point);

                  if(miles<=radius+(exact?0:10)){
                    results.push({
                      record,
                      miles,
                      approximate:!exact
                    });
                  }''',
                  "Radius fallback"
              )

          if "({record:r,miles,approximate})" not in html:
              replace_one(
                  r'\(\{\s*record:r\s*,\s*miles\s*\}\)\s*=>',
                  '({record:r,miles,approximate})=>',
                  "Approximate distance renderer"
              )

          if 'approximate?"~":""' not in html:
              replace_one(
                  r'\$\{miles\.toFixed\(1\)\}'
                  r'\s*miles\s*straight-line',
                  '''${approximate?"~":""}${miles.toFixed(1)}
                    miles ${approximate
                      ?"from approximate city center"
                      :"straight-line"}''',
                  "Distance labels"
              )

          if "General TCG watch — game unverified" not in html:
              replace_one(
                  r'<p>\$\{esc\(r\.game\s*\|\|\s*'
                  r'"Game unspecified"\)\}</p>',
                  '''<p>${esc(
                    r.game ||
                    (r.type==="watch"
                      ?"General TCG watch — game unverified"
                      :"Game unspecified")
                  )}</p>''',
                  "General watch labels"
              )

          path.write_text(html, encoding="utf-8")
          print("Repairs applied:", ", ".join(changes))
          PY

          python /tmp/repair.py

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No additional changes needed"
          else
            git commit -m "Repair Shipment Catcher results"
            git push
          fi
