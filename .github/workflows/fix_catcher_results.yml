
name: Fix Shipment Catcher Results

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Repair Shipment Catcher
        shell: bash
        run: |
          cat > /tmp/fix_catcher.py <<'PYTHON'
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          if 'id="catcherV2"' not in html:
              raise SystemExit(
                  "ERROR: Shipment Catcher V2 not found."
              )

          changes = []

          # FIX 1:
          # Repair the incorrectly escaped ZIP regex.
          # Correct JavaScript expression: /^\d{5}$/
          bad_zip = r'/^\\d{5}$/'
          good_zip = r'/^\d{5}$/'

          if bad_zip in html:
              html = html.replace(bad_zip, good_zip)
              changes.append("ZIP code validation")

          # FIX 2:
          # Keep general TCG watch windows visible
          # when a particular TCG is selected.
          if '!(r.type==="watch" && !r.game)' not in html:
              pattern = (
                  r'if\s*\(\s*game\s*&&\s*'
                  r'r\.game\s*!==\s*game\s*\)'
                  r'\s*return false;'
              )

              replacement = (
                  'if(game && r.game!==game &&\n'
                  '   !(r.type==="watch" && !r.game))\n'
                  '  return false;'
              )

              html, count = re.subn(
                  pattern, replacement, html, count=1
              )

              if count:
                  changes.append("TCG filtering")

          # FIX 3:
          # Preserve local approximate city fallback.
          if "LOCAL_CITY_CENTERS" not in html:
              helper = '''
              const LOCAL_CITY_CENTERS = {
                "staunton|va":[38.1496,-79.0717],
                "waynesboro|va":[38.0685,-78.8895],
                "harrisonburg|va":[38.4496,-78.8689],
                "charlottesville|va":[38.0293,-78.4767],
                "fishersville|va":[38.0990,-78.9692],
                "verona|va":[38.2021,-79.0081],
                "lexington|va":[37.7840,-79.4428],
                "bridgewater|va":[38.3821,-78.9767],
                "elkton|va":[38.4079,-78.6236],
                "crozet|va":[38.0696,-78.7006]
              };

              function approximateCityPoint(s){
                return LOCAL_CITY_CENTERS[
                  norm(s.city)+"|"+norm(s.state)
                ] || null;
              }

              '''

              match = re.search(
                  r'async\s+function\s+geocode\s*\(\s*s\s*\)\s*\{',
                  html
              )

              if not match:
                  raise SystemExit(
                      "ERROR: Geocode function missing."
                  )

              html = (
                  html[:match.start()] +
                  helper +
                  html[match.start():]
              )
              changes.append("Local city fallback")

          # FIX 4:
          # Verify essential functionality exists.
          required = [
              'id="catcherZip"',
              'id="catcherRadius"',
              'id="catcherRetailer"',
              'id="catcherGame"',
              'id="catcherGPS"',
              'id="catcherResults"',
              "approximateCityPoint",
              "filteredRecords()",
              "async function findZIP()"
          ]

          missing = [
              item for item in required
              if item not in html
          ]

          if missing:
              raise SystemExit(
                  "ERROR: Missing features: " +
                  ", ".join(missing)
              )

          path.write_text(
              html,
              encoding="utf-8"
          )

          print("Shipment Catcher validation complete.")
          print("Applied fixes:", changes)
          print("All essential controls present.")
          PYTHON

          python /tmp/fix_catcher.py

      - name: Commit repaired website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "Website already contains these fixes."
          else
            git commit -m "Fix Shipment Catcher ZIP validation"
            git push
          fi
