
name: Restock Intelligence Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate intelligence database
        shell: bash
        run: |
          cat > /tmp/forecast.py <<'PY'
          import json
          from pathlib import Path
          from collections import defaultdict
          from datetime import datetime, timezone, timedelta
          from statistics import median

          root = Path("data")

          def load(name, fallback):
              try:
                  return json.loads(
                      (root / name).read_text(encoding="utf-8")
                  )
              except (OSError, ValueError):
                  return fallback

          stores = load("physical_inventory_sources.json", [])
          reports = load("v34_public_sightings.json", [])
          history = load("restock_observations.json", [])

          if not isinstance(stores, list):
              stores = []
          if not isinstance(reports, list):
              reports = []
          if not isinstance(history, list):
              history = []

          index = {
              s.get("source_id"): s
              for s in stores
              if isinstance(s, dict) and s.get("source_id")
          }

          groups = defaultdict(set)
          sources = defaultdict(set)
          now = datetime.now(timezone.utc)

          for r in reports + history:
              if not isinstance(r, dict):
                  continue

              if r.get("report_status") not in (
                  "reported_in_stock",
                  "verified_in_stock",
                  "confirmed_delivery"
              ):
                  continue

              sid = r.get("store_id")

              if sid not in index:
                  continue

              raw = (
                  r.get("observed_at") or
                  r.get("reported_at_approx")
              )

              if not raw:
                  continue

              try:
                  d = datetime.fromisoformat(
                      str(raw).replace("Z", "+00:00")
                  )

                  if d.tzinfo is None:
                      d = d.replace(tzinfo=timezone.utc)

                  d = d.astimezone(timezone.utc)

              except (ValueError, TypeError):
                  continue

              if not (
                  now - timedelta(days=180) <= d <= now
              ):
                  continue

              game = str(
                  r.get("game") or "unknown"
              ).lower()

              groups[(sid, game)].add(d.date())

              if r.get("source_url"):
                  sources[(sid, game)].add(
                      r["source_url"]
                  )

          result = []

          for (sid, game), days in groups.items():
              days = sorted(days)

              gaps = [
                  (b - a).days
                  for a, b in zip(days, days[1:])
                  if 2 <= (b - a).days <= 45
              ]

              item = {
                  "store_id": sid,
                  "retailer": index[sid].get("chain"),
                  "city": index[sid].get("city"),
                  "state": index[sid].get("state"),
                  "game": game,
                  "last_observed_date":
                      days[-1].isoformat(),
                  "observation_count": len(days),
                  "forecast_type":
                      "insufficient_evidence",
                  "confidence": "insufficient",
                  "earliest_date": None,
                  "latest_date": None,
                  "source_urls": sorted(
                      sources[(sid, game)]
                  )[:3]
              }

              if len(days) >= 3 and len(gaps) >= 2:
                  interval = median(gaps)

                  spread = median(
                      abs(x - interval)
                      for x in gaps
                  )

                  if spread <= max(
                      3, interval * 0.4
                  ):
                      step = max(2, round(interval))

                      target = (
                          days[-1] +
                          timedelta(days=step)
                      )

                      while target < now.date():
                          target += timedelta(days=step)

                      margin = max(
                          2,
                          round(spread * 2),
                          round(interval * 0.2)
                      )

                      item.update({
                          "forecast_type":
                              "historical_estimate",
                          "confidence":
                              "medium"
                              if len(days) >= 5
                              else "low",
                          "earliest_date": (
                              target -
                              timedelta(days=margin)
                          ).isoformat(),
                          "latest_date": (
                              target +
                              timedelta(days=margin)
                          ).isoformat()
                      })

              result.append(item)

          root.mkdir(exist_ok=True)

          output = {
              "generated_at": now.isoformat(),
              "forecasts": result
          }

          (
              root / "restock_intelligence.json"
          ).write_text(
              json.dumps(output, indent=2) + "\n",
              encoding="utf-8"
          )

          print("Evidence series:", len(result))
          print(
              "Historical forecasts:",
              sum(
                  bool(x["earliest_date"])
                  for x in result
              )
          )
          PY

          python /tmp/forecast.py

      - name: Commit intelligence database
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/restock_intelligence.json

          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Update restock intelligence data"
            git push
          fi
