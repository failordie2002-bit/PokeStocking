
name: Restock Intelligence Daily

on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate forecasts and repair integration
        shell: bash
        run: |
          cat > /tmp/build.py <<'PY'
          import json
          import re
          import statistics
          from collections import defaultdict
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          root = Path("data")
          now = datetime.now(timezone.utc)

          def read(name, default):
              try:
                  return json.loads(
                      (root / name).read_text(encoding="utf-8")
                  )
              except (OSError, ValueError):
                  return default

          def parse_date(value):
              if not value:
                  return None
              try:
                  d = datetime.fromisoformat(
                      str(value).replace("Z", "+00:00")
                  )
                  if d.tzinfo is None:
                      d = d.replace(tzinfo=timezone.utc)
                  return d.astimezone(timezone.utc)
              except (TypeError, ValueError):
                  return None

          def norm(value):
              return str(value or "").strip().lower()

          stores = read("physical_inventory_sources.json", [])
          sightings = read("v34_public_sightings.json", [])
          history = read("restock_observations.json", [])

          if not isinstance(stores, list):
              stores = []
          if not isinstance(sightings, list):
              sightings = []
          if not isinstance(history, list):
              history = []

          by_id = {
              s["source_id"]: s
              for s in stores
              if isinstance(s, dict) and s.get("source_id")
          }

          by_location = defaultdict(list)

          for s in stores:
              if not isinstance(s, dict):
                  continue
              k = (
                  norm(s.get("chain")),
                  norm(s.get("city")),
                  norm(s.get("state"))
              )
              by_location[k].append(s)

          observations = defaultdict(list)
          seen = set()

          for r in sightings + history:
              if not isinstance(r, dict):
                  continue

              if r.get("report_status") not in (
                  "reported_in_stock",
                  "verified_in_stock",
                  "confirmed_delivery"
              ):
                  continue

              d = parse_date(
                  r.get("observed_at") or
                  r.get("reported_at_approx")
              )

              if not d or d > now:
                  continue

              sid = r.get("store_id")

              if sid not in by_id:
                  matches = by_location[(
                      norm(r.get("retailer")),
                      norm(r.get("city")),
                      norm(r.get("state"))
                  )]

                  if len(matches) != 1:
                      continue

                  sid = matches[0].get("source_id")

              if sid not in by_id:
                  continue

              game = norm(r.get("game") or "unknown")
              day = d.date().isoformat()
              unique = (sid, game, day)

              if unique in seen:
                  continue

              seen.add(unique)

              observations[(sid, game)].append({
                  "date": day,
                  "source_url": r.get("source_url") or ""
              })

          forecasts = []

          for (sid, game), reports in observations.items():
              store = by_id[sid]

              dates = sorted({
                  datetime.fromisoformat(x["date"]).date()
                  for x in reports
              })

              dates = [
                  d for d in dates
                  if d >= (now - timedelta(days=180)).date()
              ]

              if not dates:
                  continue

              gaps = [
                  (b - a).days
                  for a, b in zip(dates, dates[1:])
                  if 2 <= (b - a).days <= 45
              ]

              entry = {
                  "store_id": sid,
                  "retailer": store.get("chain"),
                  "city": store.get("city"),
                  "state": store.get("state"),
                  "game": game,
                  "last_observed_date": dates[-1].isoformat(),
                  "observation_count": len(dates),
                  "confidence": "insufficient",
                  "forecast_type": "insufficient_evidence",
                  "earliest_date": None,
                  "latest_date": None,
                  "source_urls": list(dict.fromkeys(
                      r["source_url"]
                      for r in reports if r["source_url"]
                  ))[:3]
              }

              if len(dates) >= 3 and len(gaps) >= 2:
                  interval = statistics.median(gaps)

                  variation = statistics.median([
                      abs(g - interval) for g in gaps
                  ])

                  if variation <= max(3, interval * 0.4):
                      step = max(2, round(interval))
                      target = dates[-1] + timedelta(days=step)

                      while target < now.date():
                          target += timedelta(days=step)

                      margin = max(
                          2,
                          round(variation * 2),
                          round(interval * 0.2)
                      )

                      entry.update({
                          "confidence": (
                              "medium" if len(dates) >= 5
                              else "low"
                          ),
                          "forecast_type": "historical_estimate",
                          "earliest_date": (
                              target - timedelta(days=margin)
                          ).isoformat(),
                          "latest_date": (
                              target + timedelta(days=margin)
                          ).isoformat(),
                          "median_interval_days": interval
                      })

              forecasts.append(entry)

          root.mkdir(exist_ok=True)

          (root / "restock_intelligence.json").write_text(
              json.dumps({
                  "generated_at": now.isoformat(),
                  "stores_with_evidence": len({
                      f["store_id"] for f in forecasts
                  }),
                  "forecasts": forecasts
              }, indent=2) + "\n",
              encoding="utf-8"
          )

          print("Forecast database generated.")
          print("Evidence records:", len(forecasts))
          print("Estimated date windows:", sum(
              bool(f["earliest_date"]) for f in forecasts
          ))

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          start_marker = "<!-- POKESTOCK CATCHER V3 START -->"
          end_marker = "<!-- POKESTOCK CATCHER V3 END -->"

          if start_marker not in html or end_marker not in html:
              raise SystemExit("Shipment Catcher V3 not found.")

          if "POKESTOCK INTELLIGENCE V2" in html:
              print("Integration already installed.")
          else:
              start = html.index(start_marker)
              end = html.index(end_marker, start)

              before = html[:start]
              block = html[start:end]
              after = html[end:]

              def replace_once(pattern, replacement):
                  global block
                  block, count = re.subn(
                      pattern,
                      lambda match: replacement,
                      block,
                      count=1
                  )
                  if count != 1:
                      raise SystemExit(
                          "Integration pattern missing: " + pattern
                      )

              replace_once(
                  r"let\s+watches\s*=\s*\[\s*\]\s*;",
                  """let watches=[];
                  let intelligence=[]; // POKESTOCK INTELLIGENCE V2"""
              )

              replace_once(
                  r"const\s+ev\s*=\s*evidence\(s\)\s*;",
                  """const ev=evidence(s);
                  const estimates=intelligence.filter(x=>
                    x.store_id===s.source_id &&
                    (!game || norm(x.game)===norm(game))
                  );"""
              )

              replace_once(
                  r"rows\.push\(\{\s*s,reports,watch,category,",
                  "rows.push({s,reports,watch,estimates,category,"
              )

              replace_once(
                  r"const\s+url\s*=\s*safeUrl\(",
                  """const forecast=r.estimates.find(x=>
                    x.earliest_date && x.latest_date
                  );
                  const lastEvidence=r.estimates.find(x=>
                    x.last_observed_date
                  );
                  const url=safeUrl("""
              )

              replace_once(
                  r"const\s+label\s*=\s*latest",
                  """const label=forecast
                    ? "Historical estimate available"
                    : latest"""
              )

              replace_once(
                  re.escape("${next?`"),
                  """${forecast?`
                    <p><strong>Estimated restock window:</strong></p>
                    <p class="cv3-date">
                      ${esc(date(forecast.earliest_date))}
                      –
                      ${esc(date(forecast.latest_date))}
                    </p>
                    <p>
                      ${esc(forecast.confidence)} confidence,
                      based on ${forecast.observation_count}
                      distinct observed dates.
                      Not a confirmed delivery.
                    </p>
                  `:lastEvidence?`
                    <p>
                      <strong>Last positive report:</strong>
                      ${esc(date(lastEvidence.last_observed_date))}
                    </p>
                    <p>
                      Insufficient evidence for a reliable
                      future restock date.
                    </p>
                  `:""}
                  ${next?`"""
              )

              replace_once(
                  r"const\s*\[\s*s\s*,\s*r\s*,\s*w\s*\]"
                  r"\s*=\s*await\s+Promise\.all\(\[",
                  "const [s,r,w,i]=await Promise.all(["
              )

              replace_once(
                  r'json\("data/shipments\.json",\{\}\)',
                  '''json("data/shipments.json",{}),
                  json("data/restock_intelligence.json",{})'''
              )

              replace_once(
                  r"stores\s*=\s*Array\.isArray\(s\)\s*\?\s*s\s*:\s*\[\s*\]\s*;",
                  """stores=Array.isArray(s)?s:[];
                  intelligence=Array.isArray(i.forecasts)
                    ?i.forecasts:[];"""
              )

              html = before + block + after
              path.write_text(html, encoding="utf-8")
              print("Shipment Catcher integration installed.")

          PY

          python /tmp/build.py

      - name: Validate generated files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("data/restock_intelligence.json")
              .read_text(encoding="utf-8")
          )

          assert isinstance(data["forecasts"], list)

          html = Path("index.html").read_text(
              encoding="utf-8"
          )

          assert "POKESTOCK INTELLIGENCE V2" in html
          assert "data/restock_intelligence.json" in html

          print("Database and integration validated.")
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html data/restock_intelligence.json

          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Repair restock intelligence integration"
            git push
          fi
