
name: Pokestock Script 42 Fix Social Discovery Blocking Homepage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pokestock_layout_42.yml'

permissions:
  contents: write

concurrency:
  group: pokestock-frontend-upgrade
  cancel-in-progress: false

jobs:
  fix-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out current Pokestock
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix visible legacy section and make navigation sticky
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY42'
          from pathlib import Path

          css_path = Path('assets/pokestock2.css')
          html_path = Path('index.html')
          css = css_path.read_text(encoding='utf-8')
          html = html_path.read_text(encoding='utf-8')

          required = [
              'id="psgeo"',
              'assets/pokestock2.js',
              'assets/pokestock2.css',
          ]
          for item in required:
              if item not in html:
                  raise SystemExit(
                      'Expected existing site reference missing: ' + item
                  )

          marker = '/* POKESTOCK SCRIPT 42 FIX - VERSION 2 */'
          patch = '''
          /* POKESTOCK SCRIPT 42 FIX - VERSION 2 */

          /* Hide old standalone Social Discovery in Pokestock 2.0. */
          body.ps2-ready > #psgeo {
            display: none !important;
          }

          /* Keep the streamlined four-tab navigation visible. */
          body.ps2-ready #ps2root .ps2top {
            position: relative;
            top: auto;
            z-index: 10;
          }

          body.ps2-ready #ps2root .ps2tabs {
            position: sticky;
            top: 0;
            z-index: 1200;
            background: #10172af7;
            backdrop-filter: blur(16px);
            box-shadow: 0 9px 25px #050a1988;
          }

          html {
            scroll-padding-top: 66px;
          }
          '''

          if marker not in css:
              css = css.rstrip() + '\n' + patch + '\n'

          # Make browsers request the updated CSS.
          old_tag = 'href="assets/pokestock2.css"'
          new_tag = 'href="assets/pokestock2.css?v=42"'

          if old_tag in html:
              html = html.replace(old_tag, new_tag, 1)
          elif new_tag not in html:
              raise SystemExit(
                  'Pokestock CSS link changed; stopped safely'
              )

          assert css.count(marker) == 1
          assert html.count(new_tag) == 1

          css_path.write_text(css, encoding='utf-8')
          html_path.write_text(html, encoding='utf-8')

          print(
              'Layout patch installed: '
              'old Social Discovery hidden; main tabs sticky'
          )
          PY42

      - name: Test selectors and preserve existing features
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY42_TEST'
          from pathlib import Path

          css = Path('assets/pokestock2.css').read_text(
              encoding='utf-8'
          )
          js = Path('assets/pokestock2.js').read_text(
              encoding='utf-8'
          )
          html = Path('index.html').read_text(
              encoding='utf-8'
          )

          # Ignore CSS whitespace to avoid the previous test error.
          normalized = ''.join(css.split())

          assert (
              'body.ps2-ready>#psgeo{display:none!important;}'
              in normalized
          ), 'Legacy Social Discovery not hidden'

          assert (
              'body.ps2-ready#ps2root.ps2tabs'
              '{position:sticky;top:0;z-index:1200;'
              in normalized
          ), 'Sticky tabs not enabled'

          assert (
              'href="assets/pokestock2.css?v=42"'
              in html
          ), 'Updated stylesheet reference missing'

          features = (
              'ps2-discover',
              'ps2-near',
              'ps2-social',
              'ps2-forecast',
              'ps2Map',
              'ps2Feed',
              'ps2ForecastBody',
              'ps2Advanced',
              'watchPosition',
              'router.project-osrm.org',
          )

          for feature in features:
              assert feature in js, (
                  'Existing feature missing: ' + feature
              )

          assert 'id="psgeo"' in html

          print(
              'SCRIPT 42 CORRECTED PASSED: '
              'legacy panel hidden; '
              'four tabs sticky; '
              'old tools preserved'
          )
          PY42_TEST

          node --check assets/pokestock2.js

      - name: Publish the corrected interface fix
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add index.html assets/pokestock2.css

          if git diff --cached --quiet; then
            echo 'Fix already installed'
            exit 0
          fi

          git commit -m 'Pokestock 42 hide legacy social panel and pin tabs'

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Concurrent change conflict; no force push'
              exit 1
            fi

            if git push origin HEAD:main; then
              echo 'SCRIPT 42 FIX PUBLISHED'
              exit 0
            fi

            sleep 5
          done

          exit 1
