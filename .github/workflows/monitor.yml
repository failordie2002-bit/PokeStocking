
name: PokeStock V8.3 Nationwide Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: pokestock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Discovery Catalogue and Product Images
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install requests beautifulsoup4

      - name: Validate Python scripts
        run: |
          python -m py_compile scripts/monitor.py
          python -m py_compile scripts/discover_stores.py
          python -m py_compile scripts/product_images.py

      - name: Save protection baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def read(name):
              return json.loads(
                  Path("data", name).read_text(
                      encoding="utf-8"
                  )
              )

          status = read("status.json")
          stores = read("stores.json")
          shipments = read("shipments.json")

          if not isinstance(status.get("products"), list):
              raise SystemExit("Invalid products")
          if not isinstance(status.get("releases"), list):
              raise SystemExit("Invalid releases")
          if not isinstance(stores, list):
              raise SystemExit("Invalid stores")
          if not isinstance(shipments, dict):
              raise SystemExit("Invalid shipments")

          baseline = {
              "products": len(status["products"]),
              "releases": len(status["releases"]),
              "stores": len(stores),
              "shipments": shipments
          }

          Path("/tmp/pokestock_baseline.json").write_text(
              json.dumps(baseline),
              encoding="utf-8"
          )

          print("Protected baseline:", {
              "products": baseline["products"],
              "releases": baseline["releases"],
              "stores": baseline["stores"]
          })
          PY

      - name: Run nationwide store discovery
        id: discovery
        continue-on-error: true
        run: |
          python scripts/discover_stores.py

      - name: Run product catalogue monitor
        run: |
          python scripts/monitor.py

      - name: Enrich product packaging images
        id: images
        continue-on-error: true
        run: |
          python scripts/product_images.py

      - name: Validate protected data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def read(name):
              return json.loads(
                  Path("data", name).read_text(
                      encoding="utf-8"
                  )
              )

          status = read("status.json")
          stores = read("stores.json")
          shipments = read("shipments.json")
          state = read("discovery_state.json")

          baseline = json.loads(
              Path("/tmp/pokestock_baseline.json").read_text(
                  encoding="utf-8"
              )
          )

          if not isinstance(status.get("products"), list):
              raise SystemExit("Invalid products")
          if not isinstance(status.get("releases"), list):
              raise SystemExit("Invalid releases")
          if not isinstance(stores, list):
              raise SystemExit("Invalid stores")
          if not isinstance(shipments, dict):
              raise SystemExit("Invalid shipments")
          if not isinstance(state, dict):
              raise SystemExit("Invalid discovery state")

          if len(status["products"]) < baseline["products"]:
              raise SystemExit("Products were lost")

          if len(status["releases"]) < baseline["releases"]:
              raise SystemExit("Releases were lost")

          if len(stores) < baseline["stores"]:
              raise SystemExit("Stores were lost")

          for key in ("events", "forecasts"):
              old = baseline["shipments"].get(key, [])
              new = shipments.get(key, [])

              if not isinstance(new, list):
                  raise SystemExit("Invalid shipment data")

              if len(new) < len(old):
                  raise SystemExit(
                      "Shipment records were lost"
                  )

          print("DATA PROTECTION PASSED")
          print("Products:", len(status["products"]))
          print("Releases:", len(status["releases"]))
          print("Stores:", len(stores))
          print(
              "Discovery status:",
              state.get("v822_status")
          )

          images = status.get(
              "v83_image_enrichment", {}
          )
          print("Image enrichment:", images)
          PY

      - name: Commit updated data
        run: |
          git config user.name "pokestock-bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            data/status.json \
            data/stores.json \
            data/shipments.json \
            data/discovery_state.json

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update PokeStock V8.3 data"
            git push origin HEAD:main
          fi

      - name: Print discovery summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state_path = Path(
              "data/discovery_state.json"
          )
          status_path = Path(
              "data/status.json"
          )

          if state_path.exists():
              state = json.loads(
                  state_path.read_text(
                      encoding="utf-8"
                  )
              )

              print("=== STORE DISCOVERY ===")
              print(
                  "State:",
                  state.get("v822_last_state")
              )
              print(
                  "Status:",
                  state.get("v822_status")
              )
              print(
                  "New stores:",
                  state.get("v822_last_new_stores")
              )
              print(
                  "Error:",
                  state.get("v822_last_error")
              )

          if status_path.exists():
              status = json.loads(
                  status_path.read_text(
                      encoding="utf-8"
                  )
              )

              print("=== PRODUCT IMAGES ===")
              print(
                  json.dumps(
                      status.get(
                          "v83_image_enrichment",
                          {}
                      ),
                      indent=2
                  )
              )
          PY

      - name: Report discovery failure
        if: steps.discovery.outcome == 'failure'
        run: |
          echo "::error::Store discovery failed or was incomplete."
          echo "Review data/discovery_state.json."
          exit 1

      - name: Report image enrichment failure
        if: steps.images.outcome == 'failure'
        run: |
          echo "::error::Product image enrichment failed."
          echo "Review the image enrichment step logs."
          exit 1
