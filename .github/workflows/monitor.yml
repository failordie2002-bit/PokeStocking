
name: PokeStock V8.3 Bulk Nationwide Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: pokestock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Nationwide Stores and Catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 osmium

      - name: Validate Python scripts
        run: |
          python -m py_compile scripts/monitor.py
          python -m py_compile scripts/discover_stores.py
          python -m py_compile scripts/product_images.py
          python -m py_compile scripts/bulk_discovery.py

      - name: Save protection baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def read(name):
              return json.loads(
                  Path("data", name).read_text(
                      encoding="utf-8"
                  )
              )

          status = read("status.json")
          stores = read("stores.json")
          shipments = read("shipments.json")

          if not isinstance(status.get("products"), list):
              raise SystemExit("Invalid products")
          if not isinstance(status.get("releases"), list):
              raise SystemExit("Invalid releases")
          if not isinstance(stores, list):
              raise SystemExit("Invalid stores")
          if not isinstance(shipments, dict):
              raise SystemExit("Invalid shipments")

          baseline = {
              "products": len(status["products"]),
              "releases": len(status["releases"]),
              "stores": len(stores),
              "shipments": shipments
          }

          Path("/tmp/pokestock_baseline.json").write_text(
              json.dumps(baseline),
              encoding="utf-8"
          )

          print("Protected baseline:", {
              "products": baseline["products"],
              "releases": baseline["releases"],
              "stores": baseline["stores"]
          })
          PY

      - name: Run nationwide bulk discovery
        id: bulk
        continue-on-error: true
        timeout-minutes: 30
        run: |
          python scripts/bulk_discovery.py

      - name: Run product catalogue monitor
        run: |
          python scripts/monitor.py

      - name: Enrich product images
        id: images
        continue-on-error: true
        run: |
          python scripts/product_images.py

      - name: Validate protected data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def read(name):
              return json.loads(
                  Path("data", name).read_text(
                      encoding="utf-8"
                  )
              )

          status = read("status.json")
          stores = read("stores.json")
          shipments = read("shipments.json")
          state = read("discovery_state.json")

          baseline = json.loads(
              Path("/tmp/pokestock_baseline.json").read_text(
                  encoding="utf-8"
              )
          )

          if not isinstance(status.get("products"), list):
              raise SystemExit("Invalid products")
          if not isinstance(status.get("releases"), list):
              raise SystemExit("Invalid releases")
          if not isinstance(stores, list):
              raise SystemExit("Invalid stores")
          if not isinstance(shipments, dict):
              raise SystemExit("Invalid shipments")
          if not isinstance(state, dict):
              raise SystemExit("Invalid discovery state")

          if len(status["products"]) < baseline["products"]:
              raise SystemExit("Products were lost")

          if len(status["releases"]) < baseline["releases"]:
              raise SystemExit("Releases were lost")

          if len(stores) < baseline["stores"]:
              raise SystemExit("Stores were lost")

          for key in ("events", "forecasts"):
              old = baseline["shipments"].get(key, [])
              new = shipments.get(key, [])

              if not isinstance(new, list):
                  raise SystemExit("Invalid shipment records")

              if len(new) < len(old):
                  raise SystemExit(
                      "Shipment records were lost"
                  )

          print("=== DATA PROTECTION PASSED ===")
          print("Products:", len(status["products"]))
          print("Releases:", len(status["releases"]))
          print("Stores:", len(stores))

          print("=== BULK DISCOVERY ===")
          print(
              "Status:",
              state.get("v83_bulk_status")
          )
          print(
              "Last state:",
              state.get("v83_bulk_last_state")
          )
          print(
              "Completed:",
              state.get("v83_bulk_completed_count", 0),
              "/",
              state.get("v83_bulk_total_states", 51)
          )
          PY

      - name: Commit updated data
        run: |
          git config user.name "pokestock-bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            data/status.json \
            data/stores.json \
            data/shipments.json \
            data/discovery_state.json

          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update PokeStock V8.3 bulk data"
            git push origin HEAD:main
          fi

      - name: Print bulk discovery summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/discovery_state.json")

          if not path.exists():
              print("No discovery state found")
              raise SystemExit(0)

          state = json.loads(
              path.read_text(encoding="utf-8")
          )

          print("=== POKESTOCK V8.3 BULK ===")
          print(
              "Status:",
              state.get("v83_bulk_status")
          )
          print(
              "State:",
              state.get("v83_bulk_last_state")
          )
          print(
              "New stores:",
              state.get("v83_bulk_last_new_stores")
          )
          print(
              "Total stores:",
              state.get("v83_bulk_total_stores")
          )
          print(
              "States completed:",
              state.get("v83_bulk_completed_count", 0)
          )
          print(
              "Error:",
              state.get("v83_bulk_last_error")
          )
          PY

      - name: Report bulk discovery failure
        if: steps.bulk.outcome == 'failure'
        run: |
          echo "::error::Bulk discovery failed."
          echo "Catalogue and existing data were preserved."
          echo "Review bulk discovery logs and state."
          exit 1

      - name: Report image enrichment failure
        if: steps.images.outcome == 'failure'
        run: |
          echo "::error::Image enrichment failed."
          echo "Review product image logs."
          exit 1
