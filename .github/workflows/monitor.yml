name: PokeStock Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Run monitor
        run: python scripts/monitor.py

      - name: Publish updated data
        run: |
          git config user.name "pokestock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update PokeStock product data"
            git push
          fi
