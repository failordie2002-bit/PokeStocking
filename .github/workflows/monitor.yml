
name: PokeStock V8.1 Nationwide Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: pokestock-v81-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Catalogue and Nationwide Store Discovery
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Validate Python scripts
        run: |
          python -m py_compile scripts/monitor.py
          python -m py_compile scripts/discover_stores.py

      - name: Validate existing catalogue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/status.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          assert isinstance(data.get("products"), list)
          assert isinstance(data.get("releases"), list)

          print("Products:", len(data["products"]))
          print("Releases:", len(data["releases"]))
          PY

      - name: Save original catalogue counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          d = json.loads(
              Path("data/status.json").read_text(encoding="utf-8")
          )

          Path("/tmp/pokestock_counts.json").write_text(
              json.dumps({
                  "products": len(d["products"]),
                  "releases": len(d["releases"])
              }),
              encoding="utf-8"
          )
          PY

      - name: Discover real US game stores
        run: |
          python scripts/discover_stores.py

      - name: Update product catalogue
        run: |
          python scripts/monitor.py

      - name: Validate all generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              "data/status.json",
              "data/stores.json",
              "data/shipments.json",
              "data/discovery_state.json"
          ]

          for filename in required:
              p = Path(filename)
              if not p.exists():
                  raise SystemExit("Missing: " + filename)
              json.loads(p.read_text(encoding="utf-8"))
              print("VALID:", filename)

          status = json.loads(
              Path("data/status.json").read_text(encoding="utf-8")
          )
          original = json.loads(
              Path("/tmp/pokestock_counts.json").read_text(
                  encoding="utf-8"
              )
          )

          products = status.get("products", [])
          releases = status.get("releases", [])

          if len(products) < original["products"]:
              raise SystemExit("Product catalogue shrank")

          if len(releases) < original["releases"]:
              raise SystemExit("Release catalogue shrank")

          stores = json.loads(
              Path("data/stores.json").read_text(encoding="utf-8")
          )

          if not isinstance(stores, list):
              raise SystemExit("Invalid store directory")

          print("Products:", len(products))
          print("Releases:", len(releases))
          print("Stores:", len(stores))
          PY

      - name: Commit updated data
        run: |
          git config user.name "pokestock-bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            data/status.json \
            data/stores.json \
            data/shipments.json \
            data/discovery_state.json

          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update PokeStock V8.1 nationwide data"
            git push origin HEAD:main
          fi

      - name: Display results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(
              Path("data/status.json").read_text(encoding="utf-8")
          )
          state = json.loads(
              Path("data/discovery_state.json").read_text(
                  encoding="utf-8"
              )
          )

          print("=== POKESTOCK V8.1 ===")
          print("Products:", len(status.get("products", [])))
          print("Releases:", len(status.get("releases", [])))
          print("Last region:", state.get("last_region"))
          print("New stores:", state.get("last_new_stores"))
          print("Total stores:", state.get("total_stores"))
          print("Discovery error:", state.get("last_error"))
          PY
