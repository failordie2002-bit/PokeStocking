
name: PokeStock V8.2.2 Reliable Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: pokestock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Catalogue and Reliable Store Discovery
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Validate Python scripts
        run: |
          python -m py_compile scripts/monitor.py
          python -m py_compile scripts/discover_stores.py

      - name: Save protection baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(
              Path("data/status.json").read_text(
                  encoding="utf-8"
              )
          )

          stores = json.loads(
              Path("data/stores.json").read_text(
                  encoding="utf-8"
              )
          )

          shipments = json.loads(
              Path("data/shipments.json").read_text(
                  encoding="utf-8"
              )
          )

          if not isinstance(status.get("products"), list):
              raise SystemExit("Invalid products")

          if not isinstance(status.get("releases"), list):
              raise SystemExit("Invalid releases")

          if not isinstance(stores, list):
              raise SystemExit("Invalid stores")

          if not isinstance(shipments, dict):
              raise SystemExit("Invalid shipments")

          baseline = {
              "products": len(status["products"]),
              "releases": len(status["releases"]),
              "stores": len(stores),
              "shipments": shipments
          }

          Path("/tmp/pokestock_baseline.json").write_text(
              json.dumps(baseline),
              encoding="utf-8"
          )

          print("Protected baseline:", {
              "products": baseline["products"],
              "releases": baseline["releases"],
              "stores": baseline["stores"]
          })
          PY

      - name: Run nationwide store discovery
        id: discovery
        continue-on-error: true
        run: |
          python scripts/discover_stores.py

      - name: Run product catalogue monitor
        run: |
          python scripts/monitor.py

      - name: Validate protected data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(
              Path("data/status.json").read_text(
                  encoding="utf-8"
              )
          )

          stores = json.loads(
              Path("data/stores.json").read_text(
                  encoding="utf-8"
              )
          )

          shipments = json.loads(
              Path("data/shipments.json").read_text(
                  encoding="utf-8"
              )
          )

          state = json.loads(
              Path("data/discovery_state.json").read_text(
                  encoding="utf-8"
              )
          )

          baseline = json.loads(
              Path("/tmp/pokestock_baseline.json").read_text(
                  encoding="utf-8"
              )
          )

          if len(status.get("products", [])) < baseline["products"]:
              raise SystemExit("Products were lost")

          if len(status.get("releases", [])) < baseline["releases"]:
              raise SystemExit("Releases were lost")

          if not isinstance(stores, list):
              raise SystemExit("Invalid stores")

          if len(stores) < baseline["stores"]:
              raise SystemExit("Stores were lost")

          if not isinstance(shipments, dict):
              raise SystemExit("Invalid shipments")

          for key in ("events", "forecasts"):
              old = baseline["shipments"].get(key, [])
              new = shipments.get(key, [])

              if not isinstance(new, list):
                  raise SystemExit("Invalid shipment records")

              if len(new) < len(old):
                  raise SystemExit("Shipment records were lost")

          if not isinstance(state, dict):
              raise SystemExit("Invalid discovery state")

          print("Protected data validated")
          print("Products:", len(status["products"]))
          print("Releases:", len(status["releases"]))
          print("Stores:", len(stores))
          print(
              "Discovery status:",
              state.get("v822_status")
          )
          PY

      - name: Commit updated data
        run: |
          git config user.name "pokestock-bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            data/status.json \
            data/stores.json \
            data/shipments.json \
            data/discovery_state.json

          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update PokeStock V8.2.2 data"
            git push origin HEAD:main
          fi

      - name: Print discovery summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/discovery_state.json")

          if not p.exists():
              print("No discovery state found")
              raise SystemExit(0)

          state = json.loads(
              p.read_text(encoding="utf-8")
          )

          print("=== POKESTOCK V8.2.2 ===")
          print("State:", state.get("v822_last_state"))
          print("Status:", state.get("v822_status"))
          print("Method:", state.get("v822_last_method"))
          print("New stores:", state.get("v822_last_new_stores"))
          print("Total stores:", state.get("v822_total_stores"))
          print("Error:", state.get("v822_last_error"))
          PY

      - name: Report discovery failure
        if: steps.discovery.outcome == 'failure'
        run: |
          echo "::error::Store discovery failed or was incomplete."
          echo "Catalogue monitoring and data preservation completed."
          echo "Review data/discovery_state.json for details."
          exit 1
