
name: PokeStock V8.2 Nationwide Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: pokestock-v82-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Catalogue and All-State Store Discovery
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Validate Python scripts
        run: |
          python -m py_compile scripts/monitor.py
          python -m py_compile scripts/discover_stores.py

      - name: Validate existing data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              "data/status.json",
              "data/stores.json",
              "data/shipments.json",
              "data/discovery_state.json"
          ]

          for filename in required:
              p = Path(filename)

              if not p.exists():
                  raise SystemExit(
                      "Missing file: " + filename
                  )

              json.loads(
                  p.read_text(encoding="utf-8")
              )

              print("VALID:", filename)

          status = json.loads(
              Path("data/status.json").read_text(
                  encoding="utf-8"
              )
          )

          if not isinstance(
              status.get("products"), list
          ):
              raise SystemExit(
                  "Invalid product catalogue"
              )

          if not isinstance(
              status.get("releases"), list
          ):
              raise SystemExit(
                  "Invalid release catalogue"
              )

          print(
              "Existing products:",
              len(status["products"])
          )

          print(
              "Existing releases:",
              len(status["releases"])
          )
          PY

      - name: Save catalogue protection baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(
              Path("data/status.json").read_text(
                  encoding="utf-8"
              )
          )

          baseline = {
              "products": len(
                  status.get("products", [])
              ),
              "releases": len(
                  status.get("releases", [])
              )
          }

          Path(
              "/tmp/pokestock_baseline.json"
          ).write_text(
              json.dumps(baseline),
              encoding="utf-8"
          )

          print("Baseline saved:", baseline)
          PY

      - name: Discover stores across US states
        run: |
          python scripts/discover_stores.py

      - name: Update product catalogue
        run: |
          python scripts/monitor.py

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(
              Path("data/status.json").read_text(
                  encoding="utf-8"
              )
          )

          stores = json.loads(
              Path("data/stores.json").read_text(
                  encoding="utf-8"
              )
          )

          shipments = json.loads(
              Path("data/shipments.json").read_text(
                  encoding="utf-8"
              )
          )

          state = json.loads(
              Path("data/discovery_state.json").read_text(
                  encoding="utf-8"
              )
          )

          baseline = json.loads(
              Path("/tmp/pokestock_baseline.json").read_text(
                  encoding="utf-8"
              )
          )

          products = status.get("products", [])
          releases = status.get("releases", [])

          if len(products) < baseline["products"]:
              raise SystemExit(
                  "ERROR: Products were lost"
              )

          if len(releases) < baseline["releases"]:
              raise SystemExit(
                  "ERROR: Releases were lost"
              )

          if not isinstance(stores, list):
              raise SystemExit(
                  "Invalid store directory"
              )

          if not isinstance(shipments, dict):
              raise SystemExit(
                  "Invalid shipment data"
              )

          if not isinstance(state, dict):
              raise SystemExit(
                  "Invalid discovery state"
              )

          print("Products:", len(products))
          print("Releases:", len(releases))
          print("Stores:", len(stores))
          print(
              "Last state:",
              state.get("v82_last_state")
          )
          print(
              "Discovery error:",
              state.get("v82_last_error")
          )
          PY

      - name: Commit updated data
        run: |
          git config user.name "pokestock-bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            data/status.json \
            data/stores.json \
            data/shipments.json \
            data/discovery_state.json

          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update PokeStock V8.2 nationwide data"
            git push origin HEAD:main
          fi

      - name: Display V8.2 summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(
              Path("data/status.json").read_text(
                  encoding="utf-8"
              )
          )

          state = json.loads(
              Path("data/discovery_state.json").read_text(
                  encoding="utf-8"
              )
          )

          print("=== POKESTOCK V8.2 ===")
          print(
              "Products:",
              len(status.get("products", []))
          )
          print(
              "Releases:",
              len(status.get("releases", []))
          )
          print(
              "Stores:",
              state.get("v82_total_stores")
          )
          print(
              "Completed states:",
              state.get("v82_completed_states")
          )
          print(
              "Last discovery error:",
              state.get("v82_last_error")
          )
          PY
