name: PokeStock V11 Nationwide Retailer Expansion

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */6 * * *"

permissions:
  contents: write

concurrency:
  group: pokestock-monitor
  cancel-in-progress: false

jobs:
  discover:
    name: Discover Independent TCG Retailers
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install requests

      - name: Validate discovery script
        run: |
          python -m py_compile \
            scripts/retailer_expansion.py

      - name: Discover compatible retailers
        timeout-minutes: 18
        run: |
          python scripts/retailer_expansion.py

      - name: Validate discovered retailers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          retailers = json.loads(
              Path("data/online_retailers.json")
              .read_text(encoding="utf-8")
          )

          report = json.loads(
              Path("data/retailer_discovery_report.json")
              .read_text(encoding="utf-8")
          )

          if not isinstance(retailers, list):
              raise SystemExit("Invalid retailer list")

          if not isinstance(report, dict):
              raise SystemExit("Invalid discovery report")

          seen = set()

          for retailer in retailers:
              if not isinstance(retailer, dict):
                  raise SystemExit("Invalid retailer entry")

              name = retailer.get("name")
              base = retailer.get("base")

              if not isinstance(name, str) or not name.strip():
                  raise SystemExit("Missing retailer name")

              if not isinstance(base, str):
                  raise SystemExit("Missing retailer URL")

              parsed = urlparse(base)

              if (
                  parsed.scheme != "https"
                  or not parsed.hostname
                  or parsed.username
                  or parsed.password
              ):
                  raise SystemExit("Invalid retailer URL")

              if parsed.hostname in seen:
                  raise SystemExit("Duplicate retailer")

              seen.add(parsed.hostname)

          if report.get("physical_store_stock_claims") != 0:
              raise SystemExit(
                  "Unexpected physical inventory claim"
              )

          print("Retailer discovery validated.")
          print("Registered retailers:", len(retailers))
          print(
              "New retailers:",
              report.get("new_retailers_registered", 0)
          )
          PY

      - name: Publish discovered retailers
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "pokestock-bot"
          git config user.email \
            "actions@users.noreply.github.com"

          git add \
            data/online_retailers.json \
            data/retailer_discovery_report.json

          if git diff --cached --quiet; then
            echo "No retailer data changes."
            exit 0
          fi

          git commit -m \
            "Expand discovered TCG retailer network"

          for attempt in 1 2 3; do
            echo "Publishing attempt $attempt"

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Discovery publishing conflict."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Retailer discovery published."
              exit 0
            fi

            sleep 3
          done

          echo "::error::Could not publish retailers."
          exit 1

      - name: Print discovery summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/retailer_discovery_report.json"
          )

          if not path.exists():
              print("No discovery report available.")
              raise SystemExit(0)

          report = json.loads(
              path.read_text(encoding="utf-8")
          )

          print("=== POKESTOCK V11 ===")
          print(
              "Store records:",
              report.get("total_store_records", 0)
          )
          print(
              "Candidate websites:",
              report.get("candidate_retailer_websites", 0)
          )
          print(
              "Checked this run:",
              report.get("checked_this_run", 0)
          )
          print(
              "New retailers:",
              report.get("new_retailers_registered", 0)
          )
          print(
              "Registered total:",
              report.get("total_registered_retailers", 0)
          )

          for check in report.get("checks", []):
              print(
                  check.get("status", "unknown"),
                  check.get("name", ""),
                  check.get("reason", "")
              )
          PY
