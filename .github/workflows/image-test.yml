
name: Product Image Source Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-images:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Test product image extraction
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          tests = [
              (
                  "Pokemon",
                  "https://press.pokemon.com/en/Items/Schedule?period=All&types=3&sortAsc=False&sortBy=Date"
              ),
              (
                  "Union Arena",
                  "https://www.unionarena-tcg.com/na/products/"
              ),
          ]

          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; PokeStock/1.0)"
          }

          for label, url in tests:
              print(f"\n--- {label} ---")
              try:
                  response = requests.get(
                      url, headers=headers, timeout=30
                  )
                  print("Page status:", response.status_code)
                  response.raise_for_status()

                  soup = BeautifulSoup(response.text, "html.parser")
                  images = []

                  for img in soup.find_all("img"):
                      src = (
                          img.get("src")
                          or img.get("data-src")
                          or img.get("data-original")
                      )
                      if src:
                          images.append(urljoin(url, src))

                  print("Images found:", len(images))

                  for image_url in images[:10]:
                      try:
                          image_response = requests.get(
                              image_url, headers=headers, timeout=20
                          )
                          content_type = image_response.headers.get(
                              "Content-Type", ""
                          )
                          print(
                              "IMAGE:",
                              image_response.status_code,
                              content_type,
                              image_url
                          )
                      except Exception as error:
                          print("IMAGE ERROR:", image_url, error)

              except Exception as error:
                  print("SOURCE ERROR:", error)
          PY
