
name: Product Image Source Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-images:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Test actual product images
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          headers = {"User-Agent": "Mozilla/5.0"}
          session = requests.Session()
          session.headers.update(headers)

          # UNION ARENA: test actual product thumbnails
          print("\n===== UNION ARENA =====")
          ua_url = "https://www.unionarena-tcg.com/na/products/"

          try:
              response = session.get(ua_url, timeout=30)
              response.raise_for_status()
              soup = BeautifulSoup(response.text, "html.parser")

              product_images = set()

              for img in soup.find_all("img"):
                  src = img.get("src") or img.get("data-src")
                  if src:
                      image_url = urljoin(ua_url, src)
                      if "/images/products/" in image_url:
                          product_images.add(image_url)

              print("Product thumbnails found:", len(product_images))

              for image_url in sorted(product_images)[:15]:
                  try:
                      result = session.get(image_url, timeout=20)
                      print(
                          result.status_code,
                          result.headers.get("Content-Type"),
                          image_url
                      )
                  except Exception as error:
                      print("IMAGE ERROR:", error, image_url)

          except Exception as error:
              print("UNION ARENA ERROR:", repr(error))

          # POKEMON: follow product links and inspect image metadata
          print("\n===== POKEMON =====")
          pokemon_url = (
              "https://press.pokemon.com/en/Items/Schedule"
              "?period=All&types=3&sortAsc=False&sortBy=Date"
          )

          try:
              response = session.get(pokemon_url, timeout=30)
              response.raise_for_status()
              soup = BeautifulSoup(response.text, "html.parser")

              product_links = {}

              for link in soup.find_all("a", href=True):
                  href = link["href"]
                  label = link.get_text(" ", strip=True)

                  if "/products/" in href and label:
                      full_url = urljoin(pokemon_url, href)
                      product_links[full_url] = label

              print("Product pages found:", len(product_links))

              for page_url, label in list(product_links.items())[:8]:
                  try:
                      page = session.get(page_url, timeout=25)
                      page.raise_for_status()
                      detail = BeautifulSoup(page.text, "html.parser")

                      image_urls = []

                      for tag in detail.find_all("meta"):
                          if tag.get("property") in (
                              "og:image",
                              "og:image:secure_url"
                          ) or tag.get("name") == "twitter:image":
                              content = tag.get("content")
                              if content:
                                  image_urls.append(
                                      urljoin(page_url, content)
                                  )

                      for img in detail.find_all("img"):
                          src = img.get("src") or img.get("data-src")
                          if src:
                              full_image = urljoin(page_url, src)
                              if any(word in full_image.lower() for word in (
                                  "product", "shot", "press"
                              )):
                                  image_urls.append(full_image)

                      image_urls = list(dict.fromkeys(image_urls))

                      print("\nPRODUCT:", label)
                      print("PAGE STATUS:", page.status_code)
                      print("IMAGE CANDIDATES:", len(image_urls))

                      for image_url in image_urls[:3]:
                          try:
                              result = session.get(
                                  image_url, timeout=20
                              )
                              print(
                                  "IMAGE:",
                                  result.status_code,
                                  result.headers.get("Content-Type"),
                                  image_url
                              )
                          except Exception as error:
                              print("IMAGE ERROR:", repr(error))

                  except Exception as error:
                      print("PRODUCT PAGE ERROR:", repr(error), page_url)

          except Exception as error:
              print("POKEMON SOURCE ERROR:", repr(error))
          PY
