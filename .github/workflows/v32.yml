name: Pokestock V32 Evidence Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "37 11,23 * * *"

permissions:
  contents: write

concurrency:
  group: pokestock-v32
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser
        run: pip install requests beautifulsoup4

      - name: Inspect and collect public reports
        shell: bash
        run: |
          mkdir -p data

          cat > /tmp/v32.py <<'PY'
          import json
          import re
          import hashlib
          import html
          from collections import Counter, defaultdict
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from urllib.parse import urlparse
          import requests
          from bs4 import BeautifulSoup

          D = Path("data")
          NOW = datetime.now(timezone.utc)
          TODAY = NOW.date()

          SOURCES = [
              "https://restockd.app/pokemon-in-store"
          ]

          GAME_PATTERNS = {
              "Pokémon": r"pokemon|pokémon",
              "Union Arena": r"union arena",
              "Gundam": r"gundam",
              "One Piece": r"one piece",
              "Magic: The Gathering": r"magic.{0,5}gathering|\bmtg\b",
              "Yu-Gi-Oh!": r"yu.?gi.?oh",
              "Disney Lorcana": r"lorcana",
              "Digimon": r"digimon",
              "Dragon Ball Super": r"dragon ball",
              "Star Wars: Unlimited": r"star wars.{0,5}unlimited",
              "Riftbound": r"riftbound",
              "Flesh and Blood": r"flesh and blood",
              "Weiss Schwarz": r"weiss schwarz",
              "Cardfight Vanguard": r"cardfight|vanguard"
          }

          POSITIVE = re.compile(
              r"\b(in.stock|restocked|available|"
              r"on.shelf|shelf.sighting|found.in.store)\b",
              re.I
          )

          NEGATIVE = re.compile(
              r"\b(out.of.stock|sold.out|unavailable|"
              r"not.available|no.stock)\b",
              re.I
          )

          def load(name, fallback):
              try:
                  return json.loads(
                      (D / name).read_text(
                          encoding="utf-8"
                      )
                  )
              except (OSError, ValueError):
                  return fallback

          def save(name, value):
              path = D / name
              tmp = path.with_suffix(".tmp")
              tmp.write_text(
                  json.dumps(
                      value, ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )
              tmp.replace(path)

          def text(x):
              return " ".join(str(x or "").split())

          def norm(x):
              x = text(x).lower()
              x = x.replace("&", " and ")
              return re.sub(
                  r"[^a-z0-9]+", " ", x
              ).strip()

          def date_of(x):
              if not x:
                  return None

              try:
                  if isinstance(x, (int, float)):
                      if x > 100000000000:
                          x /= 1000
                      return datetime.fromtimestamp(
                          x, timezone.utc
                      ).date()

                  v = str(x)
                  if re.fullmatch(r"\d{10,13}", v):
                      return date_of(int(v))

                  return datetime.fromisoformat(
                      v.replace("Z", "+00:00")
                  ).date()
              except (ValueError, OverflowError,
                      TypeError, OSError):
                  return None

          def get(obj, names):
              if not isinstance(obj, dict):
                  return None

              lowered = {
                  str(k).lower(): v
                  for k, v in obj.items()
              }

              for name in names:
                  value = lowered.get(name.lower())
                  if value is not None and value != "":
                      return value
              return None

          def as_dict(x):
              return x if isinstance(x, dict) else {}

          def walk(obj, depth=0):
              if depth > 16:
                  return

              if isinstance(obj, dict):
                  yield obj
                  for value in obj.values():
                      if isinstance(value, (dict, list)):
                          yield from walk(
                              value, depth + 1
                          )

              elif isinstance(obj, list):
                  for item in obj:
                      if isinstance(item, (dict, list)):
                          yield from walk(
                              item, depth + 1
                          )

          def game_of(value):
              x = text(value)
              for game, pattern in GAME_PATTERNS.items():
                  if re.search(
                      pattern, x, re.I
                  ):
                      return game
              return None

          def product_id(game, title):
              return hashlib.sha256(
                  (
                      norm(game) + "|" +
                      norm(title)
                  ).encode()
              ).hexdigest()[:20]

          def store_address(s):
              return norm(
                  s.get("address") or
                  s.get("street_address")
              )

          stores = load(
              "physical_inventory_sources.json", []
          )
          if not isinstance(stores, list):
              stores = []

          store_index = defaultdict(list)
          store_ids = {}

          for store in stores:
              if not isinstance(store, dict):
                  continue

              sid = store.get("source_id")
              if not sid:
                  continue

              store_ids[sid] = store

              key = (
                  norm(
                      store.get("chain") or
                      store.get("name")
                  ),
                  norm(store.get("address")),
                  norm(store.get("city")),
                  norm(store.get("state"))
              )
              store_index[key].append(sid)

          def match_store(report):
              # Exact physical address is required.
              # City alone never identifies a store.
              retailer = get(report, [
                  "retailer", "chain", "storeName",
                  "store_name"
              ])
              address = get(report, [
                  "address", "streetAddress",
                  "street_address"
              ])
              city = get(report, [
                  "city", "storeCity"
              ])
              state = get(report, [
                  "state", "storeState"
              ])

              location = as_dict(
                  get(report, [
                      "location", "store",
                      "storeLocation"
                  ])
              )

              if not address:
                  address = get(location, [
                      "address", "streetAddress"
                  ])

              if not city:
                  city = get(location, ["city"])

              if not state:
                  state = get(location, ["state"])

              if not retailer:
                  retailer = get(location, [
                      "name", "chain", "retailer"
                  ])

              if not all([
                  retailer, address, city, state
              ]):
                  return None

              matches = []

              for sid, store in store_ids.items():
                  if (
                      norm(store.get("city"))
                      != norm(city)
                      or norm(store.get("state"))
                      != norm(state)
                  ):
                      continue

                  if store_address(store) != norm(address):
                      continue

                  chain_name = norm(
                      store.get("chain") or
                      store.get("name")
                  )
                  reported = norm(retailer)

                  if (
                      reported in chain_name
                      or chain_name in reported
                  ):
                      matches.append(sid)

              return (
                  matches[0]
                  if len(matches) == 1
                  else None
              )

          def parse_candidate(obj, source_url):
              if not isinstance(obj, dict):
                  return None, "not_object"

              product = get(obj, [
                  "product_name", "productName",
                  "productTitle", "title"
              ])

              product_obj = as_dict(
                  get(obj, ["product", "item"])
              )

              if not product:
                  product = get(
                      product_obj,
                      ["name", "title"]
                  )

              if not isinstance(product, str):
                  return None, "missing_product"

              game = get(obj, [
                  "game", "tcg", "category"
              ]) or game_of(product)

              if not game:
                  return None, "unknown_game"

              status = get(obj, [
                  "availability", "stockStatus",
                  "status", "reportType"
              ])

              if not isinstance(status, str):
                  return None, "missing_status"

              if NEGATIVE.search(status):
                  return None, "negative_report"

              if not POSITIVE.search(status):
                  return None, "unverified_status"

              observed = date_of(get(obj, [
                  "observed_at", "observedAt",
                  "reportedAt", "createdAt",
                  "timestamp", "date"
              ]))

              if not observed:
                  return None, "missing_absolute_date"

              if not (
                  TODAY - timedelta(days=180)
                  <= observed <= TODAY
              ):
                  return None, "date_out_of_range"

              sid = match_store(obj)

              if not sid:
                  return None, "unmatched_exact_store"

              # Never accept an online inventory
              # record as physical shelf evidence.
              scope = get(obj, [
                  "inventory_scope",
                  "inventoryScope",
                  "channel"
              ])

              if scope and norm(scope) in [
                  "online", "shipping",
                  "delivery"
              ]:
                  return None, "online_only"

              pid = product_id(game, product)

              event_id = hashlib.sha256(
                  (
                      sid + "|" + pid + "|" +
                      observed.isoformat() + "|" +
                      source_url
                  ).encode()
              ).hexdigest()[:24]

              return {
                  "event_id": event_id,
                  "store_id": sid,
                  "game": game,
                  "product_id": pid,
                  "product_name": text(product),
                  "observed_at": observed.isoformat(),
                  "source_url": source_url,
                  "status": "Reported in stock",
                  "inventory_scope": "physical_store",
                  "evidence_level":
                      "public third-party report",
                  "current_stock_verified": False
              }, None

          def decode_embedded(raw):
              # Parse only genuine JSON structures,
              # not arbitrary text fragments.
              raw = html.unescape(raw.strip())

              if not raw or len(raw) > 5000000:
                  return []

              results = []

              try:
                  results.append(json.loads(raw))
              except (ValueError, TypeError):
                  pass

              # Next.js flight chunks can contain
              # escaped serialized JSON strings.
              for match in re.finditer(
                  r'(\{(?:\\.|[^{}]){30,20000}\})',
                  raw
              ):
                  fragment = match.group(1)

                  for candidate in [
                      fragment,
                      fragment.replace(
                          '\\"', '"'
                      )
                  ]:
                      try:
                          parsed = json.loads(candidate)
                          if isinstance(
                              parsed, (dict, list)
                          ):
                              results.append(parsed)
                              break
                      except ValueError:
                          pass

                  if len(results) >= 100:
                      break

              return results

          session = requests.Session()
          session.headers.update({
              "User-Agent":
                  "Mozilla/5.0 (compatible; "
                  "PokestockPublicResearch/32)",
              "Accept": "text/html,application/json"
          })

          diagnostics = []
          extracted = []
          rejected = Counter()
          found = {}

          for url in SOURCES:
              try:
                  response = session.get(
                      url, timeout=35
                  )
                  response.raise_for_status()
              except requests.RequestException as e:
                  diagnostics.append({
                      "url": url,
                      "error": str(e)[:250]
                  })
                  continue

              soup = BeautifulSoup(
                  response.text, "html.parser"
              )

              scripts = soup.find_all("script")
              types = Counter()
              structured = []

              for script in scripts:
                  typ = script.get("type", "")
                  sid = script.get("id", "")

                  types[typ or "default"] += 1
                  raw = script.string or script.text

                  if not raw:
                      continue

                  if (
                      "json" in typ.lower()
                      or sid == "__NEXT_DATA__"
                      or "__next_f.push" in raw
                      or "restock" in raw.lower()
                  ):
                      structured.extend(
                          decode_embedded(raw)
                      )

              # Inspect explicit HTML attributes,
              # without guessing a store from
              # unrelated page text.
              for el in soup.select(
                  "[data-product-name]"
                  "[data-store-address]"
              ):
                  structured.append({
                      "product_name": el.get(
                          "data-product-name"
                      ),
                      "retailer": el.get(
                          "data-retailer"
                      ),
                      "address": el.get(
                          "data-store-address"
                      ),
                      "city": el.get(
                          "data-store-city"
                      ),
                      "state": el.get(
                          "data-store-state"
                      ),
                      "observed_at": el.get(
                          "data-observed-at"
                      ),
                      "status": el.get(
                          "data-status"
                      )
                  })

              inspected = 0
              potential = 0

              for structure in structured:
                  for obj in walk(structure):
                      inspected += 1

                      if inspected > 100000:
                          break

                      # Only inspect records with
                      # some product/store semantics.
                      keys = " ".join(
                          str(k).lower()
                          for k in obj.keys()
                      )

                      if not re.search(
                          r"product|store|restock|"
                          r"availability|report",
                          keys
                      ):
                          continue

                      potential += 1

                      event, reason = parse_candidate(
                          obj, url
                      )

                      if event:
                          found[
                              event["event_id"]
                          ] = event
                      else:
                          rejected[reason] += 1

                      # Keep a bounded diagnostic
                      # sample, without publishing
                      # full untrusted page content.
                      if len(extracted) < 30:
                          extracted.append({
                              "source": url,
                              "keys": list(
                                  obj.keys()
                              )[:25],
                              "rejection": reason,
                              "sample": str(obj)[:500]
                          })

              diagnostics.append({
                  "url": url,
                  "http_status":
                      response.status_code,
                  "html_bytes":
                      len(response.content),
                  "script_count": len(scripts),
                  "script_types": dict(types),
                  "parsed_structures":
                      len(structured),
                  "objects_inspected": inspected,
                  "potential_records": potential,
                  "accepted_records":
                      len(found)
              })

          # Preserve previously collected reports.
          existing = load(
              "v31_sightings.json", []
          )

          if not isinstance(existing, list):
              existing = []

          for event in existing:
              if not isinstance(event, dict):
                  continue

              eid = event.get("event_id")
              sid = event.get("store_id")
              d = date_of(event.get("observed_at"))

              if (
                  eid and sid in store_ids
                  and d
                  and TODAY - timedelta(days=180)
                  <= d <= TODAY
                  and event.get("source_url")
              ):
                  found.setdefault(eid, event)

          sightings = list(found.values())

          save("v32_sightings.json", sightings)
          save(
              "v32_diagnostic_samples.json",
              extracted
          )

          # Forecast only from repeated reports
          # of the SAME product at the SAME store.
          history = defaultdict(set)

          for event in sightings:
              sid = event.get("store_id")
              pid = event.get("product_id")
              d = date_of(event.get("observed_at"))

              if sid and pid and d:
                  history[(sid, pid)].add(d)

          product_forecasts = []
          game_forecasts = []
          game_history = defaultdict(set)

          for event in sightings:
              d = date_of(event.get("observed_at"))

              if d:
                  game_history[
                      (
                          event.get("store_id"),
                          event.get("game")
                      )
                  ].add(d)

          def forecast(dates):
              dates = sorted(dates)
              n = len(dates)

              if n < 3:
                  return {
                      "predicted_date": None,
                      "confidence":
                          "Insufficient history",
                      "observations": n
                  }

              counts = Counter(
                  d.weekday() for d in dates
              )
              weekday, hits = counts.most_common(1)[0]

              weeks = len({
                  d.isocalendar()[:2]
                  for d in dates
              })

              if weeks < 3:
                  return {
                      "predicted_date": None,
                      "confidence":
                          "Insufficient independent weeks",
                      "observations": n
                  }

              agreement = hits / n

              if agreement < 0.5:
                  return {
                      "predicted_date": None,
                      "confidence":
                          "No consistent weekday",
                      "observations": n
                  }

              next_date = None

              for offset in range(8):
                  candidate = TODAY + timedelta(
                      days=offset
                  )

                  if candidate.weekday() == weekday:
                      next_date = candidate.isoformat()
                      break

              return {
                  "predicted_date": next_date,
                  "confidence": (
                      "Moderate"
                      if n >= 6 and agreement >= 0.7
                      else "Low"
                  ),
                  "observations": n,
                  "weekday_agreement":
                      round(agreement, 3)
              }

          for (sid, pid), dates in history.items():
              matching = [
                  x for x in sightings
                  if x.get("store_id") == sid
                  and x.get("product_id") == pid
              ]

              if not matching:
                  continue

              item = matching[-1]
              store = store_ids[sid]

              product_forecasts.append({
                  "store_id": sid,
                  "store_name":
                      store.get("name"),
                  "address":
                      store.get("address"),
                  "city": store.get("city"),
                  "state": store.get("state"),
                  "game": item.get("game"),
                  "product_id": pid,
                  "product_name":
                      item.get("product_name"),
                  **forecast(dates),
                  "source_url":
                      item.get("source_url"),
                  "current_stock_verified": False
              })

          for (sid, game), dates in game_history.items():
              store = store_ids[sid]

              game_forecasts.append({
                  "store_id": sid,
                  "store_name":
                      store.get("name"),
                  "address":
                      store.get("address"),
                  "city": store.get("city"),
                  "state": store.get("state"),
                  "game": game,
                  **forecast(dates),
                  "current_stock_verified": False
              })

          save(
              "v32_store_product_forecasts.json",
              product_forecasts
          )
          save(
              "v32_store_game_forecasts.json",
              game_forecasts
          )

          # Do not delete V30 data.
          # Only V32 forecasts with enough history
          # are added to the shipment display.
          shipments = load(
              "shipments.json",
              {"events": [], "forecasts": []}
          )

          if not isinstance(shipments, dict):
              shipments = {
                  "events": [], "forecasts": []
              }

          previous = shipments.get(
              "forecasts", []
          )

          if not isinstance(previous, list):
              previous = []

          previous = [
              f for f in previous
              if isinstance(f, dict)
              and f.get("forecast_engine") != "v32"
          ]

          for row in product_forecasts:
              if not row["predicted_date"]:
                  continue

              previous.append({
                  "forecast_engine": "v32",
                  "store_id": row["store_id"],
                  "store_name": (
                      str(row["store_name"]) +
                      " — " +
                      str(row["address"]) +
                      ", " + str(row["city"]) +
                      ", " + str(row["state"])
                  ),
                  "game": row["game"],
                  "product_id":
                      row["product_id"],
                  "product_name":
                      row["product_name"],
                  "predicted_date":
                      row["predicted_date"],
                  "confidence":
                      row["confidence"],
                  "source_url":
                      row["source_url"],
                  "inventory_status": "Unknown",
                  "delivery_confirmed": False
              })

          shipments["forecasts"] = previous
          shipments.setdefault("events", [])
          save("shipments.json", shipments)

          report = {
              "version": "32",
              "checked_at": NOW.isoformat(),
              "stores_indexed": len(store_ids),
              "source_diagnostics": diagnostics,
              "rejection_reasons": dict(rejected),
              "total_sightings": len(sightings),
              "store_product_records":
                  len(product_forecasts),
              "store_game_records":
                  len(game_forecasts),
              "dated_product_predictions": sum(
                  bool(x["predicted_date"])
                  for x in product_forecasts
              ),
              "limitations": [
                  "Public reports are not live stock",
                  "Exact store address matching required",
                  "No forecast from fewer than 3 dates",
                  "No forecast from fewer than 3 weeks",
                  "V30 research windows remain separate",
                  "Source access does not guarantee usable data"
              ]
          }

          save("v32_report.json", report)
          print(json.dumps(report, indent=2))
          PY

          python /tmp/v32.py

      - name: Validate files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          names = [
              "v32_report.json",
              "v32_sightings.json",
              "v32_diagnostic_samples.json",
              "v32_store_product_forecasts.json",
              "v32_store_game_forecasts.json",
              "shipments.json"
          ]

          for name in names:
              path = Path("data") / name
              assert path.exists(), name
              json.loads(path.read_text(
                  encoding="utf-8"
              ))

          print("V32 data validation passed")
          PY

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "pokestock-bot"
          git config user.email \
            "actions@users.noreply.github.com"

          git add data/v32_*.json data/shipments.json

          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi

          git commit -m "V32 collect store product evidence"

          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "V32 published"
              exit 0
            fi

            sleep 5
          done

          echo "Unable to publish V32"
          exit 1
