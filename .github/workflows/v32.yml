
name: Pokestock V32 Optimized Evidence Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "37 11,23 * * *"

permissions:
  contents: write

concurrency:
  group: pokestock-v32
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Inspect and collect public reports
        shell: bash
        run: |
          mkdir -p data

          cat > /tmp/v32_fast.py <<'PY'
          import json
          import re
          import time
          import hashlib
          import signal
          from pathlib import Path
          from datetime import datetime, timedelta, timezone
          from collections import defaultdict, Counter
          import requests
          from bs4 import BeautifulSoup

          ROOT = Path("data")
          NOW = datetime.now(timezone.utc)
          TODAY = NOW.date()
          START = time.monotonic()

          SOURCE = (
              "https://restockd.app/pokemon-in-store"
          )

          # Hard limits prevent another runaway parser.
          MAX_SECONDS = 100
          MAX_HTML_BYTES = 2000000
          MAX_SCRIPTS = 100
          MAX_SCRIPT_BYTES = 500000
          MAX_OBJECTS = 12000
          MAX_DEPTH = 8
          MAX_SAMPLES = 30

          def timeout_handler(signum, frame):
              raise TimeoutError(
                  "Collector exceeded time budget"
              )

          signal.signal(
              signal.SIGALRM, timeout_handler
          )
          signal.alarm(MAX_SECONDS)

          def load(name, fallback):
              try:
                  return json.loads(
                      (ROOT / name).read_text(
                          encoding="utf-8"
                      )
                  )
              except (OSError, ValueError):
                  return fallback

          def save(name, obj):
              path = ROOT / name
              temp = path.with_suffix(".tmp")
              temp.write_text(
                  json.dumps(
                      obj, indent=2,
                      ensure_ascii=False
                  ),
                  encoding="utf-8"
              )
              temp.replace(path)

          def clean(value):
              return " ".join(
                  str(value or "").split()
              )

          def norm(value):
              return re.sub(
                  r"[^a-z0-9]+", " ",
                  clean(value).lower()
              ).strip()

          def date_of(value):
              if not value:
                  return None
              try:
                  if isinstance(value, (int, float)):
                      n = float(value)
                      if n > 100000000000:
                          n /= 1000
                      return datetime.fromtimestamp(
                          n, timezone.utc
                      ).date()
                  return datetime.fromisoformat(
                      str(value).replace(
                          "Z", "+00:00"
                      )
                  ).date()
              except (
                  ValueError, TypeError,
                  OverflowError, OSError
              ):
                  return None

          def field(obj, names):
              if not isinstance(obj, dict):
                  return None
              for name in names:
                  if name in obj and obj[name] is not None:
                      return obj[name]
              return None

          GAME_TERMS = {
              "Pokémon": [
                  "pokemon", "pokémon"
              ],
              "Gundam": ["gundam"],
              "Union Arena": ["union arena"],
              "One Piece": ["one piece"],
              "Magic: The Gathering": [
                  "magic the gathering", "mtg"
              ],
              "Yu-Gi-Oh!": [
                  "yu-gi-oh", "yugioh"
              ],
              "Disney Lorcana": ["lorcana"],
              "Digimon": ["digimon"],
              "Dragon Ball Super": [
                  "dragon ball"
              ],
              "Star Wars: Unlimited": [
                  "star wars unlimited"
              ],
              "Riftbound": ["riftbound"],
              "Flesh and Blood": [
                  "flesh and blood"
              ],
              "Weiss Schwarz": [
                  "weiss schwarz"
              ],
              "Cardfight Vanguard": [
                  "cardfight", "vanguard"
              ]
          }

          def identify_game(title):
              value = clean(title).lower()
              for game, terms in GAME_TERMS.items():
                  if any(t in value for t in terms):
                      return game
              return None

          def product_id(game, title):
              return hashlib.sha256(
                  (
                      norm(game) + "|" +
                      norm(title)
                  ).encode()
              ).hexdigest()[:20]

          stores = load(
              "physical_inventory_sources.json", []
          )
          if not isinstance(stores, list):
              stores = []

          store_by_id = {
              s["source_id"]: s
              for s in stores
              if isinstance(s, dict)
              and s.get("source_id")
          }

          # Store identity requires chain, street,
          # city and state. No city-only matches.
          def store_match(obj):
              location = field(
                  obj, ["store", "location"]
              )
              if not isinstance(location, dict):
                  location = {}

              def loc(names):
                  return (
                      field(obj, names)
                      or field(location, names)
                  )

              retailer = loc([
                  "retailer", "chain",
                  "storeName", "store_name"
              ])
              address = loc([
                  "streetAddress", "address",
                  "street_address"
              ])
              city = loc([
                  "city", "storeCity"
              ])
              state = loc([
                  "state", "storeState"
              ])

              if not all([
                  retailer, address, city, state
              ]):
                  return None

              matches = []

              for sid, s in store_by_id.items():
                  if norm(s.get("city")) != norm(city):
                      continue
                  if norm(s.get("state")) != norm(state):
                      continue
                  if norm(s.get("address")) != norm(address):
                      continue

                  name = norm(
                      s.get("chain") or s.get("name")
                  )
                  reported = norm(retailer)

                  if name and reported and (
                      name in reported
                      or reported in name
                  ):
                      matches.append(sid)

              return (
                  matches[0]
                  if len(matches) == 1
                  else None
              )

          def candidate_to_event(obj, source):
              title = field(obj, [
                  "product_name", "productName",
                  "productTitle"
              ])

              if not isinstance(title, str):
                  return None, "missing_product"

              game = field(obj, [
                  "game", "tcg"
              ]) or identify_game(title)

              if not isinstance(game, str):
                  return None, "missing_game"

              # Keep recognized TCG titles only.
              known = {
                  norm(g): g
                  for g in GAME_TERMS
              }
              game = known.get(norm(game))
              if not game:
                  return None, "unsupported_game"

              status = field(obj, [
                  "stockStatus", "availability",
                  "reportType", "status"
              ])

              if not isinstance(status, str):
                  return None, "missing_status"

              status_key = norm(status)

              if status_key not in {
                  "in stock", "restocked",
                  "shelf sighting",
                  "delivery confirmed"
              }:
                  return None, "not_positive"

              date = date_of(field(obj, [
                  "observed_at", "observedAt",
                  "reportedAt", "createdAt",
                  "timestamp", "date"
              ]))

              if not date:
                  return None, "missing_date"

              if not (
                  TODAY - timedelta(days=180)
                  <= date <= TODAY
              ):
                  return None, "date_out_of_range"

              scope = field(obj, [
                  "inventory_scope",
                  "inventoryScope", "channel"
              ])

              if scope and norm(scope) in {
                  "online", "shipping", "delivery"
              }:
                  return None, "online_report"

              sid = store_match(obj)

              if not sid:
                  return None, "unmatched_store"

              pid = product_id(game, title)

              eid = hashlib.sha256(
                  (
                      sid + "|" + pid + "|" +
                      date.isoformat() + "|" +
                      source
                  ).encode()
              ).hexdigest()[:24]

              return {
                  "event_id": eid,
                  "store_id": sid,
                  "game": game,
                  "product_id": pid,
                  "product_name": clean(title),
                  "observed_at": date.isoformat(),
                  "source_url": source,
                  "status": "Reported in stock",
                  "inventory_scope": "physical_store",
                  "evidence_level":
                      "third_party_report",
                  "current_stock_verified": False
              }, None

          # Iterative bounded traversal.
          # No recursive JSON-fragment regex.
          def walk_bounded(root, budget):
              stack = [(root, 0)]

              while stack and budget[0] > 0:
                  obj, depth = stack.pop()
                  budget[0] -= 1

                  if isinstance(obj, dict):
                      yield obj

                      if depth < MAX_DEPTH:
                          for value in obj.values():
                              if isinstance(
                                  value, (dict, list)
                              ):
                                  stack.append(
                                      (value, depth + 1)
                                  )

                  elif isinstance(obj, list):
                      if depth < MAX_DEPTH:
                          for value in obj[:1000]:
                              if isinstance(
                                  value, (dict, list)
                              ):
                                  stack.append(
                                      (value, depth + 1)
                                  )

          diagnostics = {
              "source": SOURCE,
              "checked_at": NOW.isoformat(),
              "http_status": None,
              "html_bytes": 0,
              "scripts_seen": 0,
              "scripts_parsed": 0,
              "scripts_skipped": 0,
              "objects_inspected": 0,
              "candidate_records": 0,
              "new_events": 0,
              "errors": []
          }

          rejection = Counter()
          samples = []
          collected = {}

          try:
              response = requests.get(
                  SOURCE,
                  timeout=(8, 20),
                  headers={
                      "User-Agent":
                          "Mozilla/5.0",
                      "Accept":
                          "text/html,application/json"
                  }
              )

              diagnostics["http_status"] = (
                  response.status_code
              )
              diagnostics["html_bytes"] = (
                  len(response.content)
              )

              if response.status_code == 200:
                  if len(response.content) > MAX_HTML_BYTES:
                      diagnostics["errors"].append(
                          "HTML exceeded size limit"
                      )
                  else:
                      soup = BeautifulSoup(
                          response.content,
                          "html.parser"
                      )

                      scripts = soup.find_all(
                          "script", limit=MAX_SCRIPTS
                      )

                      diagnostics["scripts_seen"] = (
                          len(scripts)
                      )

                      budget = [MAX_OBJECTS]

                      for script in scripts:
                          if budget[0] <= 0:
                              break

                          if (
                              time.monotonic() - START
                              > MAX_SECONDS - 15
                          ):
                              diagnostics["errors"].append(
                                  "Stopped at time budget"
                              )
                              break

                          raw = (
                              script.string
                              or script.get_text()
                              or ""
                          )

                          typ = (
                              script.get("type", "")
                              .lower()
                          )

                          if (
                              not raw
                              or len(raw.encode("utf-8"))
                              > MAX_SCRIPT_BYTES
                          ):
                              diagnostics[
                                  "scripts_skipped"
                              ] += 1
                              continue

                          # Only directly parse JSON
                          # scripts. Do not scan JS
                          # source with nested regex.
                          if (
                              "json" not in typ
                              and script.get("id")
                              != "__NEXT_DATA__"
                          ):
                              diagnostics[
                                  "scripts_skipped"
                              ] += 1
                              continue

                          try:
                              parsed = json.loads(raw)
                          except (ValueError, TypeError):
                              diagnostics[
                                  "scripts_skipped"
                              ] += 1
                              continue

                          diagnostics[
                              "scripts_parsed"
                          ] += 1

                          for obj in walk_bounded(
                              parsed, budget
                          ):
                              diagnostics[
                                  "objects_inspected"
                              ] += 1

                              keys = set(obj)

                              if not keys.intersection({
                                  "product_name",
                                  "productName",
                                  "productTitle",
                                  "stockStatus",
                                  "reportType"
                              }):
                                  continue

                              diagnostics[
                                  "candidate_records"
                              ] += 1

                              event, reason = (
                                  candidate_to_event(
                                      obj, SOURCE
                                  )
                              )

                              if event:
                                  collected[
                                      event["event_id"]
                                  ] = event
                              else:
                                  rejection[reason] += 1

                              if len(samples) < MAX_SAMPLES:
                                  samples.append({
                                      "keys": list(
                                          obj.keys()
                                      )[:20],
                                      "rejection": reason
                                  })

          except (
              requests.RequestException,
              TimeoutError
          ) as e:
              diagnostics["errors"].append(
                  str(e)[:250]
              )

          # Preserve previously accepted sightings.
          existing = load(
              "v32_sightings.json", []
          )

          if not isinstance(existing, list):
              existing = []

          older = load(
              "v31_sightings.json", []
          )

          if isinstance(older, list):
              existing += older

          for event in existing:
              if not isinstance(event, dict):
                  continue

              sid = event.get("store_id")
              pid = event.get("product_id")
              date = date_of(
                  event.get("observed_at")
              )
              source = event.get("source_url")

              if not (
                  sid in store_by_id
                  and pid and date and source
                  and TODAY - timedelta(days=180)
                  <= date <= TODAY
              ):
                  continue

              if event.get(
                  "inventory_scope"
              ) != "physical_store":
                  continue

              eid = event.get("event_id")
              if not eid:
                  continue

              collected.setdefault(eid, event)

          sightings = list(collected.values())

          diagnostics["new_events"] = (
              len(collected) -
              len({
                  x.get("event_id")
                  for x in existing
                  if isinstance(x, dict)
                  and x.get("event_id")
                  in collected
              })
          )

          # Independent histories by store,
          # TCG game, and exact product.
          product_history = defaultdict(set)
          game_history = defaultdict(set)
          latest_product = {}

          for event in sightings:
              sid = event.get("store_id")
              pid = event.get("product_id")
              game = event.get("game")
              d = date_of(
                  event.get("observed_at")
              )

              if not all([sid, pid, game, d]):
                  continue

              product_history[
                  (sid, game, pid)
              ].add(d)

              game_history[
                  (sid, game)
              ].add(d)

              key = (sid, game, pid)
              old = latest_product.get(key)

              if (
                  old is None
                  or event["observed_at"]
                  > old["observed_at"]
              ):
                  latest_product[key] = event

          def predict(dates):
              dates = sorted(dates)
              n = len(dates)

              result = {
                  "observations": n,
                  "predicted_date": None,
                  "confidence":
                      "Insufficient evidence"
              }

              if n < 3:
                  return result

              weeks = {
                  d.isocalendar()[:2]
                  for d in dates
              }

              if len(weeks) < 3:
                  return result

              counts = Counter(
                  d.weekday()
                  for d in dates
              )

              weekday, hits = (
                  counts.most_common(1)[0]
              )

              agreement = hits / n

              if agreement < 0.5:
                  result["confidence"] = (
                      "No consistent pattern"
                  )
                  return result

              for offset in range(8):
                  candidate = (
                      TODAY +
                      timedelta(days=offset)
                  )

                  if candidate.weekday() == weekday:
                      result["predicted_date"] = (
                          candidate.isoformat()
                      )
                      break

              result["confidence"] = (
                  "Moderate"
                  if n >= 6 and agreement >= 0.7
                  else "Low"
              )

              result["weekday_agreement"] = (
                  round(agreement, 3)
              )

              return result

          product_forecasts = []

          for key, dates in product_history.items():
              sid, game, pid = key
              event = latest_product[key]
              store = store_by_id[sid]

              product_forecasts.append({
                  "store_id": sid,
                  "store_name":
                      store.get("name"),
                  "address":
                      store.get("address"),
                  "city":
                      store.get("city"),
                  "state":
                      store.get("state"),
                  "game": game,
                  "product_id": pid,
                  "product_name":
                      event.get("product_name"),
                  **predict(dates),
                  "source_url":
                      event.get("source_url"),
                  "current_stock_verified": False
              })

          game_forecasts = []

          for (sid, game), dates in (
              game_history.items()
          ):
              store = store_by_id[sid]

              game_forecasts.append({
                  "store_id": sid,
                  "store_name":
                      store.get("name"),
                  "address":
                      store.get("address"),
                  "city":
                      store.get("city"),
                  "state":
                      store.get("state"),
                  "game": game,
                  **predict(dates),
                  "current_stock_verified": False
              })

          save(
              "v32_sightings.json",
              sightings
          )
          save(
              "v32_store_product_forecasts.json",
              product_forecasts
          )
          save(
              "v32_store_game_forecasts.json",
              game_forecasts
          )
          save(
              "v32_diagnostic_samples.json",
              samples
          )

          # Preserve V30 and V31 shipment records.
          # Replace only prior V32 entries.
          shipments = load(
              "shipments.json",
              {"events": [], "forecasts": []}
          )

          if not isinstance(shipments, dict):
              shipments = {
                  "events": [],
                  "forecasts": []
              }

          previous = shipments.get(
              "forecasts", []
          )

          if not isinstance(previous, list):
              previous = []

          previous = [
              f for f in previous
              if isinstance(f, dict)
              and f.get("forecast_engine") != "v32"
          ]

          for row in product_forecasts:
              if not row["predicted_date"]:
                  continue

              previous.append({
                  "forecast_engine": "v32",
                  "store_id": row["store_id"],
                  "store_name": (
                      str(row["store_name"]) +
                      " — " +
                      str(row["address"]) +
                      ", " +
                      str(row["city"]) +
                      ", " +
                      str(row["state"])
                  ),
                  "game": row["game"],
                  "product_id":
                      row["product_id"],
                  "product_name":
                      row["product_name"],
                  "predicted_date":
                      row["predicted_date"],
                  "confidence":
                      row["confidence"],
                  "source_url":
                      row["source_url"],
                  "inventory_status": "Unknown",
                  "delivery_confirmed": False
              })

          shipments["forecasts"] = previous
          shipments.setdefault("events", [])
          save("shipments.json", shipments)

          report = {
              "version": "32.1",
              "checked_at": NOW.isoformat(),
              "elapsed_seconds": round(
                  time.monotonic() - START, 2
              ),
              "stores_indexed": len(store_by_id),
              "games_supported": len(GAME_TERMS),
              "source_diagnostics": diagnostics,
              "rejection_reasons": dict(rejection),
              "sightings_preserved":
                  len(sightings),
              "store_product_records":
                  len(product_forecasts),
              "store_game_records":
                  len(game_forecasts),
              "dated_product_predictions": sum(
                  bool(
                      x.get("predicted_date")
                  )
                  for x in product_forecasts
              ),
              "note": (
                  "A successful run does not "
                  "confirm stock. Only source-backed "
                  "exact-store observations may "
                  "train predictions."
              )
          }

          save("v32_report.json", report)

          signal.alarm(0)
          print(
              json.dumps(report, indent=2),
              flush=True
          )
          PY

          python -u /tmp/v32_fast.py

      - name: Validate outputs
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          names = [
              "v32_report.json",
              "v32_sightings.json",
              "v32_store_product_forecasts.json",
              "v32_store_game_forecasts.json",
              "v32_diagnostic_samples.json",
              "shipments.json"
          ]

          for name in names:
              p = Path("data") / name
              assert p.exists(), name
              json.loads(
                  p.read_text(encoding="utf-8")
              )

          print("V32.1 validation passed")
          PY

      - name: Commit and publish
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "pokestock-bot"
          git config user.email \
            "actions@users.noreply.github.com"

          git add \
            data/v32_*.json \
            data/shipments.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m \
            "V32.1 optimized evidence collection"

          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "V32.1 published"
              exit 0
            fi

            sleep 5
          done

          echo "Publishing failed"
          exit 1
