name: Pokestock Location Social Dashboard

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install location-based social dashboard
        run: |
          cat > /tmp/install.py <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          start = "<!-- POKESTOCK LOCAL SOCIAL START -->"
          end = "<!-- POKESTOCK LOCAL SOCIAL END -->"

          panel = r'''
          <!-- POKESTOCK LOCAL SOCIAL START -->
          <section id="pslocal" style="max-width:1100px;margin:24px auto;padding:20px;border:1px solid #6b7280;border-radius:14px">
            <h2>Local TCG Social Restock Reports</h2>
            <p>Public reports and social leads, not verified store inventory. Location filtering uses approximate town centers when exact coordinates are unavailable.</p>

            <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
              <button id="pslocalgps" type="button">Use my location</button>
              <input id="pslocalzip" placeholder="ZIP code" maxlength="5" inputmode="numeric" style="width:110px">
              <button id="pslocalzipgo" type="button">Search ZIP</button>

              <label>Radius
                <select id="pslocalradius">
                  <option value="10">10 miles</option>
                  <option value="25">25 miles</option>
                  <option value="50" selected>50 miles</option>
                  <option value="75">75 miles</option>
                  <option value="100">100 miles</option>
                  <option value="150">150 miles</option>
                  <option value="250">250 miles</option>
                  <option value="0">Nationwide</option>
                </select>
              </label>

              <label>Retailer
                <select id="pslocalretailer">
                  <option value="">All retailers</option>
                  <option>Walmart</option>
                  <option>Target</option>
                  <option>Best Buy</option>
                  <option>GameStop</option>
                  <option>Costco</option>
                  <option>Walgreens</option>
                  <option>CVS</option>
                </select>
              </label>

              <label>Game
                <select id="pslocalgame">
                  <option value="">All games</option>
                  <option value="pokemon">Pokémon</option>
                  <option value="union arena">Union Arena</option>
                  <option value="gundam">Gundam</option>
                </select>
              </label>
            </div>

            <p id="pslocalstatus" role="status">Enter ZIP or use GPS to see local reports.</p>
            <div id="pslocalresults"></div>

            <details>
              <summary>Unlocated nationwide social leads</summary>
              <div id="pslocalunlocated"></div>
            </details>
          </section>

          <script>
          (()=>{
            "use strict";

            const $=id=>document.getElementById(id);
            const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({
              "&":"&amp;","<":"&lt;",">":"&gt;",
              '"':"&quot;","'":"&#39;"
            }[c]));

            const norm=s=>String(s??"").trim().toLowerCase();

            let origin=null,stores=[],reports=[],leads=[];

            const centers={
              "staunton|va":[38.1496,-79.0717],
              "waynesboro|va":[38.0685,-78.8895],
              "harrisonburg|va":[38.4496,-78.8689],
              "charlottesville|va":[38.0293,-78.4767],
              "fishersville|va":[38.099,-78.9692],
              "verona|va":[38.2021,-79.0081],
              "lexington|va":[37.784,-79.4428],
              "bridgewater|va":[38.3821,-78.9767],
              "elkton|va":[38.4079,-78.6236],
              "crozet|va":[38.0696,-78.7006]
            };

            const dist=(a,b)=>{
              const rad=Math.PI/180;
              const dl=(b[0]-a[0])*rad;
              const dn=(b[1]-a[1])*rad;
              const h=Math.sin(dl/2)**2+
                Math.cos(a[0]*rad)*
                Math.cos(b[0]*rad)*
                Math.sin(dn/2)**2;
              return 7917.6*Math.asin(
                Math.min(1,Math.sqrt(h))
              );
            };

            const safe=u=>{
              try{
                const v=new URL(u);
                return v.protocol==="https:"?v.href:"";
              }catch{return ""}
            };

            const point=s=>{
              if(s.lat!=null&&s.lon!=null&&
                 Number.isFinite(+s.lat)&&
                 Number.isFinite(+s.lon)){
                return [+s.lat,+s.lon];
              }
              return centers[
                norm(s.city)+"|"+norm(s.state)
              ]||null;
            };

            const card=(title,description,url)=>`
              <article style="padding:12px 0;border-bottom:1px solid #6b728055">
                <strong>${esc(title)}</strong>
                <p>${esc(description)}</p>
                ${safe(url)?`
                  <a href="${esc(safe(url))}"
                    target="_blank"
                    rel="noopener noreferrer">
                    View source
                  </a>`:""}
              </article>`;

            async function get(url,fallback){
              try{
                const r=await fetch(
                  url+"?v="+Date.now(),
                  {cache:"no-store"}
                );
                if(!r.ok)throw Error(r.status);
                return await r.json();
              }catch(e){
                console.warn(url,e);
                return fallback;
              }
            }

            function render(){
              const radius=+$("pslocalradius").value;
              const retailer=norm(
                $("pslocalretailer").value
              );
              const game=norm(
                $("pslocalgame").value
              );

              if(radius&&!origin){
                $("pslocalstatus").textContent=
                  "Enter a ZIP code or allow GPS to filter by travel radius.";
                $("pslocalresults").innerHTML="";
                return;
              }

              const matched=[],unlocated=[];

              for(const r of reports){
                if(retailer&&norm(r.retailer)!==retailer)
                  continue;
                if(game&&norm(r.game)!==game)
                  continue;

                const s=stores.find(
                  x=>x.source_id===r.store_id
                );
                if(!s)continue;

                const p=point(s);

                if(radius&&(!p||
                   dist(origin,p)>radius+10))
                  continue;

                const distance=radius&&p?
                  dist(origin,p):null;

                matched.push({
                  date:r.observed_at||
                    r.reported_at_approx||"",
                  distance,
                  html:card(
                    `${r.retailer||s.chain} — ${s.city}, ${s.state}`,
                    `${r.product_name||r.game||"TCG"} · ${String(r.observed_at||"").slice(0,10)} · Unverified community report${distance!==null?" · approx. "+distance.toFixed(1)+" miles straight-line":""}`,
                    r.source_url
                  )
                });
              }

              for(const r of leads){
                const title=r.title||"";
                const mentions=(
                  r.retailer_mentions||[]
                ).map(norm);

                if(retailer&&
                   !mentions.includes(retailer)&&
                   !norm(title).includes(retailer))
                  continue;

                if(game&&
                   !norm(title).includes(game)&&
                   !(game==="pokemon"&&
                     norm(title).includes("pokémon")))
                  continue;

                const city=norm(r.city);
                const state=norm(r.state);
                const p=centers[city+"|"+state];

                const item={
                  date:r.published_at||"",
                  distance:p&&origin?
                    dist(origin,p):null,
                  html:card(
                    `${r.platform||"Social"}: ${title}`,
                    `${r.published_at?String(r.published_at).slice(0,10):"Undated"} · Unverified social lead${p?" · "+r.city+", "+r.state:""}`,
                    r.source_url
                  )
                };

                if(p&&(!radius||
                   item.distance<=radius+10))
                  matched.push(item);
                else if(!p)
                  unlocated.push(item);
              }

              matched.sort((a,b)=>
                radius?
                  (a.distance??99999)-
                  (b.distance??99999):
                  b.date.localeCompare(a.date)
              );

              unlocated.sort((a,b)=>
                b.date.localeCompare(a.date)
              );

              $("pslocalresults").innerHTML=
                matched.slice(0,100)
                  .map(x=>x.html).join("")||
                "<p>No location-matched public reports in this radius. This does not mean stores are out of stock.</p>";

              $("pslocalunlocated").innerHTML=
                unlocated.slice(0,100)
                  .map(x=>x.html).join("")||
                "<p>No unlocated leads match these filters.</p>";

              $("pslocalstatus").textContent=
                `${matched.length} location-matched reports; ${unlocated.length} unlocated leads.`;
            }

            $("pslocalgps").onclick=()=>{
              if(!navigator.geolocation){
                $("pslocalstatus").textContent=
                  "GPS unavailable. Use ZIP.";
                return;
              }

              navigator.geolocation.getCurrentPosition(
                p=>{
                  origin=[
                    p.coords.latitude,
                    p.coords.longitude
                  ];
                  render();
                },
                e=>{
                  $("pslocalstatus").textContent=
                    "GPS error: "+e.message;
                },
                {timeout:15000}
              );
            };

            $("pslocalzipgo").onclick=async()=>{
              const z=$("pslocalzip").value.trim();

              if(!/^\d{5}$/.test(z)){
                $("pslocalstatus").textContent=
                  "Enter a five-digit ZIP.";
                return;
              }

              try{
                const r=await fetch(
                  "https://api.zippopotam.us/us/"+z
                );
                if(!r.ok)throw Error("ZIP not found");

                const d=await r.json();
                const p=d.places[0];

                origin=[
                  +p.latitude,
                  +p.longitude
                ];
                render();
              }catch(e){
                $("pslocalstatus").textContent=
                  "ZIP lookup failed: "+e.message;
              }
            };

            $("pslocalzip").onkeydown=e=>{
              if(e.key==="Enter")
                $("pslocalzipgo").click();
            };

            [
              "pslocalradius",
              "pslocalretailer",
              "pslocalgame"
            ].forEach(id=>{
              $(id).onchange=render;
            });

            Promise.all([
              get("data/physical_inventory_sources.json",[]),
              get("data/restock_observations.json",[]),
              get("data/social_restock_leads.json",{})
            ]).then(([s,r,l])=>{
              stores=Array.isArray(s)?s:[];
              reports=Array.isArray(r)?r:[];
              leads=Array.isArray(l.leads)?l.leads:[];
              render();
            });
          })();
          </script>
          <!-- POKESTOCK LOCAL SOCIAL END -->
          '''

          if start in s and end in s:
              s=re.sub(
                  re.escape(start)+r".*?"+re.escape(end),
                  lambda _:panel,
                  s,
                  flags=re.S
              )
          elif "</body>" in s.lower():
              s=re.sub(
                  r"</body>",
                  lambda m:panel+"\n"+m.group(0),
                  s,
                  count=1,
                  flags=re.I
              )
          else:
              s+="\n"+panel+"\n"

          p.write_text(s,encoding="utf-8")
          print("Location-based social dashboard installed")
          PY

          python /tmp/install.py

      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if ! git diff --cached --quiet; then
            git commit -m "Add location-based social report dashboard"
            git push
          fi
