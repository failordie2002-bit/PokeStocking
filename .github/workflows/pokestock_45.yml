          CSS45

          node --check assets/universal45.js

      - name: Attach add-on without removing Pokestock 2.0 features
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY45_HTML'
          from pathlib import Path

          p = Path('index.html')
          h = p.read_text(encoding='utf-8')

          assert 'assets/pokestock2.js' in h
          assert 'assets/pokestock2.css' in h

          c = (
              '<link rel="stylesheet" '
              'href="assets/universal45.css?v=45">'
          )

          j = (
              '<script defer '
              'src="assets/universal45.js?v=45"></script>'
          )

          if c not in h:
              h = h.replace(
                  '</head>', c + '\n</head>', 1
              )

          if j not in h:
              h = h.replace(
                  '</body>', j + '\n</body>', 1
              )

          assert h.count(c) == 1
          assert h.count(j) == 1

          p.write_text(h, encoding='utf-8')
          PY45_HTML

      - name: Validate source classification and preserve storefront
        shell: bash
        run: |
          set -euo pipefail

          python3 -m py_compile scripts/universal45.py
          node --check assets/universal45.js
          node --check assets/pokestock2.js

          python3 - <<'PY45_VERIFY'
          import json
          from pathlib import Path

          d = Path('data')

          u = json.loads(
              (d / 'universal45.json').read_text()
          )

          r = json.loads(
              (d / 'rumor45.json').read_text()
          )

          a = json.loads(
              (d / 'sams_allocations_45.json').read_text()
          )

          assert u['version'] == '45'
          assert len(u['games']) >= 15

          assert all(
              x['inventory_scope'] == 'listing_only'
              and not x['store_stock_verified']
              for x in u['retailer_listing_leads']
          )

          assert any(
              x['id'] == (
                  'collector-20261104-walmart-staunton-thu'
              )
              and x['confidence'] == 'Low'
              and x['weekday'] == 'Thursday'
              for x in r['reports']
          )

          assert all(
              not x['shelf_stock_verified']
              and x['confidence'] == 'Low'
              for x in r['reports']
          )

          assert all(
              not x['verified_shelf_stock']
              for x in a['records']
          )

          h = Path('index.html').read_text()

          for x in (
              'assets/universal45.js?v=45',
              'assets/universal45.css?v=45',
              'assets/pokestock2.js',
              'assets/warehouse44.js'
          ):
              assert x in h, x

          print(
              'SCRIPT 45 PASSED:',
              len(u['games']), 'TCGs,',
              len(u['retailer_listing_leads']),
              'official listing links,',
              len(r['reports']), 'rumor claims,',
              len(a['records']),
              'historical Sams allocations'
          )
          PY45_VERIFY

      - name: Commit research and new universal interface safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            scripts/universal45.py \
            assets/universal45.js \
            assets/universal45.css \
            index.html \
            data/universal45.json \
            data/universal45_state.json \
            data/sams_allocations_45.json \
            data/rumor45.json \
            data/universal45_report.json

          if git diff --cached --quiet; then
            echo 'Already current'
            exit 0
          fi

          git commit -m 'Pokestock 45 universal TCGs and labeled rumor forecasting'

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo 'SCRIPT 45 INSTALLED'
              exit 0
            fi

            sleep 5
          done

          exit 1
