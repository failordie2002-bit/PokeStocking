name: Pokestock Script 45 Universal TCG and Rumor Forecast

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pokestock_45.yml'
  schedule:
    - cron: '23 */4 * * *'

permissions:
  contents: write

concurrency:
  group: pokestock45-universal-evidence
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 18

    steps:
      - name: Checkout current Pokestock
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install public source parser
        run: python3 -m pip install --quiet requests beautifulsoup4

      - name: Install and run universal discovery and rumor research
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts data assets

          cat > scripts/universal45.py <<'PY45'
          import hashlib
          import json
          import re
          import time
          import unicodedata
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from urllib.parse import quote, urlsplit, urljoin
          from urllib.robotparser import RobotFileParser
          import xml.etree.ElementTree as ET
          import requests
          from bs4 import BeautifulSoup

          ROOT = Path('data')
          ROOT.mkdir(exist_ok=True)
          NOW = datetime.now(timezone.utc)
          UA = (
              'PokeStockPublicMonitor/1.0 '
              '(https://github.com/failordie2002-bit/PokeStocking)'
          )

          HTTP = requests.Session()
          HTTP.headers.update({
              'User-Agent': UA,
              'Accept': (
                  'text/html,application/rss+xml,'
                  'application/atom+xml,application/xml;q=0.9,'
                  '*/*;q=0.5'
              )
          })

          robots = {}
          diagnostics = {}
          attempts = 0

          def load(file, default):
              try:
                  a = json.loads(
                      (ROOT / file).read_text(encoding='utf-8')
                  )
                  return a if isinstance(
                      a, type(default)
                  ) else default
              except (OSError, ValueError):
                  return default

          def dump(file, obj):
              (ROOT / file).write_text(
                  json.dumps(
                      obj, ensure_ascii=False, indent=2
                  ) + '\n',
                  encoding='utf-8'
              )

          def clean(x, n=220):
              return ' '.join(str(x or '').split())[:n]

          def norm(x):
              return re.sub(
                  r'[^a-z0-9]+', ' ',
                  unicodedata.normalize(
                      'NFKD', clean(x, 500)
                  ).encode('ascii', 'ignore').decode().lower()
              ).strip()

          def valid(url):
              try:
                  u = urlsplit(str(url))
                  return (
                      u.scheme == 'https'
                      and bool(u.hostname)
                      and not u.username
                      and not u.password
                  )
              except ValueError:
                  return False

          def fetch(url):
              global attempts
              if not valid(url):
                  return None, 'invalid_url'

              host = urlsplit(url).hostname

              if host not in robots:
                  try:
                      r = HTTP.get(
                          'https://' + host + '/robots.txt',
                          timeout=8
                      )

                      if r.status_code in (401, 403, 429):
                          robots[host] = (None, False)

                      elif r.status_code == 200:
                          p = RobotFileParser()
                          p.parse(r.text.splitlines())
                          robots[host] = (p, True)

                      elif r.status_code == 404:
                          robots[host] = (None, True)

                      else:
                          robots[host] = (None, False)

                  except requests.RequestException:
                      robots[host] = (None, False)

              p, ok = robots[host]

              if not ok or (
                  p and not p.can_fetch(UA, url)
              ):
                  return None, 'robots_unavailable_or_disallow'

              attempts += 1
              if attempts > 1:
                  time.sleep(0.45)

              try:
                  r = HTTP.get(
                      url, timeout=14, allow_redirects=True
                  )

                  if r.status_code in (401, 403, 429):
                      return (
                          None,
                          'access_restricted_' + str(r.status_code)
                      )

                  if r.status_code != 200:
                      return None, 'http_' + str(r.status_code)

                  if not valid(r.url) or len(r.content) > 2600000:
                      return None, 'unexpected_response'

                  content_type = r.headers.get(
                      'Content-Type', ''
                  ).lower()

                  if not any(
                      t in content_type
                      for t in ('html', 'xml', 'rss', 'atom')
                  ):
                      return None, 'not_document'

                  if re.search(
                      'captcha|verify you are human|access denied',
                      r.text[:3000], re.I
                  ):
                      return None, 'human_challenge'

                  return r.text, 'ok'

              except requests.RequestException:
                  return None, 'network_unavailable'

          def sha(x):
              return hashlib.sha256(
                  str(x).encode()
              ).hexdigest()[:18]

          def published(s):
              try:
                  from email.utils import parsedate_to_datetime
                  d = parsedate_to_datetime(s)

                  if d.tzinfo is None:
                      d = d.replace(tzinfo=timezone.utc)

                  return d.astimezone(
                      timezone.utc
                  ).isoformat()

              except (ValueError, TypeError, IndexError):
                  return ''

          def game_set():
              names = [
                  'Pokémon',
                  'Union Arena',
                  'Gundam',
                  'One Piece',
                  'Yu-Gi-Oh!',
                  'Magic: The Gathering',
                  'Disney Lorcana',
                  'Digimon',
                  'Dragon Ball Super',
                  'Riftbound',
                  'Star Wars: Unlimited',
                  'Weiß Schwarz',
                  'Cardfight!! Vanguard',
                  'Flesh and Blood',
                  'Battle Spirits Saga',
                  'Shadowverse: Evolve',
                  'Grand Archive',
                  'Altered',
                  'Sorcery: Contested Realm',
                  'Final Fantasy TCG',
                  'Kayou'
              ]

              games = {norm(x): x for x in names}

              for name in (
                  'v31_product_catalogue.json',
                  'unified_online_39.json'
              ):
                  for x in load(name, []):
                      if isinstance(x, dict):
                          g = clean(x.get('game'), 75)
                          if g and norm(g) and norm(g) != 'unknown':
                              games[norm(g)] = g

              return sorted(
                  games.values(), key=str.casefold
              )

          def classify(title, games):
              n = norm(title)

              aliases = {
                  'Pokémon': ['pokemon', 'pokmon'],
                  'Yu-Gi-Oh!': ['yu gi oh', 'yugioh'],
                  'Magic: The Gathering': [
                      'magic the gathering', 'mtg'
                  ],
                  'Disney Lorcana': ['lorcana'],
                  'Star Wars: Unlimited': [
                      'star wars unlimited'
                  ],
                  'Gundam': ['gundam'],
                  'Union Arena': ['union arena']
              }

              for g in games:
                  terms = aliases.get(g, [norm(g)])

                  if any(
                      t and (' ' + t + ' ') in (' ' + n + ' ')
                      for t in terms
                  ):
                      return g

              return ''

          def sealed(title):
              n = norm(title)

              include = re.search(
                  r'booster|elite trainer|starter deck|'
                  r'trial deck|collection|premium box|'
                  r'card game|trading cards|mini tins?|'
                  r'display box|battle deck|tcg|blister|sealed',
                  n
              )

              exclude = re.search(
                  r'\b(singles?|sleeves?|binders?|playmats?|'
                  r'storage|card holder|graded|psa|'
                  r'protectors?|top loader)\b',
                  n
              )

              return bool(include) and not bool(exclude)

          def official(link):
              try:
                  u = urlsplit(link)
                  h = (
                      u.hostname or ''
                  ).lower().removeprefix('www.')

                  if u.scheme != 'https':
                      return ''

                  if (
                      h == 'lowes.com'
                      and u.path.startswith('/pd/')
                  ):
                      return "Lowe's"

                  if (
                      h == 'samsclub.com'
                      and u.path.startswith('/ip/')
                  ):
                      return "Sam's Club"

                  if h == 'costco.com' and (
                      u.path.startswith('/p/')
                      or u.path.endswith('.html')
                  ):
                      return 'Costco'

              except ValueError:
                  pass

              return ''

          def discover(games):
              prev = load('universal45.json', {})

              leads = {
                  x['url']: x
                  for x in prev.get(
                      'retailer_listing_leads', []
                  )
                  if isinstance(x, dict)
                  and valid(x.get('url'))
              }

              state = load('universal45_state.json', {})
              cursor = int(
                  state.get('cursor', 0)
              ) % len(games)

              # Rotate through four games each run.
              chosen = [
                  games[(cursor + i) % len(games)]
                  for i in range(min(4, len(games)))
              ]

              searches = []

              for game in chosen:
                  q = quote(game + ' trading card game')

                  searches.extend([
                      (
                          'Costco',
                          'https://www.costco.com/s?keyword=' + q
                      ),
                      (
                          "Sam's Club",
                          'https://www.samsclub.com/s/' + q
                      ),
                      (
                          "Lowe's",
                          'https://www.lowes.com/search?searchTerm=' + q
                      )
                  ])

              searches.append((
                  "Lowe's",
                  'https://www.lowes.com/ple/pokemon'
              ))

              results = {}

              for brand, url in searches:
                  page, status = fetch(url)
                  results[brand + ' | ' + url] = status

                  if not page:
                      continue

                  soup = BeautifulSoup(page, 'html.parser')

                  for a in soup.select('a[href]')[:1600]:
                      target = urljoin(
                          url, a.get('href', '')
                      )

                      b = official(target)
                      if b != brand:
                          continue

                      title = clean(
                          a.get_text(' ', strip=True)
                          or a.get('aria-label')
                          or a.get('title'),
                          190
                      )

                      game = classify(title, games)

                      if not game or not sealed(title):
                          continue

                      product_url = target.split(
                          '#'
                      )[0].split('?')[0]

                      leads[product_url] = {
                          'retailer': b,
                          'game': game,
                          'title': title,
                          'url': product_url,
                          'inventory_scope': 'listing_only',
                          'shipping_verified': False,
                          'store_stock_verified': False,
                          'first_seen': leads.get(
                              product_url, {}
                          ).get(
                              'first_seen', NOW.isoformat()
                          ),
                          'last_seen': NOW.isoformat(),
                          'source_type': 'official_search_page'
                      }

              items = sorted(
                  leads.values(),
                  key=lambda x: x.get('last_seen', ''),
                  reverse=True
              )[:500]

              dump('universal45.json', {
                  'version': '45',
                  'checked_at': NOW.isoformat(),
                  'games': games,
                  'retailer_listing_leads': items,
                  'last_batch_games': chosen,
                  'source_diagnostics': results,
                  'note': (
                      'Official listing links only. '
                      'Availability and pickup remain unknown '
                      'without explicit observed evidence.'
                  )
              })

              dump('universal45_state.json', {
                  'cursor': (cursor + 4) % len(games),
                  'last_batch_games': chosen,
                  'checked_at': NOW.isoformat()
              })

              return len(items)

          SAMS = [
              (
                  '2026-09-21',
                  'https://restockd.app/blog/ascended-heroes-focused-fighters-sams-club-wave-2-inventory'
              ),
              (
                  '2026-07-15',
                  'https://restockd.app/blog/ascended-heroes-focused-fighters-at-sam-s-club-inventory-by-location'
              )
          ]

          def allocations():
              old = load('sams_allocations_45.json', {})

              records = {
                  x['key']: x
                  for x in old.get('records', [])
                  if isinstance(x, dict) and x.get('key')
              }

              for date, url in SAMS:
                  html, status = fetch(url)
                  diagnostics[
                      'Sam allocations ' + date
                  ] = status

                  if not html:
                      continue

                  soup = BeautifulSoup(
                      html, 'html.parser'
                  )

                  state = ''

                  for tag in soup.find_all([
                      'h2', 'h3', 'li'
                  ]):
                      if tag.name in ('h2', 'h3'):
                          m = re.search(
                              r'\(([A-Z]{2})\)\s*$',
                              tag.get_text(' ', strip=True)
                          )
                          state = m.group(1) if m else ''
                          continue

                      if not state:
                          continue

                      row = clean(
                          tag.get_text(' ', strip=True), 260
                      )

                      m = re.match(
                          r'(.{2,90}?)'
                          r'(?:\s+\(Club\s*#(\d{3,5})\))?'
                          r':\s*([\d,]+)\s+on\s+hand'
                          r'(?:,\s*([\d,]+)\s+on\s+order)?',
                          row,
                          re.I
                      )

                      if not m:
                          continue

                      city = clean(m.group(1), 100)
                      club = m.group(2) or ''

                      key = sha(
                          url + '|' + state + '|'
                          + city + '|' + club
                      )

                      records[key] = {
                          'key': key,
                          'retailer': "Sam's Club",
                          'game': 'Pokémon',
                          'product': (
                              'Ascended Heroes Focused Fighters '
                              'Premium Collection'
                          ),
                          'city': city,
                          'state': state,
                          'club_number': club,
                          'reported_on_hand': int(
                              m.group(3).replace(',', '')
                          ),
                          'reported_on_order': (
                              int(
                                  m.group(4).replace(',', '')
                              )
                              if m.group(4) else None
                          ),
                          'report_date': date,
                          'source_url': url,
                          'source_kind': (
                              'independent_historical_allocation'
                          ),
                          'verified_shelf_stock': False,
                          'note': (
                              'Third-party historical snapshot; '
                              'quantities and locations are '
                              'not independently verified.'
                          )
                      }

              dump('sams_allocations_45.json', {
                  'version': '45',
                  'checked_at': NOW.isoformat(),
                  'records': list(records.values())[:1100],
                  'sources': [x[1] for x in SAMS],
                  'note': (
                      'July and September 2026 snapshots, '
                      'not current inventory. '
                      'Never sum different snapshots.'
                  )
              })

              return len(records)

          # One local hearsay claim; NOT an observation.
          SEED = {
              'id': 'collector-20261104-walmart-staunton-thu',
              'retailer': 'Walmart',
              'city': 'Staunton',
              'state': 'VA',
              'game': 'Pokémon',
              'weekday': 'Thursday',
              'period': 'early morning',
              'scope': 'city_retailer',
              'source_kind': 'local_collector_hearsay',
              'source_url': '',
              'reported_at': '2026-11-04',
              'title': (
                  'Rumor: Staunton Walmart Pokémon '
                  'restocks Thursday early morning'
              ),
              'note': (
                  'A local collector heard this pattern. '
                  'Branch, vendor schedule and stock have not '
                  'been verified. One hearsay report, '
                  'not weekly observations.'
              ),
              'evidence_count': 1,
              'confidence': 'Low',
              'shelf_stock_verified': False
          }

          FEEDS = [
              (
                  'Reddit PokemonRestocks',
                  'https://www.reddit.com/r/PokemonRestocks/new/.rss'
              ),
              (
                  'Reddit PokemonTCG',
                  'https://www.reddit.com/r/PokemonTCG/new/.rss'
              ),
              (
                  'Google News local',
                  'https://news.google.com/rss/search?q='
                  + quote(
                      'Pokemon TCG restock Staunton '
                      'Virginia when:30d'
                  )
                  + '&hl=en-US&gl=US&ceid=US:en'
              ),
              (
                  'Google News general',
                  'https://news.google.com/rss/search?q='
                  + quote(
                      'trading card game Walmart '
                      'restock Thursday when:7d'
                  )
                  + '&hl=en-US&gl=US&ceid=US:en'
              )
          ]

          CHAINS = [
              'Walmart', 'Target', 'Best Buy',
              'GameStop', 'Costco', "Sam's Club",
              "Lowe's", 'Dollar General',
              'Walgreens', 'CVS', 'Five Below'
          ]

          WEEK = [
              'Monday', 'Tuesday', 'Wednesday',
              'Thursday', 'Friday', 'Saturday',
              'Sunday'
          ]

          def rumors(games):
              old = load('rumor45.json', {})

              allrows = {
                  x['id']: x
                  for x in old.get('reports', [])
                  if isinstance(x, dict) and x.get('id')
              }

              allrows[SEED['id']] = SEED
              statuses = {}

              recent_games = load(
                  'universal45_state.json', {}
              ).get('last_batch_games', [])

              dynamic = [
                  (
                      'Google News ' + g,
                      'https://news.google.com/rss/search?q='
                      + quote(
                          g + ' TCG restock retailer when:7d'
                      )
                      + '&hl=en-US&gl=US&ceid=US:en'
                  )
                  for g in recent_games[:4]
              ]

              cities = {
                  (
                      norm(x.get('city')),
                      norm(x.get('state'))
                  ): clean(x.get('city'), 90)
                  for x in load('stores.json', [])
                  if isinstance(x, dict)
                  and x.get('city')
                  and x.get('state')
              }

              for name, url in FEEDS + dynamic:
                  xml, status = fetch(url)
                  statuses[name] = status

                  if not xml:
                      continue

                  try:
                      root = ET.fromstring(xml)
                  except ET.ParseError:
                      statuses[name] = 'invalid_feed'
                      continue

                  items = (
                      root.findall('.//item')
                      + root.findall(
                          './/{http://www.w3.org/2005/Atom}entry'
                      )
                  )

                  for item in items[:70]:
                      def tag(n):
                          x = (
                              item.findtext(n)
                              or item.findtext(
                                  '{http://www.w3.org/2005/Atom}'
                                  + n
                              )
                          )
                          return clean(x, 650)

                      title = tag('title')
                      desc = (
                          tag('description')
                          or tag('summary')
                      )

                      textbody = BeautifulSoup(
                          title + ' ' + desc,
                          'html.parser'
                      ).get_text(' ', strip=True)

                      term = norm(textbody)

                      if not re.search(
                          r'restock|stocking|stocked|'
                          r'shipment|delivery|cards arrived',
                          term
                      ):
                          continue

                      chain = next(
                          (
                              c for c in CHAINS
                              if norm(c) in term
                          ),
                          None
                      )

                      weekday = next(
                          (
                              w for w in WEEK
                              if norm(w) in term
                          ),
                          None
                      )

                      if not chain or not weekday:
                          continue

                      game = classify(textbody, games)

                      if not game:
                          continue

                      link = tag('link')

                      if not link:
                          a = item.find(
                              '{http://www.w3.org/2005/Atom}link'
                          )
                          link = (
                              a.get('href', '')
                              if a is not None else ''
                          )

                      if not valid(link):
                          continue

                      date = (
                          published(tag('pubDate'))
                          or tag('published')
                          or tag('updated')
                      )

                      try:
                          d = datetime.fromisoformat(
                              date.replace('Z', '+00:00')
                          )

                          if d.tzinfo is None:
                              d = d.replace(
                                  tzinfo=timezone.utc
                              )

                          if NOW - d.astimezone(
                              timezone.utc
                          ) > timedelta(days=45):
                              continue

                      except (ValueError, TypeError):
                          continue

                      city = ''
                      state = ''

                      for m in re.finditer(
                          r'\b([A-Z][a-z]+'
                          r'(?:\s+[A-Z][a-z]+){0,2})'
                          r'\s*,?\s+([A-Z]{2})\b',
                          textbody
                      ):
                          k = (
                              norm(m.group(1)),
                              norm(m.group(2))
                          )

                          if k in cities:
                              city = cities[k]
                              state = m.group(2)
                              break

                      if (
                          not city
                          and 'staunton' in term
                          and re.search(
                              r'\b(va|virginia)\b', term
                          )
                      ):
                          city = 'Staunton'
                          state = 'VA'

                      period = (
                          'morning'
                          if re.search(
                              r'\bmorning\b', term
                          )
                          else (
                              'evening'
                              if 'evening' in term
                              else 'unspecified'
                          )
                      )

                      key = 'feed-' + sha(link)

                      allrows[key] = {
                          'id': key,
                          'retailer': chain,
                          'city': city,
                          'state': state,
                          'game': game,
                          'weekday': weekday,
                          'period': period,
                          'scope': (
                              'city_retailer'
                              if city
                              else 'general_retailer'
                          ),
                          'source_kind': (
                              'public_rss_title_claim'
                          ),
                          'source_url': link,
                          'reported_at': date,
                          'title': title,
                          'note': (
                              'Unverified public headline or '
                              'post. May be generic guidance '
                              'rather than a direct observation.'
                          ),
                          'evidence_count': 1,
                          'confidence': 'Low',
                          'shelf_stock_verified': False
                      }

              active = {}

              for k, x in allrows.items():
                  if k == SEED['id']:
                      active[k] = x
                      continue

                  try:
                      d = datetime.fromisoformat(
                          str(
                              x.get('reported_at', '')
                          ).replace('Z', '+00:00')
                      )

                      if (
                          d.tzinfo
                          and NOW - d.astimezone(
                              timezone.utc
                          ) <= timedelta(days=90)
                      ):
                          active[k] = x

                  except (ValueError, TypeError):
                      pass

              rows = sorted(
                  active.values(),
                  key=lambda x: x.get(
                      'reported_at', ''
                  ),
                  reverse=True
              )[:250]

              dump('rumor45.json', {
                  'version': '45',
                  'checked_at': NOW.isoformat(),
                  'reports': rows,
                  'sources': statuses,
                  'rules': [
                      'A source URL contributes one dated claim.',
                      'General retailer rumors never verify a branch.',
                      'Hearsay always retains low confidence.',
                      'No private retailer data or vendor tracking.'
                  ]
              })

              return len(rows)

          if __name__ == '__main__':
              games = game_set()
              discovered = discover(games)
              a = allocations()
              rumors_count = rumors(games)

              dump('universal45_report.json', {
                  'checked_at': NOW.isoformat(),
                  'supported_games': len(games),
                  'retailer_listing_leads': discovered,
                  'sams_historical_allocation_entries': a,
                  'rumor_claims': rumors_count,
                  'allocation_source_diagnostics': diagnostics,
                  'robots_hosts': {
                      h: (
                          'available'
                          if x[1]
                          else 'disallowed_or_unavailable'
                      )
                      for h, x in robots.items()
                  },
                  'limitations': (
                      'No live shelf inventory. '
                      'No CAPTCHA or rate-limit bypass. '
                      'Rumors stay low confidence. '
                      'Scheduled runs are not guaranteed exact.'
                  )
              })

              print(
                  'SCRIPT 45 SOURCE AUDIT:',
                  json.dumps(
                      load('universal45_report.json', {}),
                      ensure_ascii=False
                  )
              )
          PY45

          python3 -m py_compile scripts/universal45.py
          python3 scripts/universal45.py

      - name: Build universal game navigation and rumor display
        shell: bash
        run: |
          set -euo pipefail

          cat > assets/universal45.js <<'JS45'
          (()=>{
          'use strict';

          const root=document.getElementById('ps2root');
          if(!root||document.getElementById('ps45RumorPanel'))return;

          const safe=u=>{
            try{
              const x=new URL(u);
              return x.protocol==='https:'?x.href:'';
            }catch{return '';}
          };

          const esc=x=>String(x??'').replace(
            /[&<>"']/g,
            c=>({
              '&':'&amp;',
              '<':'&lt;',
              '>':'&gt;',
              '"':'&quot;',
              "'":'&#39;'
            }[c])
          );

          const norm=x=>String(x||'')
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g,'')
            .replace(/[^a-z0-9]/g,'');

          const load=async(p,def)=>{
            try{
              const r=await fetch(
                p+'?v='+Date.now(),
                {cache:'no-store'}
              );
              return r.ok?await r.json():def;
            }catch{return def;}
          };

          let rumors=[];
          let allocations=[];
          let listings=[];
          let stores=[];
          let games=[];

          const choices=document.getElementById('ps2Games');

          const panel=document.createElement('section');
          panel.id='ps45RumorPanel';
          panel.className='ps45panel';

          const controls=document.querySelector(
            '#ps2-forecast .ps2controls'
          );
          if(controls)controls.after(panel);

          const membership=document.createElement('section');
          membership.className='ps45panel';
          membership.id='ps45ClubReports';

          const radar=document.getElementById('ps44Radar');

          if(radar)radar.after(membership);
          else if(choices)choices.after(membership);

          const selection=document.getElementById(
            'ps2ForecastStore'
          );

          const aliases={'Pokémon':'Pokemon'};

          function setGameFilters(){
            if(!choices||!games.length)return;

            const show=[
              'Pokémon','Union Arena','One Piece'
            ].filter(g=>games.includes(g));

            const other=games.filter(g=>!show.includes(g));

            choices.replaceChildren();

            const make=(label,val)=>{
              const b=document.createElement('button');
              b.type='button';
              b.className='ps2chip'+(!val?' sel':'');
              b.textContent=label;
              b.dataset.game=val;
              choices.append(b);
              return b;
            };

            make('All TCGs','');

            show.forEach(
              g=>make(g,aliases[g]||g)
            );

            const select=document.createElement('select');
            select.id='ps45Games';

            select.setAttribute(
              'aria-label',
              'Choose any trading card game'
            );

            select.innerHTML=
              '<option value="">More TCGs…</option>'+
              other.map(g=>`
                <option value="${esc(aliases[g]||g)}">
                  ${esc(g)}
                </option>
              `).join('');

            select.addEventListener('change',()=>{
              let b=choices.querySelector(
                '[data-ps45-temp]'
              );

              if(b)b.remove();

              b=make(
                select.options[
                  select.selectedIndex
                ].text,
                select.value
              );

              b.dataset.ps45Temp='1';
              b.click();
            });

            choices.append(select);

            choices.addEventListener('click',e=>{
              const b=e.target.closest('[data-game]');
              if(
                b&&b.dataset.ps45Temp!=='1'
              )select.value='';
            });
          }

          function renderRumors(){
            if(!panel||!selection)return;

            const store=stores.find(
              x=>String(x.id)===String(selection.value)
            );

            if(!store){
              panel.innerHTML=`
                <h3>Collector watch windows</h3>
                <p>
                  Choose a nearby store to see dated,
                  unverified restock rumors separately
                  from actual observations.
                </p>`;
              return;
            }

            const chain=norm(store.name||'');
            const loc=norm(store.city||'');
            const state=norm(store.state||'');

            const same=rumors.filter(r=>
              r.scope==='city_retailer'&&
              norm(r.city)===loc&&
              norm(r.state)===state&&
              chain.includes(norm(r.retailer))
            );

            const broad=rumors.filter(r=>
              r.scope==='general_retailer'&&
              chain.includes(norm(r.retailer))
            ).slice(0,3);

            const line=r=>`
              <article class="ps45rumor">
                <strong>
                  ${esc(r.game)} ·
                  ${esc(r.weekday)}
                  ${r.period&&r.period!=='unspecified'?
                    ' '+esc(r.period):''}
                </strong>

                <span class="ps45level">
                  Rumor · low confidence
                </span>

                <p>
                  ${esc(
                    r.note||r.title||'Unverified collector claim'
                  )}
                </p>

                <small>
                  First reported
                  ${esc(String(r.reported_at||'').slice(0,10))}
                  ·
                  ${esc(
                    r.scope==='city_retailer'?
                    'City-specific hearsay':
                    'General retailer claim; not branch evidence'
                  )}
                </small>

                ${safe(r.source_url)?`
                  <a href="${esc(safe(r.source_url))}"
                     target="_blank"
                     rel="noopener noreferrer">
                    Source
                  </a>`:''}
              </article>`;

            const selected=same.slice(0,4);

            const DAYS=[
              'Mon','Tue','Wed','Thu','Fri','Sat','Sun'
            ];

            const strip=selected.length?
              '<div class="ps45strip">'+
              DAYS.map(d=>{
                const n=selected.filter(
                  r=>r.weekday.slice(0,3)
                    .toLowerCase()===d.toLowerCase()
                ).length;

                return `
                  <div class="${n?'watch':''}">
                    <b>${d}</b>
                    <span>
                      ${n?n+' rumor':'—'}
                    </span>
                  </div>`;
              }).join('')+
              '</div>':'';

            const summary=selected.length?
              `<p class="ps45warning">
                ${selected.length} hearsay record(s)
                tied to ${esc(store.city)}.
                These are <b>not observed restocks</b>
                and do not indicate today's stock.
              </p>`:
              `<p>
                No city-specific restock rumor
                recorded for this branch.
              </p>`;

            panel.innerHTML=
              '<h3>Community restock watch</h3>'+
              summary+
              strip+
              selected.map(line).join('')+
              (broad.length?`
                <details>
                  <summary>
                    General retailer chatter
                    (not local confirmation)
                  </summary>
                  ${broad.map(line).join('')}
                </details>`:'')+
              `<p class="ps45disclaimer">
                No predicted deliveries, live shelf
                quantities, or certainty percentages
                are claimed from rumors.
              </p>`;
          }

          function renderClubReports(){
            if(!membership)return;

            let loc=null;

            try{
              loc=JSON.parse(
                localStorage.getItem('ps2location')||'null'
              );
            }catch{}

            if(!loc||!stores.length){
              membership.innerHTML=`
                <h3>Sam’s Club historical allocations</h3>
                <p>
                  Set GPS or ZIP in Near Me to identify
                  nearby clubs. Reports are historical
                  and unverified.
                </p>`;
              return;
            }

            const dist=(a,b,c,d)=>{
              const rad=Math.PI/180;
              const h=
                Math.sin((c-a)*rad/2)**2+
                Math.cos(a*rad)*Math.cos(c*rad)*
                Math.sin((d-b)*rad/2)**2;

              return 3958.8*2*Math.asin(
                Math.min(1,Math.sqrt(h))
              );
            };

            const radius=+(
              localStorage.getItem('ps2radius')||50
            );

            const near=stores.filter(s=>
              /^(sam's club|sams club)$/i.test(s.name||'')&&
              s.city&&s.lat!=null&&s.lon!=null
            ).map(s=>({
              ...s,
              miles:dist(
                +loc.lat,+loc.lon,+s.lat,+s.lon
              )
            })).filter(s=>
              s.miles<=radius
            ).sort((a,b)=>
              a.miles-b.miles
            ).slice(0,5);

            const rows=[];

            for(const s of near){
              const rs=allocations.filter(a=>
                norm(a.state)===norm(s.state)&&
                norm(a.city).startsWith(norm(s.city))
              );

              if(!rs.length)continue;

              const history=rs.sort(
                (a,b)=>String(b.report_date)
                  .localeCompare(String(a.report_date))
              ).slice(0,3);

              rows.push(`
                <div class="ps45rumor">
                  <strong>
                    ${esc(s.name)} ·
                    ${esc(s.city)} ·
                    ${s.miles.toFixed(1)} mi
                  </strong>

                  ${history.map(a=>`
                    <p>
                      ${esc(a.product)}
                      · <b>${esc(a.report_date)}</b>:
                      ${a.reported_on_hand}
                      historically reported on hand
                      ${a.reported_on_order!=null?
                        ', '+a.reported_on_order+
                        ' on order':''}.
                      <b>Not current inventory.</b>

                      ${safe(a.source_url)?`
                        <a href="${esc(safe(a.source_url))}"
                           target="_blank"
                           rel="noopener noreferrer">
                          Source
                        </a>`:''}
                    </p>
                  `).join('')}
                </div>`);
            }

            membership.innerHTML=`
              <h3>
                Sam’s Club historical allocation reports
              </h3>

              <p>
                Published club counts, not live shelf
                inventory. Different report dates are
                separate snapshots; quantities are never
                added together.
              </p>
              ${rows.join('')||`
                <p>
                  No matching historical allocations
                  found for clubs inside your radius.
                </p>`}`;
          }

          function extraOfficial(){
            if(!membership||!listings.length)return;

            const details=document.createElement('details');
            details.className='ps45extras';

            details.innerHTML=`
              <summary>
                Additional TCG listings at
                Costco, Sam’s &amp; Lowe’s
                (${listings.length})
              </summary>

              <p>
                Official product links only.
                No shipping or pickup is implied.
              </p>

              ${listings.slice(0,18).map(x=>`
                <div class="ps45link">
                  <b>${esc(x.game)}</b>
                  · ${esc(x.retailer)}
                  · ${esc(x.title)}
                  ${safe(x.url)?`
                    <a href="${esc(safe(x.url))}"
                       target="_blank"
                       rel="noopener noreferrer">
                      Source
                    </a>`:''}
                </div>
              `).join('')}`;

            membership.append(details);
          }

          Promise.all([
            load('data/universal45.json',{}),
            load('data/rumor45.json',{}),
            load('data/sams_allocations_45.json',{}),
            load('data/stores.json',[])
          ]).then(([u,r,a,s])=>{
            games=Array.isArray(u.games)?u.games:[];
            listings=Array.isArray(
              u.retailer_listing_leads
            )?u.retailer_listing_leads:[];

            rumors=Array.isArray(
              r.reports
            )?r.reports:[];

            allocations=Array.isArray(
              a.records
            )?a.records:[];

            stores=Array.isArray(s)?s:[];

            setGameFilters();
            renderRumors();
            renderClubReports();
            extraOfficial();
          });

          selection?.addEventListener(
            'change',
            ()=>setTimeout(renderRumors,0)
          );

          if(selection){
            new MutationObserver(
              ()=>renderRumors()
            ).observe(
              selection,{childList:true}
            );
          }

          document.addEventListener('click',e=>{
            if(e.target.closest(
              '#ps2GPS,#ps2ZipGo,#ps2Place,'+
              '[data-ps2-tab],#ps2Radius'
            )){
              setTimeout(()=>{
                renderClubReports();
                renderRumors();
                extraOfficial();
              },300);
            }
          });
          })();
          JS45

          cat > assets/universal45.css <<'CSS45'
          /* Script 45: all TCGs and separated rumor evidence */

          #ps2root #ps2Games {
            display:flex;
            flex-wrap:wrap;
