name: PokeStock V10 Online Inventory

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */2 * * *"

permissions:
  contents: write

# Serialize publishing with the other PokéStock
# workflows to reduce data conflicts.
concurrency:
  group: pokestock-monitor
  cancel-in-progress: false

jobs:
  inventory:
    name: Check Verified Online Availability
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install \
            requests beautifulsoup4

      - name: Validate stock checker
        run: |
          python -m py_compile \
            scripts/online_inventory.py

      - name: Check actual online offers
        timeout-minutes: 12
        run: |
          python scripts/online_inventory.py

      - name: Validate inventory evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          offers_path = Path("data/online_offers.json")
          report_path = Path(
              "data/online_inventory_report.json"
          )

          offers = json.loads(
              offers_path.read_text(encoding="utf-8")
          )
          report = json.loads(
              report_path.read_text(encoding="utf-8")
          )

          if not isinstance(offers, list):
              raise SystemExit("Invalid offers data")

          if not isinstance(report, dict):
              raise SystemExit("Invalid report")

          allowed = {
              "In stock",
              "Out of stock",
              "Preorder",
              "Backorder",
          }

          for offer in offers:
              if not isinstance(offer, dict):
                  raise SystemExit("Invalid offer entry")

              if offer.get("inventory_scope") != "online":
                  raise SystemExit(
                      "Physical-store claim detected"
                  )

              if offer.get("availability") not in allowed:
                  raise SystemExit(
                      "Unrecognized availability"
                  )

              if not offer.get("evidence_url"):
                  raise SystemExit(
                      "Missing evidence link"
                  )

              if not offer.get("checked_at"):
                  raise SystemExit(
                      "Missing observation timestamp"
                  )

          if report.get(
              "physical_store_stock_claims", 0
          ) != 0:
              raise SystemExit(
                  "Unexpected physical-store stock claim"
              )

          print("Inventory report validated.")
          print(
              "Products checked:",
              report.get("checked_this_run", 0)
          )
          print(
              "Evidence-backed offers:",
              len(offers)
          )
          PY

      - name: Publish inventory observations
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "pokestock-bot"
          git config user.email \
            "actions@users.noreply.github.com"

          git add \
            data/online_offers.json \
            data/online_inventory_report.json

          if git diff --cached --quiet; then
            echo "No inventory changes."
            exit 0
          fi

          git commit -m \
            "Update evidence-backed online inventory"

          for attempt in 1 2 3; do
            echo "Publishing attempt $attempt"
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Conflicting data update."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Inventory published successfully."
              exit 0
            fi

            sleep 3
          done

          echo "::error::Failed to publish inventory."
          exit 1

      - name: Show stock check summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/online_inventory_report.json"
          )

          if not path.exists():
              print("No stock report generated.")
              raise SystemExit(0)

          report = json.loads(
              path.read_text(encoding="utf-8")
          )

          print("=== POKESTOCK V10 ===")
          print(
              "Candidate products:",
              report.get("candidate_products")
          )
          print(
              "Checked this run:",
              report.get("checked_this_run")
          )
          print(
              "Explicit online offers:",
              report.get(
                  "offers_with_explicit_evidence"
              )
          )
          print(
              "Fresh offers:",
              report.get("total_fresh_offers")
          )

          for check in report.get("checks", []):
              print(
                  check.get("status"),
                  check.get("product", "")[:75]
              )
          PY
