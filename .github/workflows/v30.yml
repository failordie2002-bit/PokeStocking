name: Pokestock V30 Restock Forecasts

on:
  workflow_dispatch:
  schedule:
    - cron: "27 9 * * *"

permissions:
  contents: write

concurrency:
  group: pokestock-monitor
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build nationwide forecasts
        shell: bash
        run: |
          mkdir -p data

          cat > /tmp/pokestock_v30.py <<'PY'
          import json
          import re
          from collections import Counter, defaultdict
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          DATA = Path("data")
          DATA.mkdir(exist_ok=True)

          NOW = datetime.now(timezone.utc)
          TODAY = NOW.date()
          STAMP = NOW.isoformat()

          # Research-derived watch windows.
          # These are NOT verified delivery schedules.
          # Weekdays: Monday=0 through Sunday=6.
          # Empty list means no defensible day preference.
          RESEARCH = {
              "Walmart": {
                  "days": [3, 4, 5],
                  "source": "https://bujusjujus.com/guides/walmart-pokemon-restock-times",
                  "note": "Unverified vendor-route watch window"
              },
              "Target": {
                  "days": [],
                  "source": "https://www.poke-life.com/research/when-does-target-restock-pokemon-cards/",
                  "note": "Vendor schedule varies by store"
              },
              "Best Buy": {
                  "days": [],
                  "source": "https://restockd.app/blog/when-does-best-buy-restock-pokemon-cards",
                  "note": "Launch dates are more reliable than weekdays"
              },
              "GameStop": {
                  "days": [],
                  "source": "https://www.typa.app/blog/when-does-gamestop-restock-pokemon-cards",
                  "note": "Release allocations and irregular replenishment"
              },
              "Barnes & Noble": {
                  "days": [],
                  "source": "https://packsnearme.com/guides/does-barnes-and-noble-sell-pokemon-cards",
                  "note": "No published store restock schedule"
              },
              "Kohls": {
                  "days": [1, 3],
                  "source": "https://www.historytools.org/consumer/when-does-kohls-restock",
                  "note": "General freight only; not TCG-specific"
              },
              "Ross": {
                  "days": [1, 2, 3],
                  "source": "https://www.getmepromo.com/blog/when-does-ross-restock",
                  "note": "General merchandise only; not TCG-specific"
              },
              "Burlington": {
                  "days": [],
                  "source": "",
                  "note": "No verified TCG delivery pattern"
              },
              "Five Below": {
                  "days": [],
                  "source": "https://pokerestockapp.com/restocks/five-below/",
                  "note": "Online activity does not establish shelf restocks"
              },
              "Lowes": {
                  "days": [],
                  "source": "https://cardboardalpha.com/drops/retailers/lowes",
                  "note": "No verified TCG delivery pattern"
              },
              "Walgreens": {
                  "days": [],
                  "source": "",
                  "note": "Store-level TCG observations required"
              },
              "CVS": {
                  "days": [],
                  "source": "",
                  "note": "Store-level TCG observations required"
              },
              "Dollar General": {
                  "days": [],
                  "source": "",
                  "note": "Store-level TCG observations required"
              }
          }

          def load(name, fallback):
              try:
                  return json.loads(
                      (DATA / name).read_text(encoding="utf-8")
                  )
              except (OSError, ValueError):
                  return fallback

          def save(name, value):
              path = DATA / name
              tmp = path.with_suffix(".tmp")
              tmp.write_text(
                  json.dumps(value, indent=2, ensure_ascii=False),
                  encoding="utf-8"
              )
              tmp.replace(path)

          def clean(x):
              return " ".join(str(x or "").split())

          def date_of(value):
              try:
                  return datetime.fromisoformat(
                      str(value).replace("Z", "+00:00")
                  ).date()
              except (ValueError, TypeError):
                  try:
                      return datetime.strptime(
                          str(value)[:10], "%Y-%m-%d"
                      ).date()
                  except (ValueError, TypeError):
                      return None

          def chain_of(store):
              name = clean(
                  store.get("chain") or store.get("name")
              ).lower()

              patterns = [
                  ("Walmart", r"\bwalmart\b"),
                  ("Target", r"\btarget\b"),
                  ("Best Buy", r"\bbest buy\b"),
                  ("GameStop", r"\bgame\s*stop\b"),
                  ("Barnes & Noble", r"barnes.*noble"),
                  ("Kohls", r"\bkohl"),
                  ("Ross", r"\bross\b"),
                  ("Burlington", r"\bburlington\b"),
                  ("Five Below", r"\bfive below\b"),
                  ("Lowes", r"\blowe"),
                  ("Walgreens", r"\bwalgreens\b"),
                  ("CVS", r"\bcvs\b"),
                  ("Dollar General", r"\bdollar general\b")
              ]

              for chain, pattern in patterns:
                  if re.search(pattern, name):
                      return chain

              return ""

          def next_weekday(day, start=TODAY):
              for offset in range(0, 8):
                  d = start + timedelta(days=offset)
                  if d.weekday() == day:
                      return d
              return start

          def key_of(store):
              return clean(
                  store.get("source_id") or store.get("id")
              )

          def event_store_key(event):
              return clean(
                  event.get("store_id") or
                  event.get("source_id")
              )

          def is_verified_event(event):
              if not isinstance(event, dict):
                  return False

              # Only explicit, source-backed observations.
              # A prediction or online stock event cannot
              # train the physical-store model.
              kind = clean(
                  event.get("event_type") or
                  event.get("type") or
                  event.get("kind")
              ).lower()

              accepted = {
                  "confirmed_shelf_restock",
                  "confirmed_store_delivery",
                  "verified_in_store_sighting",
                  "confirmed event"
              }

              if kind not in accepted:
                  return False

              if clean(event.get("inventory_scope")).lower() \
                      not in ("physical_store", "in_store"):
                  return False

              if not clean(event.get("source_url")):
                  return False

              if not event_store_key(event):
                  return False

              d = date_of(
                  event.get("observed_at") or event.get("date")
              )

              return bool(
                  d and
                  TODAY - timedelta(days=180) <= d <= TODAY
              )

          shipments = load(
              "shipments.json",
              {"events": [], "forecasts": []}
          )

          if not isinstance(shipments, dict):
              shipments = {"events": [], "forecasts": []}

          events = shipments.get("events", [])
          if not isinstance(events, list):
              events = []

          stores = load(
              "physical_inventory_sources.json", []
          )

          if not isinstance(stores, list):
              stores = []

          status = load("status.json", {})
          products = status.get("products", []) \
              if isinstance(status, dict) else []

          if not isinstance(products, list):
              products = []

          history = defaultdict(list)

          for event in events:
              if not is_verified_event(event):
                  continue

              history[event_store_key(event)].append(event)

          # Deduplicate sightings on the same date.
          # Multiple posts about one delivery must not
          # become multiple independent observations.
          forecasts = []
          model_details = []
          covered = Counter()

          # Prioritize the Staunton region but retain
          # nationwide coverage.
          def store_priority(s):
              local = (
                  clean(s.get("priority_area"))
                  == "Staunton region"
              )
              return (
                  0 if local else 1,
                  clean(s.get("state")),
                  clean(s.get("city")),
                  clean(s.get("name"))
              )

          for store in sorted(stores, key=store_priority):
              if not isinstance(store, dict):
                  continue

              chain = chain_of(store)

              if not chain:
                  continue

              store_id = key_of(store)

              if not store_id:
                  continue

              covered[chain] += 1

              location = ", ".join(
                  x for x in [
                      clean(store.get("city")),
                      clean(store.get("state"))
                  ] if x
              )

              store_name = (
                  clean(store.get("name")) +
                  (" — " + location if location else "")
              )

              observed = history.get(store_id, [])
              distinct_dates = {}

              for e in observed:
                  d = date_of(
                      e.get("observed_at") or e.get("date")
                  )
                  if d:
                      distinct_dates[d.isoformat()] = e

              dated = sorted(
                  distinct_dates.items()
              )

              weekday_counts = Counter(
                  date_of(d).weekday()
                  for d, _ in dated
              )

              n = len(dated)
              research = RESEARCH[chain]

              if n >= 3:
                  best_day, hits = weekday_counts.most_common(1)[0]
                  fraction = hits / n

                  # Repeated observations spread across
                  # several weeks are more useful.
                  weeks = len({
                      date_of(d).isocalendar()[:2]
                      for d, _ in dated
                  })

                  if weeks >= 3 and fraction >= 0.6:
                      tier = "Moderate"
                  else:
                      tier = "Low"

                  predicted = next_weekday(best_day)
                  source = dated[-1][1].get("source_url", "")
                  basis = "Store-specific historical observations"
                  watch_days = [best_day]

              elif research["days"]:
                  tier = "Research only"
                  watch_days = research["days"]
                  predicted = min(
                      next_weekday(d) for d in watch_days
                  )
                  source = research["source"]
                  basis = research["note"]

              else:
                  tier = "Unknown"
                  watch_days = []
                  predicted = None
                  source = research["source"]
                  basis = research["note"]

              model_details.append({
                  "store_id": store_id,
                  "store_name": store_name,
                  "chain": chain,
                  "city": clean(store.get("city")),
                  "state": clean(store.get("state")),
                  "confidence": tier,
                  "observation_count": n,
                  "weekday_counts": {
                      str(k): v
                      for k, v in weekday_counts.items()
                  },
                  "watch_weekdays": watch_days,
                  "predicted_date": (
                      predicted.isoformat()
                      if predicted else None
                  ),
                  "basis": basis,
                  "source_url": source,
                  "last_observation": (
                      dated[-1][0] if dated else None
                  ),
                  "inventory_status": "Unknown",
                  "delivery_confirmed": False
              })

              if predicted:
                  forecasts.append({
                      "name": (
                          "TCG restock watch — " +
                          tier + " confidence"
                      ),
                      "product_name": (
                          "TCG restock watch — " +
                          tier + " confidence"
                      ),
                      "store_id": store_id,
                      "store_name": store_name,
                      "retailer": chain,
                      "predicted_date": predicted.isoformat(),
                      "source_url": source,
                      "confidence": tier,
                      "basis": basis,
                      "kind": "Unconfirmed watch window",
                      "inventory_status": "Unknown",
                      "delivery_confirmed": False
                  })

          # Upcoming official releases are launch-watch
          # signals, never confirmed store deliveries.
          releases = []
          seen_releases = set()

          for p in products:
              if not isinstance(p, dict):
                  continue

              d = date_of(p.get("release_date"))
              if not d:
                  continue

              if not TODAY <= d <= TODAY + timedelta(days=45):
                  continue

              name = clean(p.get("name"))
              game = clean(p.get("game"))
              url = clean(p.get("url"))

              if not name or not url:
                  continue

              # Only official catalogue sources.
              if clean(p.get("source")).lower() \
                      != "official catalogue":
                  continue

              k = (name, d.isoformat())
              if k in seen_releases:
                  continue
              seen_releases.add(k)

              releases.append({
                  "name": name,
                  "game": game,
                  "date": d.isoformat(),
                  "source_url": url,
                  "status": "Official release date",
                  "store_stock_confirmed": False
              })

          # Preserve existing confirmed events.
          # Do not overwrite other data fields.
          shipments["events"] = events

          # Existing website renders these forecasts.
          # Limit display volume, with local stores first.
          shipments["forecasts"] = forecasts[:500]

          save("shipments.json", shipments)

          save("v30_restock_forecasts.json", model_details)
          save("v30_release_watch.json", releases)

          report = {
              "version": "30.0",
              "checked_at": STAMP,
              "api_keys_required": False,
              "stores_evaluated": len(model_details),
              "stores_by_chain": dict(covered),
              "historically_supported": sum(
                  x["observation_count"] >= 3
                  for x in model_details
              ),
              "research_only": sum(
                  x["confidence"] == "Research only"
                  for x in model_details
              ),
              "unknown": sum(
                  x["confidence"] == "Unknown"
                  for x in model_details
              ),
              "forecasts_published": len(
                  shipments["forecasts"]
              ),
              "official_releases_watched": len(releases),
              "verified_inventory_claims_created": 0,
              "notes": [
                  "General freight days are not proof of TCG delivery",
                  "Online drops are not physical-store deliveries",
                  "Research-based dates are unverified watch windows",
                  "Local predictions require dated store-specific evidence",
                  "No stock quantities or delivery confirmations are invented"
              ]
          }

          save("v30_report.json", report)

          print(json.dumps(report, indent=2))

          PY

          python /tmp/pokestock_v30.py

      - name: Validate output
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for name in [
              "shipments.json",
              "v30_restock_forecasts.json",
              "v30_release_watch.json",
              "v30_report.json"
          ]:
              path = Path("data") / name
              assert path.exists(), name
              json.loads(path.read_text(encoding="utf-8"))

          shipments = json.loads(
              Path("data/shipments.json").read_text(
                  encoding="utf-8"
              )
          )

          assert isinstance(shipments["events"], list)
          assert isinstance(shipments["forecasts"], list)

          for row in shipments["forecasts"]:
              assert row["inventory_status"] == "Unknown"
              assert row["delivery_confirmed"] is False

          print("V30 validation passed")
          PY

      - name: Publish results
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "pokestock-bot"
          git config user.email \
            "actions@users.noreply.github.com"

          git add \
            data/shipments.json \
            data/v30_restock_forecasts.json \
            data/v30_release_watch.json \
            data/v30_report.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "V30 update restock forecasts"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Forecasts published"
              exit 0
            fi

            sleep 5
          done

          echo "Publish failed"
          exit 1
