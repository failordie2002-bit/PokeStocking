      - name: Activate redesigned homepage and retain all old pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY41_INSTALL'
          from pathlib import Path
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          for marker in ('</head>','</body>','id="stores"','id="online"','id="shipments"'):
              assert marker in h, 'Existing site differs; stopped safely: '+marker
          css='<link rel="stylesheet" href="assets/pokestock2.css">'
          js='<script defer src="assets/pokestock2.js"></script>'
          if css not in h: h=h.replace('</head>',css+'\n</head>',1)
          if js not in h: h=h.replace('</body>',js+'\n</body>',1)
          assert h.count(css)==1 and h.count(js)==1
          p.write_text(h,encoding='utf-8')
          PY41_INSTALL

      - name: Validate current evidence sources and existing features
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/pokestock2.js
          python3 - <<'PY41_TEST'
          from pathlib import Path
          import json
          h=Path('index.html').read_text(encoding='utf-8')
          j=Path('assets/pokestock2.js').read_text(encoding='utf-8')
          c=Path('assets/pokestock2.css').read_text(encoding='utf-8')
          for s in ('assets/pokestock2.js','assets/pokestock2.css','assets/collector40.js','assets/independent38.js','assets/alerts37.js','id="stores"','id="online"'):
              assert s in h, 'Legacy or new page reference missing: '+s
          for s in ('data/stores.json','data/unified_online_39.json','data/social_media_feed.json','data/v34_public_sightings.json','data/store_outlook_40.json','data/v30_release_watch.json','data/upcoming_drops_28.json','router.project-osrm.org','watchPosition','ps2-social','ps2-forecast','data-embed'):
              assert s in j, 'App component missing: '+s
          assert 'body.ps2-ready>main' in c
          assert isinstance(json.loads(Path('data/stores.json').read_text()),list)
          assert isinstance(json.loads(Path('data/unified_online_39.json').read_text()),list)
          assert isinstance(json.loads(Path('data/store_outlook_40.json').read_text()).get('stores'),list)
          print('SCRIPT 41 PASS: four tabs, local GPS, route guidance, media support, announcements, charts, existing tools preserved')
          PY41_TEST

      - name: Publish the redesigned website to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/pokestock2.js assets/pokestock2.css
          if git diff --cached --quiet; then
            echo 'Already installed; no new commit needed.'
            exit 0
          fi
          git commit -m 'Pokestock 41 install bold four-tab collector app'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Concurrent changes preserved; rebase conflict, no forced overwrite.'
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'SCRIPT 41 SUCCESS: published to main'
              exit 0
            fi
            sleep 5
          done
          echo 'Could not publish; existing site unchanged.'
          exit 1
