name: Pokestock Script 44 Costco and Sams Club Radar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pokestock_warehouse_44.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: pokestock-warehouse-monitor
  cancel-in-progress: false

jobs:
  warehouse-radar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current Pokestock
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install lightweight public page reader
        run: python3 -m pip install --quiet requests beautifulsoup4

      - name: Write Costco and Sams Club evidence scanner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts data assets
          cat > scripts/warehouse44.py <<'PY44'
          """Public TCG listings and sourced Costco allocations; never guesses shelf stock."""
          import json, re, time, unicodedata
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit, quote
          from urllib.robotparser import RobotFileParser
          import requests
          from bs4 import BeautifulSoup
          import xml.etree.ElementTree as ET

          NOW = datetime.now(timezone.utc)
          DATA = Path('data')
          DATA.mkdir(exist_ok=True)
          UA = 'PokeStockPublicResearch/1.0 (+https://github.com/failordie2002-bit/PokeStocking)'
          SESSION = requests.Session()
          SESSION.headers.update({
              'User-Agent': UA,
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.5'
          })
          ALLOCATION = 'https://restockd.app/pokemon-in-store?allocation=costco-30th'

          SEEDS = {
              "Sam's Club": [
                  'https://www.samsclub.com/ip/seort/17210852415',
                  'https://www.samsclub.com/ip/pokemon-tcg-charizard-ex-super-premium-collection/15488968285'
              ],
              'Costco': [
                  'https://www.costco.com/p/-/pokmon-5-pack-mini-tins-galar-pals-plus-4-promo-cards/4000092043',
                  'https://www.costco.com/p/-/pokmon-5-pack-mini-tins-sinnoh-stars-plus-4-promo-cards/4000092037',
                  'https://www.costco.com/p/-/pokmon-collectors-chest--great-ball--ultra-ball--3-eevee-promo-cards/100791463'
              ]
          }
          DISCOVERY = {
              "Sam's Club": [
                  'https://www.samsclub.com/s/pokemon%20trading%20cards',
                  'https://www.samsclub.com/s/pokemon%20elite%20trainer'
              ],
              'Costco': [
                  'https://www.costco.com/s?keyword=pokemon%20trading%20cards',
                  'https://www.costco.com/s?keyword=pokemon%20booster'
              ]
          }

          REPORT = {
              'checked_at': NOW.isoformat(),
              'sources': {},
              'robots': {},
              'notes': [],
              'explicit_shipping_available': 0,
              'explicit_shipping_unavailable': 0,
              'status_unknown': 0,
              'access_restricted': 0,
              'official_products_checked': 0,
              'third_party_allocation_rows': 0
          }
          ROBOTS = {}
          CHECKED = 0

          def load(name, default):
              try:
                  x = json.loads(
                      (DATA / name).read_text(encoding='utf-8')
                  )
                  return x if isinstance(x, type(default)) else default
              except (OSError, ValueError):
                  return default

          def norm(s):
              return (
                  unicodedata.normalize('NFKD', str(s or ''))
                  .encode('ascii', 'ignore')
                  .decode().lower()
              )

          def tcg(title):
              s = norm(title)
              game = bool(re.search(
                  r'pokemon|union arena|lorcana|one piece|gundam|digimon|yu.gi.oh|magic the gathering|riftbound|dragon ball|weiss schwarz|cardfight',
                  s
              ))
              sealed = bool(re.search(
                  r'booster|trading cards?|card game|tcg|elite trainer|\betb\b|mini tins?|pok[e]? ball|collector.s chest|premium collection|starter deck|trading card box',
                  s
              ))
              return game and sealed

          def retailer(url):
              try:
                  p = urlsplit(url)
                  host = (p.hostname or '').lower().removeprefix('www.')
                  if p.scheme != 'https':
                      return None
                  if host == 'costco.com' and (
                      p.path.startswith('/p/') or
                      p.path.endswith('.html')
                  ):
                      return 'Costco'
                  if host == 'samsclub.com' and p.path.startswith('/ip/'):
                      return "Sam's Club"
              except ValueError:
                  pass
              return None

          def canonical(url):
              try:
                  p = urlsplit(url)
                  return urlunsplit((
                      'https', p.netloc.lower(),
                      p.path.rstrip('/'), '', ''
                  ))
              except (TypeError, ValueError):
                  return ''

          def allowed(url):
              try:
                  host = urlsplit(url).hostname
              except ValueError:
                  return False, 'invalid_url'
              if not host:
                  return False, 'invalid_host'

              if host not in ROBOTS:
                  base = 'https://' + host + '/robots.txt'
                  try:
                      res = SESSION.get(base, timeout=9)
                      if res.status_code in (401, 403):
                          ROBOTS[host] = (None, 'robots_disallow')
                      elif res.status_code == 200:
                          rp = RobotFileParser()
                          rp.parse(res.text.splitlines())
                          ROBOTS[host] = (rp, 'robots_checked')
                      elif res.status_code == 404:
                          ROBOTS[host] = (None, 'robots_absent')
                      else:
                          ROBOTS[host] = (None, 'robots_unavailable')
                  except requests.RequestException:
                      ROBOTS[host] = (None, 'robots_unavailable')
                  REPORT['robots'][host] = ROBOTS[host][1]

              rp, state = ROBOTS[host]
              if state in (
                  'robots_disallow', 'robots_unavailable'
              ):
                  return False, state
              if rp and not rp.can_fetch(UA, url):
                  return False, 'robots_disallow_path'
              return True, 'allowed'

          def get(url):
              global CHECKED
              permit, why = allowed(url)
              if not permit:
                  return None, why

              try:
                  if CHECKED:
                      time.sleep(0.7)
                  CHECKED += 1
                  r = SESSION.get(
                      url, timeout=16, allow_redirects=True
                  )
                  if r.status_code in (401, 403, 429):
                      return None, 'access_restricted_' + str(r.status_code)
                  if r.status_code in (404, 410):
                      return None, 'not_found'
                  if r.status_code != 200:
                      return None, 'http_' + str(r.status_code)
                  if not (
                      r.url.startswith('https://') and
                      len(r.content) < 3_000_000
                  ):
                      return None, 'unexpected_response'
                  content_type = r.headers.get('Content-Type', '').lower()
                  if 'html' not in content_type and 'xml' not in content_type:
                      return None, 'not_html'
                  s = r.text
                  if re.search(
                      r'captcha|verify you are human|unusual traffic|access denied',
                      s[:4000], re.I
                  ):
                      return None, 'access_challenge'
                  return s, 'ok'
              except requests.RequestException:
                  return None, 'network_unavailable'

          def offer_ld(soup, title):
              states = []
              prices = []
              for tag in soup.find_all(
                  'script', type='application/ld+json'
              )[:30]:
                  try:
                      tree = json.loads(
                          tag.string or tag.get_text() or '{}'
                      )
                  except (ValueError, TypeError):
                      continue
                  stack = [tree]
                  for _ in range(120):
                      if not stack:
                          break
                      item = stack.pop()
                      if isinstance(item, list):
                          stack.extend(item)
                          continue
                      if not isinstance(item, dict):
                          continue
                      stack.extend(
                          v for k, v in item.items()
                          if k in (
                              '@graph', 'mainEntity', 'itemListElement'
                          ) and isinstance(v, (dict, list))
                      )
                      typ = item.get('@type', [])
                      types = typ if isinstance(typ, list) else [typ]
                      if not any(
                          str(t).lower() == 'product'
                          for t in types
                      ):
                          continue
                      ldname = norm(item.get('name', ''))
                      if ldname and title and not (
                          ldname[:18] in norm(title) or
                          norm(title)[:18] in ldname
                      ):
                          continue
                      off = item.get('offers', [])
                      off = off if isinstance(off, list) else [off]
                      for v in off:
                          if not isinstance(v, dict):
                              continue
                          a = str(
                              v.get('availability', '')
                          ).lower().split('/')[-1]
                          if a in ('instock', 'outofstock'):
                              states.append(a)
                          pr = v.get('price')
                          if pr is not None and re.fullmatch(
                              r'\d+(?:\.\d{1,2})?', str(pr)
                          ):
                              prices.append(str(pr))
              state = (
                  states[0]
                  if len(set(states)) == 1 and states
                  else None
              )
              return state, (prices[0] if prices else None)

          def product_page(url, old):
              brand = retailer(url)
              if not brand:
                  return None
              record = {
                  'retailer': brand,
                  'url': canonical(url),
                  'title': old.get('title', ''),
                  'shipping_status': 'unverified',
                  'price': None,
                  'currency': None,
                  'checked_at': NOW.isoformat(),
                  'last_accessible_at': old.get('last_accessible_at'),
                  'evidence': 'Product listing; shipping not established',
                  'member_club_required': True,
                  'local_pickup_verified': False,
                  'shelf_inventory_verified': False
              }
              page, outcome = get(url)
              record['access_result'] = outcome

              if page is None:
                  record['shipping_status'] = 'access_unavailable'
                  record['evidence'] = (
                      'The public product page could not be confirmed '
                      'during this scan; not a stock result'
                  )
                  return record

              soup = BeautifulSoup(page, 'html.parser')
              head = soup.find('h1')
              title = (
                  head.get_text(' ', strip=True)
                  if head else ''
              )
              if not title:
                  mt = soup.find('meta', property='og:title')
                  title = mt.get('content', '') if mt else ''
              title = ' '.join(title.split())[:180]

              if not tcg(title):
                  record['shipping_status'] = 'access_unavailable'
                  record['evidence'] = (
                      'No trustworthy TCG product title in the page'
                  )
                  return record

              record['title'] = title
              record['last_accessible_at'] = NOW.isoformat()
              state, ldprice = offer_ld(soup, title)
              content = re.sub(
                  r'\s+', ' ', ' '.join(soup.stripped_strings)
              )

              status = 'unverified'
              reason = (
                  'The product page exists, but unscoped online '
                  'shipping availability is not explicit'
              )

              if state == 'instock':
                  status = 'shipping_available_observed'
                  reason = (
                      'Product structured data explicitly reported '
                      'InStock; online offer only'
                  )
              elif state == 'outofstock':
                  status = 'shipping_unavailable_observed'
                  reason = (
                      'Product structured data explicitly reported '
                      'OutOfStock'
                  )
              elif brand == "Sam's Club":
                  if re.search(
                      r'\bShipping\s+Not available\b',
                      content, re.I
                  ):
                      status = 'shipping_unavailable_observed'
                      reason = (
                          'Sam’s Club product page explicitly says '
                          'Shipping Not available'
                      )
                  elif re.search(
                      r'\bAvailable for Shipping\b',
                      content, re.I
                  ):
                      status = 'shipping_available_observed'
                      reason = (
                          'Sam’s Club product page explicitly says '
                          'Available for Shipping'
                      )
              elif brand == 'Costco' and re.search(
                  r'expected to be in stock and available for purchase soon',
                  content, re.I
              ):
                  status = 'shipping_unavailable_observed'
                  reason = (
                      'Costco product page says expected '
                      'to be in stock soon'
                  )

              record['shipping_status'] = status
              record['evidence'] = reason
              if ldprice:
                  record['price'] = ldprice
                  record['currency'] = 'USD'
              elif brand == "Sam's Club":
                  m = re.search(
                      r'Current price is USD\s*\$?\s*(\d+(?:\.\d{1,2})?)',
                      content, re.I
                  )
                  if m:
                      record['price'] = m.group(1)
                      record['currency'] = 'USD'
              return record

          def discover():
              urls = {
                  canonical(x)
                  for group in SEEDS.values() for x in group
              }
              previous = load('warehouse_watch_44.json', {})
              for old in previous.get('products', []):
                  if isinstance(old, dict) and retailer(
                      old.get('url', '')
                  ):
                      urls.add(canonical(old['url']))

              # Old alerts help find official URLs, never current stock.
              for x in load('alert_events_37.json', []):
                  if not isinstance(x, dict):
                      continue
                  link = (
                      x.get('retailer_url') or
                      x.get('source_url') or ''
                  )
                  if retailer(link) and tcg(
                      x.get('product_name', '')
                  ):
                      urls.add(canonical(link))

              # Public discovery; all blocked sources are skipped.
              for brand, searches in DISCOVERY.items():
                  for url in searches:
                      doc, result = get(url)
                      REPORT['sources'][url] = result
                      if not doc:
                          continue
                      s = BeautifulSoup(doc, 'html.parser')
                      for a in s.find_all('a', href=True)[:2000]:
                          link = requests.compat.urljoin(
                              url, a.get('href', '')
                          )
                          label = (
                              a.get_text(' ', strip=True) or
                              a.get('aria-label', '')
                          )
                          if retailer(link) == brand and tcg(label):
                              urls.add(canonical(link))

              if len(urls) < 55:
                  for brand, domain in [
                      ('Costco', 'costco.com'),
                      ("Sam's Club", 'samsclub.com')
                  ]:
                      suffix = (
                          ' /p/ pokemon trading cards'
                          if brand == 'Costco'
                          else ' /ip/ pokemon elite trainer box'
                      )
                      term = 'site:' + domain + suffix
                      url = (
                          'https://www.bing.com/search?q='
                          + quote(term) + '&format=rss'
                      )
                      xml, result = get(url)
                      REPORT['sources']['Bing RSS ' + brand] = result
                      if not xml:
                          continue
                      try:
                          tree = ET.fromstring(xml)
                          for node in tree.findall('.//item')[:30]:
                              link = (
                                  node.findtext('link') or ''
                              ).strip()
                              title = (
                                  node.findtext('title') or ''
                              ).strip()
                              if retailer(link) == brand and tcg(title):
                                  urls.add(canonical(link))
                      except ET.ParseError:
                          REPORT['sources']['Bing RSS ' + brand] = (
                              'unreadable_xml'
                          )
              return sorted(
                  u for u in urls if retailer(u)
              )[:55]

          def parse_allocation():
              page, outcome = get(ALLOCATION)
              REPORT['sources'][
                  'Costco independent allocation source'
              ] = outcome
              if not page:
                  return [], None

              soup = BeautifulSoup(page, 'html.parser')
              title = soup.get_text(' ', strip=True)
              dated = re.search(
                  r'Updated\s+(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{1,2})',
                  title, re.I
              )
              as_of = None
              if dated:
                  try:
                      as_of = datetime.strptime(
                          dated.group(1) + ' ' +
                          dated.group(2) + ' ' +
                          str(NOW.year),
                          '%B %d %Y'
                      ).date().isoformat()
                  except ValueError:
                      pass

              rows = []
              for table in soup.find_all('table'):
                  headings = ' '.join(
                      x.get_text(' ', strip=True).lower()
                      for x in table.find_all('th')
                  )
                  if not all(
                      word in headings
                      for word in (
                          'on hand', 'on order', 'in transit'
                      )
                  ):
                      continue

                  for tr in table.find_all('tr'):
                      cells = tr.find_all('td')
                      if len(cells) < 6:
                          continue
                      names = [
                          c.get_text(' ', strip=True)
                          for c in cells[:6]
                      ]
                      try:
                          hand, order, transit = [
                              int(re.sub(r'[^\d]', '', n))
                              for n in names[3:6]
                          ]
                      except ValueError:
                          continue

                      number = names[1].strip()
                      if not re.fullmatch(r'\d{1,6}', number):
                          continue

                      rows.append({
                          'name': names[0][:130],
                          'warehouse_number': number,
                          'address': names[2][:200],
                          'reported_on_hand': hand,
                          'reported_on_order': order,
                          'reported_in_transit': transit,
                          'product_name': (
                              'Pokémon 30th Celebration '
                              'ETB + Booster Bundle'
                          ),
                          'item_number': '2007496',
                          'reported_as_of': as_of,
                          'source_url': ALLOCATION,
                          'evidence_class': (
                              'third_party_allocation_unverified'
                          ),
                          'shelf_stock_confirmed': False
                      })
              return rows[:500], as_of

          def main():
              previous = load('warehouse_watch_44.json', {})
              prev_by = {
                  x.get('url'): x
                  for x in previous.get('products', [])
                  if isinstance(x, dict)
              }

              candidates = discover()
              products = []
              transitions = load('warehouse_changes_44.json', [])

              for url in candidates:
                  previous_item = prev_by.get(url, {})
                  x = product_page(url, previous_item)
                  if not x:
                      continue
                  products.append(x)
                  oldstate = previous_item.get('shipping_status')
                  newstate = x['shipping_status']

                  if (
                      oldstate in (
                          'shipping_available_observed',
                          'shipping_unavailable_observed'
                      )
                      and newstate in (
                          'shipping_available_observed',
                          'shipping_unavailable_observed'
                      )
                      and oldstate != newstate
                  ):
                      transitions.append({
                          'url': url,
                          'retailer': x['retailer'],
                          'product': x['title'],
                          'previous': oldstate,
                          'observed': newstate,
                          'at': NOW.isoformat(),
                          'evidence': x['evidence'],
                          'note': (
                              'Observed storefront transition, '
                              'not a confirmed purchase'
                          )
                      })

              allocations, as_of = parse_allocation()
              REPORT['third_party_allocation_rows'] = len(allocations)
              REPORT['official_products_checked'] = len(products)

              for x in products:
                  status = x['shipping_status']
                  if status == 'shipping_available_observed':
                      REPORT['explicit_shipping_available'] += 1
                  elif status == 'shipping_unavailable_observed':
                      REPORT['explicit_shipping_unavailable'] += 1
                  elif status == 'access_unavailable':
                      REPORT['access_restricted'] += 1
                  else:
                      REPORT['status_unknown'] += 1

              transitions = [
                  x for x in transitions
                  if isinstance(x, dict)
              ][-300:]

              payload = {
                  'version': '44.0',
                  'checked_at': NOW.isoformat(),
                  'products': products,
                  'allocations': allocations,
                  'allocation_reported_as_of': as_of,
                  'summary': REPORT,
                  'limitations': [
                      'Product listings and shipping do not establish store shelf inventory.',
                      'Sam’s pickup depends on the shopper’s selected club; no generic scan verifies it.',
                      'Costco third-party allocation figures are unverified, dated, and not guaranteed on shelves.',
                      'Inaccessible pages are not considered sold out or in stock.'
                  ]
              }

              for name, content in [
                  ('warehouse_watch_44.json', payload),
                  ('warehouse_changes_44.json', transitions)
              ]:
                  (DATA / name).write_text(
                      json.dumps(
                          content, indent=2, ensure_ascii=False
                      ) + '\n',
                      encoding='utf-8'
                  )

              print(json.dumps({
                  k: v for k, v in REPORT.items()
                  if k not in ('sources', 'robots')
              }, indent=2))
              print('Sources:', json.dumps(REPORT['sources']))

          if __name__ == '__main__':
              main()
          PY44

          python3 -m py_compile scripts/warehouse44.py

      - name: Write compact in-site Warehouse Club Radar
        shell: bash
        run: |
          set -euo pipefail

          cat > assets/warehouse44.css <<'CSS44'
          /* Script 44: restrained, evidence-only warehouse club cards */
          #ps2root .ps44{margin:17px 0 20px;background:linear-gradient(125deg,#18283b,#1b2039);border:1px solid #4a5474;border-radius:17px;padding:16px}
          #ps2root .ps44-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
          #ps2root .ps44-head h2{font-size:17px;margin:0}
          #ps2root .ps44-sub{font-size:12px;color:#bccbe2;margin:7px 0 13px}
          #ps2root .ps44-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
          #ps2root .ps44-card{border:1px solid #53627d;background:#111b2c;border-radius:12px;padding:13px;min-width:0}
          #ps2root .ps44-card h3{font-size:15px;margin:3px 0 9px}
          #ps2root .ps44-card p{font-size:11px;color:#b6c5dc;line-height:1.5;margin:6px 0}
          #ps2root .ps44-pill{display:inline-block;background:#302c48;color:#e9d0ff;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:750}
          #ps2root .ps44-pill.good{background:#193c35;color:#8cf4d4}
          #ps2root .ps44-pill.warn{background:#4b362b;color:#ffd297}
          #ps2root .ps44-products{display:grid;grid-template-columns:1fr;gap:6px;margin-top:11px}
          #ps2root .ps44-product{border-top:1px solid #34445c;padding-top:10px;font-size:12px;line-height:1.45;color:#f3f5fb}
          #ps2root .ps44-product small{color:#aebed6;display:block;margin-top:4px}
          #ps2root .ps44 a{color:#bdd7ff;font-weight:700;font-size:11px}
          #ps2root .ps44 button{border:1px solid #607394;background:#263652;color:#f7faff;border-radius:9px;padding:8px 11px;font-weight:800;font-size:11px}
          #ps2root .ps44-localrow{padding:9px 0;border-top:1px solid #34445a;display:flex;gap:10px;justify-content:space-between;align-items:center}
          #ps2root .ps44-localrow strong{font-size:12px;display:block}
          #ps2root .ps44-localrow span{font-size:11px;color:#b6c6df}
          #ps2root .ps44-extra{margin-top:11px;color:#b8c7dd;font-size:11px}
          #ps2root .ps44[hidden]{display:none!important}
          @media(max-width:490px){#ps2root .ps44-grid{grid-template-columns:1fr}#ps2root .ps44{padding:13px}}
          CSS44

          cat > assets/warehouse44.js <<'JS44'
          (()=>{
          'use strict';

          const root=document.getElementById('ps2root');
          if(!root||document.getElementById('ps44Radar'))return;

          const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({
            '&':'&amp;','<':'&lt;','>':'&gt;',
            '"':'&quot;',"'":'&#39;'
          }[c]));

          const url=x=>{
            try{
              const u=new URL(x);
              return u.protocol==='https:'?u.href:'';
            }catch{return '';}
          };

          const age=x=>{
            const n=Date.parse(x);
            return Number.isFinite(n)?
              (Date.now()-n)/3600000:Infinity;
          };

          const moment=x=>{
            const d=new Date(x);
            return Number.isFinite(+d)?
              d.toLocaleString(undefined,{
                month:'short',day:'numeric',
                hour:'numeric',minute:'2-digit'
              }):'Unspecified';
          };

          const kmiles=(a,b,c,d)=>{
            const r=Math.PI/180;
            const h=Math.sin((c-a)*r/2)**2+
              Math.cos(a*r)*Math.cos(c*r)*
              Math.sin((d-b)*r/2)**2;
            return 3958.8*2*Math.asin(
              Math.min(1,Math.sqrt(h))
            );
          };

          const get=async(path,def)=>{
            try{
              const r=await fetch(
                path+'?q='+Date.now(),
                {cache:'no-store'}
              );
              return r.ok?await r.json():def;
            }catch{return def;}
          };

          let data={
            products:[],allocations:[],summary:{}
          };
          let shops=[];

          const panel=document.createElement('section');
          panel.id='ps44Radar';
          panel.className='ps44';

          panel.innerHTML=`
            <div class="ps44-head">
              <h2>🏬 Costco & Sam’s Club</h2>
              <span class="ps44-pill">Warehouse club radar</span>
            </div>
            <p class="ps44-sub">
              Public TCG listings, recorded shipping signals,
              and nearby club locations. Not shelf inventory.
            </p>
            <div class="ps44-grid" id="ps44Cards">
              <p>Checking warehouse product sources…</p>
            </div>
            <details class="ps44-extra">
              <summary>Nearby clubs and source details</summary>
              <div id="ps44Local">
                Set GPS or ZIP in Near Me to personalize clubs.
              </div>
              <p>
                Sam’s pickup requires selecting your club on
                its website; Costco warehouse stock may only
                appear for eligible items and selected
                locations. Unverified allocations are
                historical research, not live stock.
              </p>
            </details>`;

          const discover=document.getElementById('ps2-discover');
          const games=document.getElementById('ps2Games');

          if(!discover)return;

          if(games)games.after(panel);
          else discover.prepend(panel);

          const local=document.createElement('div');
          local.id='ps44Near';
          local.className='ps44';
          local.innerHTML=`
            <div class="ps44-head">
              <h2>Warehouse clubs near you</h2>
              <span class="ps44-pill">Costco / Sam’s Club</span>
            </div>
            <p class="ps44-sub">
              Club locations only. Shipping signals are nationwide;
              pickup and shelf status are not verified here.
            </p>
            <div id="ps44NearList">
              Set GPS or ZIP above to find nearby clubs.
            </div>`;

          const status=document.getElementById('ps2LocateStatus');
          if(status)status.after(local);

          function locationValue(){
            try{
              const x=JSON.parse(
                localStorage.getItem('ps2location')||'null'
              );
              return x&&Number.isFinite(+x.lat)&&
                Number.isFinite(+x.lon)&&
                Math.abs(+x.lat)<=90&&Math.abs(+x.lon)<=180?
                x:null;
            }catch{return null;}
          }

          function club(s){
            const n=String(s.name||'').trim().toLowerCase();
            return n==='costco'||
              n==='costco wholesale'||
              n==="sam's club"||
              n==='sams club';
          }

          function nearList(){
            const p=locationValue();
            const radius=Number(
              localStorage.getItem('ps2radius')
            )||50;

            if(!p)return null;

            return shops
              .filter(s=>
                club(s)&&s.lat!=null&&s.lon!=null&&
                Number.isFinite(+s.lat)&&
                Number.isFinite(+s.lon)
              )
              .map(s=>({
                ...s,
                miles:kmiles(
                  +p.lat,+p.lon,+s.lat,+s.lon
                )
              }))
              .filter(s=>s.miles<=radius)
              .sort((a,b)=>a.miles-b.miles)
              .slice(0,8);
          }

          function localLine(s){
            const key=String(s.address||'')
              .toLowerCase().replace(/[^a-z0-9]/g,'');

            const reports=(data.allocations||[]).filter(a=>{
              const ad=String(a.address||'')
                .toLowerCase().replace(/[^a-z0-9]/g,'');
              return (s.name||'').toLowerCase()
                .includes('costco')&&
                key.length>=7&&ad.includes(key);
            });

            const report=reports[0];
            const date=report?.reported_as_of;
            const days=date?
              age(date+'T23:59:00Z')/24:Infinity;

            const allocation=report&&days>=0&&days<=7?`
              <p>
                Third-party allocation, as of ${esc(date)}:
                reported on hand ${report.reported_on_hand},
                on order ${report.reported_on_order},
                in transit ${report.reported_in_transit}.
                <b>Not verified shelf stock.</b>
              </p>`:'';

            return `
              <div class="ps44-localrow">
                <div>
                  <strong>
                    ${esc(s.name)} · ${s.miles.toFixed(1)} mi
                  </strong>
                  <span>
                    ${esc([
                      s.address,s.city,s.state
                    ].filter(Boolean).join(', '))}
                  </span>
                  ${allocation}
                </div>
                <button type="button"
                  data-ps44-route="${esc(s.id)}">
                  Route
                </button>
              </div>`;
          }

          function renderNearby(){
            const items=nearList();
            let message=(
              'Choose GPS or ZIP in Near Me to '+
              'show club locations near you.'
            );

            if(items){
              message=items.length?
                items.map(localLine).join(''):
                'No listed Costco or Sam’s Club inside the selected radius.';
            }

            const a=document.getElementById('ps44Local');
            const b=document.getElementById('ps44NearList');
            if(a)a.innerHTML=message;
            if(b)b.innerHTML=message;
          }

          function product(x){
            const good=(
              x.shipping_status==='shipping_available_observed'
            );
            const bad=(
              x.shipping_status==='shipping_unavailable_observed'
            );
            const status=good?
              'Shipping observed available':
              bad?'Shipping observed unavailable':
              'Availability unverified';

            const dated=x.checked_at&&age(x.checked_at)<48?
              moment(x.checked_at):'Previous check';

            const price=x.price&&x.currency==='USD'?
              ' · observed $'+esc(x.price):'';

            return `
              <div class="ps44-product">
                <strong>
                  ${esc(x.title||'Previously indexed TCG product')}
                </strong>
                <br>
                <span class="ps44-pill ${good?'good':bad?'warn':''}">
                  ${status}
                </span>
                <small>
                  ${esc(x.evidence||'Source evidence unavailable')}
                  · ${esc(dated)}${price}
                </small>
                <details>
                  <summary>Official product source</summary>
                  ${url(x.url)?`
                    <a href="${esc(url(x.url))}"
                       target="_blank" rel="noopener noreferrer">
                      View at ${esc(x.retailer)}
                    </a>`:''}
                </details>
              </div>`;
          }

          function draw(){
            const brands=["Sam's Club",'Costco'];
            const items=brands.map(brand=>{
              const records=(data.products||[])
                .filter(x=>x.retailer===brand)
                .sort((a,b)=>
                  Number(
                    b.shipping_status==='shipping_available_observed'
                  )-
                  Number(
                    a.shipping_status==='shipping_available_observed'
                  )
                );

              const accessible=records.filter(x=>
                x.shipping_status!=='access_unavailable'
              );
              const available=records.filter(x=>
                x.shipping_status==='shipping_available_observed'
              );

              return `
                <article class="ps44-card">
                  <h3>${esc(brand)}</h3>
                  <span class="ps44-pill ${available.length?'good':''}">
                    ${available.length?
                      available.length+' reported shipping available':
                      accessible.length?
                      accessible.length+' product pages examined':
                      'No accessible product evidence'}
                  </span>
                  <p>
                    ${brand==='Costco'?
                      'Warehouse availability depends on the selected location.':
                      'Pickup and delivery require a selected club.'}
                  </p>
                  <div class="ps44-products">
                    ${records.slice(0,3).map(product).join('')||
                      '<p>No accessible TCG listings currently confirmed.</p>'}
                  </div>
                </article>`;
            });

            document.getElementById('ps44Cards').innerHTML=
              items.join('');
            renderNearby();
          }

          async function init(){
            const [w,stores]=await Promise.all([
              get('data/warehouse_watch_44.json',{}),
              get('data/stores.json',[])
            ]);

            if(w&&Array.isArray(w.products))data=w;
            shops=Array.isArray(stores)?stores:[];
            draw();
          }

          root.addEventListener('click',e=>{
            const b=e.target.closest('[data-ps44-route]');
            if(b){
              if(typeof window.ps44RouteTo==='function'){
                window.ps44RouteTo(b.dataset.ps44Route);
              }else{
                document.querySelector(
                  '[data-ps2-tab="near"]'
                )?.click();
              }
            }
          });

          document.addEventListener('click',e=>{
            if(e.target.closest(
              '#ps2GPS,#ps2ZipGo,#ps2Radius,'+
              '[data-ps2-tab],#ps2Place'
            )){
              requestAnimationFrame(renderNearby);
            }
          });

          window.addEventListener('storage',renderNearby);
          init();
          })();
          JS44

          node --check assets/warehouse44.js

      - name: Collect public evidence (no credentials or CAPTCHA bypass)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/warehouse44.py

      - name: Integrate warehouse radar without replacing features
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY44_SITE'
          from pathlib import Path

          h = Path('index.html')
          html = h.read_text(encoding='utf-8')
          j = Path('assets/pokestock2.js')
          script = j.read_text(encoding='utf-8')

          assert 'assets/pokestock2.js' in html
          assert 'ps2-discover' in script
          assert 'ps2-near' in script

          tag_css = (
              '<link rel="stylesheet" '
              'href="assets/warehouse44.css?v=44">'
          )
          tag_js = (
              '<script defer '
              'src="assets/warehouse44.js?v=44"></script>'
          )

          if tag_css not in html:
              html = html.replace(
                  '</head>', tag_css + '\n</head>', 1
              )
          if tag_js not in html:
              html = html.replace(
                  '</body>', tag_js + '\n</body>', 1
              )

          marker = (
              'function findStore(id){return stores.find('
              's=>String(s.id)===String(id));}'
          )
          bridge = (
              'window.ps44RouteTo=(id)=>{'
              'const s=findStore(id);if(s)routeTo(s);};'
          )

          if bridge not in script:
              if marker not in script:
                  raise SystemExit(
                      'Cannot safely attach existing GPS routing'
                  )
              script = script.replace(
                  marker, marker + '\n' + bridge, 1
              )

          assert html.count(tag_css) == 1
          assert html.count(tag_js) == 1
          assert script.count(bridge) == 1

          h.write_text(html, encoding='utf-8')
          j.write_text(script, encoding='utf-8')
          PY44_SITE

      - name: Verify data honesty site integrity and JS syntax
        shell: bash
        run: |
          set -euo pipefail

          python3 -m py_compile scripts/warehouse44.py
          node --check assets/pokestock2.js
          node --check assets/warehouse44.js

          python3 - <<'PY44_TEST'
          import json
          from pathlib import Path

          data = json.loads(
              Path('data/warehouse_watch_44.json').read_text()
          )

          assert data['version'] == '44.0'
          assert isinstance(data['products'], list)
          assert isinstance(data['allocations'], list)

          assert all(
              x['shelf_inventory_verified'] is False
              and x['local_pickup_verified'] is False
              for x in data['products']
          )

          assert all(
              x['shelf_stock_confirmed'] is False
              for x in data['allocations']
          )

          html = Path('index.html').read_text()
          js = Path('assets/pokestock2.js').read_text()

          for item in (
              'assets/warehouse44.js?v=44',
              'assets/warehouse44.css?v=44',
              'assets/pokestock2.js',
              'assets/pokestock2.css'
          ):
              assert item in html, item

          for item in (
              'ps2-discover',
              'ps2-near',
              'ps2-social',
              'ps2-forecast',
              'router.project-osrm.org',
              'ps44RouteTo'
          ):
              assert item in js, item

          print(
              'SCRIPT 44 PASS: official sources, '
              'no false shelf claims, site preserved'
          )
          PY44_TEST

      - name: Publish independent research and website add-on
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            scripts/warehouse44.py \
            assets/warehouse44.css \
            assets/warehouse44.js \
            assets/pokestock2.js \
            data/warehouse_watch_44.json \
            data/warehouse_changes_44.json \
            index.html

          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi

          git commit -m 'Pokestock 44 add Costco and Sams Club evidence radar'

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Conflict: old site preserved'
              exit 1
            fi

            if git push origin HEAD:main; then
              echo 'SCRIPT 44 PUBLISHED'
              exit 0
            fi

            sleep 5
          done

          exit 1
