
name: PokeStock V9 Universal TCG Catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */4 * * *"

permissions:
  contents: write

# Use the same concurrency group as nationwide
# discovery so both jobs do not write data together.
concurrency:
  group: pokestock-monitor
  cancel-in-progress: false

jobs:
  catalogue:
    name: Discover New TCG Products
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install \
            requests beautifulsoup4

      - name: Check catalogue script
        run: |
          python -m py_compile \
            scripts/universal_catalogue.py

      - name: Record existing catalogue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/status.json")

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          products = data.get("products")
          releases = data.get("releases")

          if not isinstance(products, list):
              raise SystemExit("Invalid products list")

          if not isinstance(releases, list):
              raise SystemExit("Invalid releases list")

          baseline = {
              "products": len(products),
              "releases": len(releases),
              "store_inventory": data.get(
                  "store_inventory", []
              )
          }

          Path("/tmp/catalogue_baseline.json").write_text(
              json.dumps(baseline),
              encoding="utf-8"
          )

          print("Starting products:", len(products))
          print("Starting releases:", len(releases))
          PY

      - name: Discover official TCG products
        timeout-minutes: 12
        run: |
          python scripts/universal_catalogue.py

      - name: Validate catalogue preservation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          baseline = json.loads(
              Path(
                  "/tmp/catalogue_baseline.json"
              ).read_text(encoding="utf-8")
          )

          data = json.loads(
              Path(
                  "data/status.json"
              ).read_text(encoding="utf-8")
          )

          products = data.get("products")
          releases = data.get("releases")

          if not isinstance(products, list):
              raise SystemExit(
                  "Invalid updated products"
              )

          if not isinstance(releases, list):
              raise SystemExit(
                  "Invalid updated releases"
              )

          if len(products) < baseline["products"]:
              raise SystemExit(
                  "Product records were lost"
              )

          if len(releases) < baseline["releases"]:
              raise SystemExit(
                  "Release records were lost"
              )

          if (
              data.get("store_inventory", [])
              != baseline["store_inventory"]
          ):
              raise SystemExit(
                  "Store inventory was modified"
              )

          report = data.get("v9_catalogue", {})
          checks = report.get("source_checks", [])

          if not checks:
              raise SystemExit(
                  "No catalogue sources checked"
              )

          print("=== CATALOGUE VALIDATED ===")
          print("Total products:", len(products))
          print("Total releases:", len(releases))
          print(
              "New products:",
              report.get("products_added_this_run", 0)
          )

          for item in checks:
              print(
                  item.get("game"),
                  item.get("status"),
                  item.get("products_found", 0)
              )

          if all(
              item.get("status") == "error"
              for item in checks
          ):
              raise SystemExit(
                  "Every source check failed"
              )
          PY

      - name: Safely publish catalogue
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "pokestock-bot"
          git config user.email \
            "actions@users.noreply.github.com"

          git add data/status.json

          if git diff --cached --quiet; then
            echo "No catalogue changes."
            exit 0
          fi

          git commit -m \
            "Automatically expand PokeStock TCG catalogue"

          for attempt in 1 2 3; do
            echo "Publishing attempt $attempt"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "::error::Conflicting data update."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Catalogue published."
              exit 0
            fi

            sleep 3
          done

          echo "::error::Publishing failed."
          exit 1

      - name: Print catalogue summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/status.json")

          if not path.exists():
              print("Catalogue not found.")
              raise SystemExit(0)

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          report = data.get("v9_catalogue", {})

          print("=== POKESTOCK V9 ===")
          print(
              "Products:",
              len(data.get("products", []))
          )
          print(
              "Releases:",
              len(data.get("releases", []))
          )
          print(
              "New products:",
              report.get("products_added_this_run")
          )

          for check in report.get(
              "source_checks", []
          ):
              print(
                  check.get("game"),
                  ":",
                  check.get("status")
              )
          PY
